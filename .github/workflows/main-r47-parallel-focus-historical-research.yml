name: MAIN FOCUS Scientific Prediction Research

# Both independent jobs are eligible to run at the same time: no needs edges.
# Scheduled triggers are only active on GitHub's DEFAULT branch (main) if/when
# this draft change is deliberately accepted and merged. This feature-branch
# installation is run immediately by its isolated push event; it does NOT
# silently enable a production schedule.
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r47-parallel-focus-historical-research.yml
      - new-platform/backend/scripts/build_focus_research_checkpoint_r47.py
      - new-platform/backend/tests/test_parallel_focus_historical_r47.py
      - new-platform/backend/scripts/research_workstream_history.py
      - new-platform/backend/scripts/select_research_history_run.py
      - new-platform/backend/tests/test_research_workstream_history.py
      - new-platform/backend/scripts/refresh_focus_public_sources_r40.py
      - new-platform/backend/tests/test_focus_source_recovery_r40.py
  workflow_dispatch:
  schedule:
    - cron: '28 10 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: main-r47-focus-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focus-29-current-scientific-evidence-research:
    name: A — FOCUS 29 / 23 current source and scientific-evidence gap review
    if: github.repository == 'pdufa/pdufa-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONPATH: new-platform/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical 29/23 roster and independent research rules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python -m pip install pytest
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_parallel_focus_historical_r47.py tests/test_focus_registry_results_r42.py tests/test_focus_registry_safety_r44.py tests/test_focus_protocol_index_r46.py tests/test_research_workstream_history.py tests/test_focus_source_recovery_r40.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Locate the latest completed Track A history without changing either workstream
        id: previous_history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python new-platform/backend/scripts/select_research_history_run.py --track A
      - name: Restore the immutable Track A history artifact
        if: steps.previous_history.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_history.outputs.run_id }}
          name: ${{ steps.previous_history.outputs.artifact_name }}
          path: ${{ runner.temp }}/r47-focus/previous-history
      - name: Collect original present-day public primary results, posted safety and protocol document index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-focus/primary-original" "$RUNNER_TEMP/r47-focus/safety-original" "$RUNNER_TEMP/r47-focus/docs-original"
          python new-platform/backend/scripts/build_focus_registry_results_r42.py --output "$RUNNER_TEMP/r47-focus/primary.json" --raw-dir "$RUNNER_TEMP/r47-focus/primary-original"
          python new-platform/backend/scripts/build_focus_registry_safety_r44.py --output "$RUNNER_TEMP/r47-focus/safety.json" --raw-dir "$RUNNER_TEMP/r47-focus/safety-original"
          python new-platform/backend/scripts/build_focus_protocol_index_r46.py --output "$RUNNER_TEMP/r47-focus/documents.json" --raw-dir "$RUNNER_TEMP/r47-focus/docs-original"
      - name: Refresh the existing sponsor FDA and SEC source channels with exact byte receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-focus/application-original"
          python new-platform/backend/scripts/refresh_focus_public_sources_r40.py \
            --output "$RUNNER_TEMP/r47-focus/applications.json" --include-fda-addenda \
            --raw-dir "$RUNNER_TEMP/r47-focus/application-original" \
            --registry-raw-dir "$RUNNER_TEMP/r47-focus/primary-original"
      - name: Generate all23 application research records with cutoff counterevidence and ABSTAIN gates
        shell: bash
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/build_focus_research_checkpoint_r47.py \
            --primary "$RUNNER_TEMP/r47-focus/primary.json" \
            --safety "$RUNNER_TEMP/r47-focus/safety.json" \
            --documents "$RUNNER_TEMP/r47-focus/documents.json" \
            --application-sources "$RUNNER_TEMP/r47-focus/applications.json" \
            --output "$RUNNER_TEMP/r47-focus/evidence_readiness.json"
      - name: Verify original raw receipt SHA-256 and safe output claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r47-focus"
          status=json.loads((p/"evidence_readiness.json").read_bytes())
          assert status["exactNctCount"]==29 and status["provisionalApplicationCount"]==23
          assert len(status["rows"])==29
          assert len(status["applicationResearchRecords"])==23
          assert status["newScientificallyQualifiedResearchPredictions"]==0
          assert status["independentlyVerifiedScientificGrades"]==0
          assert status["validatedFdaApplicationForecasts"]==0
          assert status["independentHistoricalBacktests"]==0
          assert status["calibratedAccuracy"] is None
          assert status["probabilityOrCertainty"] is None
          assert status["officialFDAOutcomeForecast"]=="ABSTAIN"
          assert status["automaticClinicalGradeWriteAuthorized"] is False
          assert status["productionWriteAuthorized"] is False
          for typ,folder in [("primary","primary-original"),("safety","safety-original"),("documents","docs-original")]:
            data=(p/(typ+".json")).read_bytes()
            assert hashlib.sha256(data).hexdigest()==status["sourceReceiptSha256"][typ]
            original=json.loads(data)
            for r in original["records"]:
              if r.get("sourceResponseSha256"):
                src=(p/folder/(r["nct"]+".json")).read_bytes()
                assert hashlib.sha256(src).hexdigest()==r["sourceResponseSha256"]
          applications=json.loads((p/"applications.json").read_bytes())
          for case in applications["applicationGroups"]:
            sources=[case.get(k) for k in ("applicationSource","alternateOfficialSecSource")]+case.get("additionalOfficialFdaSources",[])
            for source in sources:
              if source and source.get("status")=="FETCHED":
                raw=(p/"application-original"/source["rawArtifact"]).read_bytes()
                assert hashlib.sha256(raw).hexdigest()==source["sha256"]
          line=f'Track A: {status["exactNctCount"]} NCTs, {status["provisionalApplicationCount"]} application groups, primary posted tables on {status["trialsWithCurrentPostedPrimaryTables"]} NCTs, SAP attachment on {status["trialsWithCurrentRegistrySap"]} NCTs; 0 independent grades, 0 validated forecasts.'
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("## Concurrent Track A: FOCUS scientific source triage\n"+line+"\n")
          PY
      - name: Append Track A research history and source-change review receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-focus/history"
          prior=()
          if [[ -n "${{ steps.previous_history.outputs.run_id }}" ]]; then
            test -f "$RUNNER_TEMP/r47-focus/previous-history/research-history.json"
            prior=(--previous "$RUNNER_TEMP/r47-focus/previous-history/research-history.json")
          fi
          python new-platform/backend/scripts/research_workstream_history.py \
            --track A --snapshot "$RUNNER_TEMP/r47-focus/evidence_readiness.json" \
            --output "$RUNNER_TEMP/r47-focus/history/research-history.json" \
            --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" "${prior[@]}"
      - name: Preserve separate Track A append-only history
        uses: actions/upload-artifact@v4
        with:
          name: main-focus-research-history-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-focus/history/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve FOCUS original public source captures and independent gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-r47-focus-research-track-a-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-focus/
          retention-days: 90
          if-no-files-found: warn
      - name: Report independent Track A failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=Track A research failed::Inspect this workflow's source/history receipts. No prediction or clinical grade was released; the other track is independent."
          echo "## Track A FAILED — separate run $GITHUB_RUN_ID; source gaps are not negative clinical findings. See the retained partial artifact and failed step." >> "$GITHUB_STEP_SUMMARY"
