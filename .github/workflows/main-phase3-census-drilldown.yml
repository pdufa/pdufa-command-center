name: MAIN Phase 3 census drilldown safety
on:
  pull_request:
    paths:
      - 'new-platform/frontend/app/installation-audit/page.tsx'
      - 'new-platform/frontend/app/installation-audit/phase3-census/**'
      - 'new-platform/frontend/lib/phase3-census-rows.ts'
      - 'new-platform/frontend/tests/phase3-census-rows.test.cjs'
      - 'new-platform/frontend/public/phase3-census-2026-10-26.csv'
      - 'data/phase3_all_years_300m_10b_trials.csv'
      - '.github/workflows/main-phase3-census-drilldown.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/app/installation-audit/phase3-census/**'
      - 'new-platform/frontend/lib/phase3-census-rows.ts'
      - 'new-platform/frontend/tests/phase3-census-rows.test.cjs'
      - 'new-platform/frontend/public/phase3-census-2026-10-26.csv'
      - 'data/phase3_all_years_300m_10b_trials.csv'
      - '.github/workflows/main-phase3-census-drilldown.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-nct-research-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install frontend packages
        working-directory: new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Validate 741 full original trial identities and 15-section tracker
        working-directory: new-platform/frontend
        run: node --test tests/phase3-census-rows.test.cjs tests/phase3-census-snapshot.test.cjs tests/installation-audit.test.cjs tests/installation-audit-summary.test.cjs
      - name: Typecheck frontend
        working-directory: new-platform/frontend
        run: npm run typecheck
