name: MAIN R59 FOCUS 29-trial 23-application scientific review queue

# Development only. This is a source-linked reviewer worklist, not an
# automatic clinical grade or an FDA prediction. No Render/Vercel/Sheets
# mutations, no clinical ledger writes and no Track B or retired RAAS use.
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r59-focus-review-queue.yml
      - new-platform/backend/scripts/build_focus_scientific_review_queue_r59.py
      - new-platform/backend/tests/test_focus_scientific_review_queue_r59.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: main-r59-focus-original-scientific-queue
  cancel-in-progress: false

jobs:
  build-phase-first-source-linked-research-queue:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-NCT audit and permanently retired workflow guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python -m pip install pytest 'PyMuPDF>=1.24,<2'
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_focus_scientific_review_queue_r59.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Restore immutable successful original 29-NCT and 23-application source packet
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42696796318
          name: main-r53-original-public-protocol-sap-pdf-42696796318
          path: ${{ runner.temp }}/r59/original
      - name: Create write-once source-anchored application and trial review queues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r59/review"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/build_focus_scientific_review_queue_r59.py \
            --r55 "$RUNNER_TEMP/r59/original/FOCUS_23_APPLICATION_EFFICACY_SAFETY_SOURCE_REVIEW_PACKETS_R55.json" \
            --output "$RUNNER_TEMP/r59/review/FOCUS_29_TRIAL_23_APPLICATION_REVIEW_QUEUE_R59.json" \
            --summary "$RUNNER_TEMP/r59/review/FOCUS_REVIEW_QUEUE_R59.md"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"r59/review/FOCUS_29_TRIAL_23_APPLICATION_REVIEW_QUEUE_R59.json"
          r=json.loads(out.read_bytes())
          assert r["schema"]=="MAIN_R59_FOCUS_29_TRIAL_23_APPLICATION_PHASE_FIRST_REVIEW_QUEUE"
          assert r["canonicalUniqueNctTrials"]==29
          assert r["provisionalApplicationCycles"]==23
          assert len(r["uniqueTrialSourceTasks"])==29
          assert len(r["applicationReviewQueue"])==23
          assert r["currentTrialsWithPostedPrimary"]==12
          assert r["currentTrialsWithPostedSafetyArms"]==12
          assert r["attachedOriginalProtocolSapDocuments"]==23
          assert r["originalProtocolAndSapPreunblindingSignoffsValidated"]==0
          assert r["signedIndependentClinicalReviews"]==0
          assert r["validatedFDAApplicationPredictions"]==0
          assert r["calibratedFDAProbability"] is None
          assert r["measuredHistoricalAccuracy"] is None
          assert r["allFutureFDAOutcomes"]=="ABSTAIN"
          assert r["noModelTrainingOrProductionWrites"] is True
          assert all(a["forecastApprovalOrCRL"]=="ABSTAIN" and
                     a["forecastReviewTiming"]=="ABSTAIN" and
                     a["approvalProbability"] is None and
                     a["independentClinicalReviewerSigned"] is False
                     for a in r["applicationReviewQueue"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## R59 source-bound independent-science review queue\n\n")
            f.write("29 exact NCT trials / 23 provisional application groups; 12 with current posted primary results, 12 with posted adverse-event arm data and 23 source-linked attached PDF documents. The separate JSON artifact identifies case-specific missing original evidence and phase-first review tasks. No clinical adjudications, validated forecasts or calibrated accuracy.\n\n")
            f.write((out.parent/"FOCUS_REVIEW_QUEUE_R59.md").read_text())
          PY
      - name: Preserve immutable source-linked scientific review queue and readable summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-r59-focus-29-23-review-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/r59/review/
          retention-days: 90
          if-no-files-found: error
