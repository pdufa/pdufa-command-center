name: PDUFA Four Disputed FDA Primary Evidence 2026-10-14
# Recheck exact Savara SEC language after source anchor refinement.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-run-four-primary-fda-20261014.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
      SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pypdf
      - name: Send START, verify 4 FDA target events, send END
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan FDAFOCUS --mode RECONCILE \
            --status-file reports/fda_focus_status.json \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 600 -- \
            python -m scripts.fda_four_primary_scan \
              --status-file reports/fda_focus_status.json \
              --evidence-file data/pdufa_four_fda_primary_proof.json
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          test -s data/pdufa_four_fda_primary_proof.json
      - name: Publish primary evidence with date and issuer context, never promote trade gates
        shell: bash
        run: |
          set -euo pipefail
          cp data/pdufa_four_fda_primary_proof.json "$RUNNER_TEMP/fda_proof.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B four-primary-fda origin/main
            cp "$RUNNER_TEMP/fda_proof.json" data/pdufa_four_fda_primary_proof.json
            git add data/pdufa_four_fda_primary_proof.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish four live FDA primary target date source checks"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Archive notices and live-primary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-four-fda-proof-${{ github.run_id }}
          path: |
            data/pdufa_four_fda_primary_proof.json
            reports/fda_focus_status.json
            reports/scan_notifications/
          retention-days: 30
