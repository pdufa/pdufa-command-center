name: Stage 3 Post-Phase-3 Trading Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'post_phase3_trade_backtest.py'
      - 'post_phase3_backfill_queue.py'
      - 'tests/test_post_phase3_backfill_queue.py'
      - 'scripts/post_phase3_trade_backtest.py'
      - 'tests/test_post_phase3_trade_backtest.py'
      - 'data/post_phase3_historical_trade_events.csv'
      - 'data/post_phase3_historical_adjusted_ohlcv.csv'
      - '.github/workflows/stage3-trade-backtest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'post_phase3_trade_backtest.py'
      - 'post_phase3_backfill_queue.py'
      - 'tests/test_post_phase3_backfill_queue.py'
      - 'scripts/post_phase3_trade_backtest.py'
      - 'tests/test_post_phase3_trade_backtest.py'
      - 'data/post_phase3_historical_trade_events.csv'
      - 'data/post_phase3_historical_adjusted_ohlcv.csv'
      - '.github/workflows/stage3-trade-backtest.yml'

permissions:
  contents: read

jobs:
  stage3-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run lookahead and source-provenance regression tests
        run: python -m unittest discover -s tests -p 'test_post_phase3_trade_backtest.py' -v
      - name: Audit historical evidence prioritization (never trading signals)
        run: python -m unittest discover -s tests -p 'test_post_phase3_backfill_queue.py' -v
      - name: Produce audited historical-coverage and scenario output
        run: |
          python scripts/post_phase3_trade_backtest.py --output-dir output/post_phase3_stage3
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('output/post_phase3_stage3/readiness_and_blockers.json').read_text())
          print('Historical trade-readiness status:', audit['status'])
          print('Audited event timelines:', audit['event_rows'])
          print('Historical adjusted OHLCV:', audit['price_rows'])
          print('Completed hypothetical trades:', audit['completed_scenarios'])
          # Zero observations is honest, not a successful profitability validation.
          assert audit['status'] in {
              'NOT_READY_NO_EVENT_AND_PRICE_HISTORY',
              'NO_VALID_POINT_IN_TIME_TRADES',
              'EXPLORATORY_ONLY_NOT_CALIBRATED',
          }
          PY
      - name: Save research output (not live UI or trading signals)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-post-phase3-trading-research
          path: output/post_phase3_stage3/
          if-no-files-found: warn
          retention-days: 30
