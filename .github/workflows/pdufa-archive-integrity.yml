name: PDUFA archive structural integrity

on:
  push:
    paths:
      - data/daily_scan_results.json
      - scripts/verify_pdufa_archive.py
      - tests/test_verify_pdufa_archive.py
      - tests/test_nightly_pacific_sequence.py
      - scripts/pdufa_daily_results.py
      - .github/workflows/pdufa-nightly-pacific-start.yml
      - .github/workflows/pdufa-overnight-sequential.yml
      - new-platform/frontend/tests/master-build-evidence.test.cjs
      - new-platform/frontend/app/installation-audit/master-build-tasks.ts
      - new-platform/frontend/public/installation-audit/task-evidence.json
      - new-platform/frontend/app/api/installation-audit/live-task-evidence/route.ts
      - new-platform/frontend/app/installation-audit/MasterBuildProgress.tsx
      - .github/workflows/pdufa-archive-integrity.yml
  pull_request:
    paths:
      - data/daily_scan_results.json
      - scripts/verify_pdufa_archive.py
      - tests/test_verify_pdufa_archive.py
      - tests/test_nightly_pacific_sequence.py
      - scripts/pdufa_daily_results.py
      - .github/workflows/pdufa-nightly-pacific-start.yml
      - .github/workflows/pdufa-overnight-sequential.yml
      - new-platform/frontend/tests/master-build-evidence.test.cjs
      - new-platform/frontend/app/installation-audit/master-build-tasks.ts
      - new-platform/frontend/public/installation-audit/task-evidence.json
      - new-platform/frontend/app/api/installation-audit/live-task-evidence/route.ts
      - new-platform/frontend/app/installation-audit/MasterBuildProgress.tsx
      - .github/workflows/pdufa-archive-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-integrity:
    name: Validate saved RESULTS archive (not source certification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
      - name: Check published archive structure
        run: python3 scripts/verify_pdufa_archive.py
      - name: Test archive negative cases and completeness safeguards
        run: python3 -m unittest discover -s tests -p 'test_verify_pdufa_archive.py' -v
      - name: Test complete overnight sequence, DST admission and dated archive handoff
        run: python3 -m unittest discover -s tests -p 'test_nightly_pacific_sequence.py' -v
      - name: Test 546-task inventory and acceptance evidence integrity
        run: node --test new-platform/frontend/tests/master-build-evidence.test.cjs
