  reconcile:
    name: 'Combined coverage / missing source audit'
    needs: [source_fda, source_sec, source_financial, source_market, source_issuer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
    steps:
      - name: Checkout baseline for scope audit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download available source manifests (missing jobs stay missing)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: source-manifest-*-${{ github.run_id }}
          path: reports/missing_sources/
          merge-multiple: true
      - name: Send START, verify source coverage, send END
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan AUDIT --mode RECONCILE \
            --status-file reports/missing_sources/audit_scan_report.json \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 360 -- \
            python scripts/nightly_missing_sources.py \
              --source AUDIT \
              --report reports/missing_sources/audit_scan_report.json
          exit_code=$?
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Some required source families are unverified."
            exit 0
          fi
          exit "$exit_code"
      - name: Archive combined run source coverage and email audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-combined-coverage-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/missing_sources/
            reports/scan_notifications/

  publish-source-report:
    name: 'Publish reconciled source verification to SCANS'
    needs: reconcile
    if: ${{ always() && needs.reconcile.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: source-combined-coverage-${{ github.run_id }}
          path: reports/
      - name: Revalidate evidence and prepare published source summary
        run: python scripts/publish_source_audit.py
      - name: Publish source summary without changing trading gates
        shell: bash
        run: |
          mkdir -p /tmp/pdufa-source-publish
          cp data/pdufa_source_report.json data/pdufa_source_verification.csv data/pdufa_source_review_queue.csv /tmp/pdufa-source-publish/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B source-audit-publish origin/main
          cp /tmp/pdufa-source-publish/* data/
          git add data/pdufa_source_report.json data/pdufa_source_verification.csv data/pdufa_source_review_queue.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified extended source scan summary"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1

  refresh-prephase3:
    name: 'Refresh validated PRE PHASE 3 display feed after sources'
    needs: reconcile
    if: ${{ always() && needs.reconcile.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/step7-live-feed.yml

