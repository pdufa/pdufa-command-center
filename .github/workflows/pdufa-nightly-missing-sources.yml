name: PDUFA Nightly FDA SEC Financial Market Issuer Sources

# Collect, verify direct-source claims, then reconcile the evidence ledgers.
on:
  push:
    branches: [main]
    paths:
      - "scripts/source_verification.py"
      - "scripts/recheck_events.py"
      - "config/issuer_sources.json"
      - ".github/workflows/pdufa-nightly-missing-sources.yml"
  # Only the completed, published clinical scan can start the extended source scan.
  workflow_run:
    workflows: ['PDUFA Nightly Scan Report Publisher']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdufa-nightly-extended-evidence
  cancel-in-progress: false

jobs:
  source_fda:
    name: 'Live PDUFA FDA source check'
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
      SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
    steps:
      - name: Checkout repository research evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install event recheck and primary PDF verification dependencies
        run: python -m pip install pandas pypdf
      - name: Verify email credentials before any external collection
        shell: bash
        run: |
          for key in PDUFA_GMAIL_USER PDUFA_GMAIL_APP_PASSWORD PDUFA_ALERT_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing email secret ${key}; no unnotified scan allowed."
              exit 1
            fi
          done
      - name: Send START, collect and verify live evidence, send END
        id: collect
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan "FDA" --mode DELTA \
            --status-file "reports/missing_sources/fda_scan_report.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7000 -- \
            python scripts/nightly_missing_sources.py \
              --source "FDA" \
              --report "reports/missing_sources/fda_scan_report.json"
          exit_code=$?
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Verification ledger contains unresolved claims, conflicts, or technical failures."
            exit 0
          fi
          exit "$exit_code"
      - name: Save per-source manifest for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest-fda-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: reports/missing_sources/
      - name: Archive source ledger and Gmail submission audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ledger-fda-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/recheck_status.csv
            data/pdufa_candidates.csv
            reports/scan_notifications/

  source_sec:
    name: 'Live PDUFA SEC source check'
