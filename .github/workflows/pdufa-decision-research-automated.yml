name: PDUFA Decision Research Automated Safety Checks

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [feature/decision-workstream-20261026]
    paths:
      - 'scripts/pdufa_readiness_gate.py'
      - 'scripts/evaluate_fda_predictions.py'
      - 'scripts/compare_fda_prediction_baseline.py'
      - 'scripts/screen_fda_evidence.py'
      - 'scripts/build_fda_evidence_review_queue.py'
      - 'tests/test_pdufa_readiness_gate.py'
      - 'tests/test_evaluate_fda_predictions.py'
      - 'tests/test_compare_fda_prediction_baseline.py'
      - 'tests/test_screen_fda_evidence.py'
      - 'tests/test_build_fda_evidence_review_queue.py'
      - 'tests/test_fda_bepirovirsen_candidate.py'
      - 'data/fda_candidate_bepirovirsen_20261020.json'
      - '.github/workflows/pdufa-decision-research-automated.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_*fda*.py'
      - 'tests/test_pdufa_readiness_gate.py'
      - '.github/workflows/pdufa-decision-research-automated.yml'

permissions:
  contents: read

concurrency:
  group: pdufa-decision-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-research-tests:
    name: Read-only SCIENCE and OUTCOME verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run decision research safeguards
        run: |
          python -m pytest -q \
            tests/test_pdufa_readiness_gate.py \
            tests/test_evaluate_fda_predictions.py \
            tests/test_compare_fda_prediction_baseline.py \
            tests/test_screen_fda_evidence.py \
            tests/test_build_fda_evidence_review_queue.py \
            tests/test_fda_bepirovirsen_candidate.py
      - name: Write non-authoritative run summary
        if: always()
        run: |
          printf 'Workflow run: %s\nBranch: %s\n' "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" > decision-research-run.txt
          printf 'Research checks only; no production deployment, source promotion, trading or scan dispatch.\n' >> decision-research-run.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-research-summary
          path: decision-research-run.txt
          retention-days: 14
