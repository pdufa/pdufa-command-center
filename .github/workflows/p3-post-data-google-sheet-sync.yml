name: P3 POST-DATA Google Sheets → Website snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-post-data-google-sheet-sync.yml'
      - 'scripts/auto_promote_p3_post_data.py'
      - 'scripts/refresh_existing_p3_post_data.py'
      - 'scripts/p3_market_cap_secondary.py'
      - 'new-platform/backend/app/phase3_curated_announcements.json'
      - 'data/post_phase3_discoveries.csv'
      - 'new-platform/backend/app/phase3_curated_announcements.json'
      - 'scripts/sync_p3_post_data_from_google_sheet.py'
  workflow_run:
    workflows: ['PDUFA Overnight Sequential Scans']
    types: [completed]
  schedule:
    - cron: '25 13 * * *'

permissions:
  contents: write

concurrency:
  group: p3-post-data-roster-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests beautifulsoup4
      - name: Run offline source and deduplication safety tests
        run: python -m unittest discover -s tests -p 'test_p3_auto_promotion.py' -v
      - name: Confirm planned/submitted/accepted/PDUFA stage classifications
        run: python -m unittest discover -s tests -p 'test_p3_regulatory_stage_rules.py' -v
      - name: Automatically append exact-NCT, verified POOL to P3 POST-DATA matches
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/auto_promote_p3_post_data.py
      - name: Preserve automatic-promotion and manual-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-post-data-auto-promotion-${{ github.run_id }}
          path: reports/p3_auto_promotion_latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run existing-row refresh safety tests
        run: python -m unittest discover -s tests -p 'test_p3_existing_row_refresh.py' -v
      - name: Verify secondary market-cap fallback parser and primary-source priority
        run: python -m unittest discover -s tests -p 'test_p3_market_cap_secondary.py' -v
      - name: Refresh existing P3 trial market caps, registry and vetted FDA fields
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/refresh_existing_p3_post_data.py
      - name: Archive existing-row source refresh and review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-existing-row-refresh-${{ github.run_id }}
          path: reports/p3_existing_row_refresh_latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate and sync the canonical post-Phase-3 roster only
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_p3_post_data_from_google_sheet.py
      # This workflow was already active. Its triggers/schedule are unchanged.
      # Harvesting never creates subjective numerical grades or changes TOP.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install the existing deterministic scoring dependencies
        working-directory: new-platform/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate FOCUS source identity and Sheets write protections
        run: python -m unittest discover -s tests -p 'test_bottom*.py' -v
      - name: Harvest all preserved and active FOCUS source packets
        run: |
          python scripts/bottom_only_evidence_backfill.py --fetch
          python scripts/bottom_only_publication_search.py
          node new-platform/frontend/scripts/bottom-only-recalculate.cjs
      - name: Sync only exact active NCT clinical rating cells
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_bottom_clinical_ratings.py
      - name: Commit only verified roster changes (if any)
        run: |
          git add new-platform/frontend/data/p3PostDataActive.json
          git add new-platform/frontend/data/bottomOnlyReviewedFacts20261107.json \
            new-platform/frontend/data/bottomOnlyScoreHistory20261107.json \
            new-platform/frontend/data/bottomOnlyBaseline20261107.json \
            new-platform/frontend/data/bottomOnly190Baseline20261107.json \
            new-platform/frontend/data/bottomOnlyResearchHistory20261107.json
          git add reports/bottom-only-20261107/*.csv reports/bottom-only-20261107/*.json
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          sources = [str(p) for p in Path('reports/bottom-only-20261107/sources').glob('*.json')
                     if re.fullmatch(r'NCT\d{8}-(?:registry|[0-9a-f]{64})\.json', p.name)]
          if sources:
              subprocess.run(['git', 'add', '--', *sources], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh P3 POST-DATA roster, clinical source packets and reviewed-score exports"
            git pull --rebase origin main
            git push origin main
          fi
