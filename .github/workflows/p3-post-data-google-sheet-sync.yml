name: P3 POST-DATA Google Sheets → Website snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p3-post-data-google-sheet-sync.yml'
      - 'scripts/auto_promote_p3_post_data.py'
      - 'scripts/refresh_existing_p3_post_data.py'
      - 'scripts/p3_market_cap_secondary.py'
      - 'new-platform/backend/app/phase3_curated_announcements.json'
      - 'data/post_phase3_discoveries.csv'
      - 'new-platform/backend/app/phase3_curated_announcements.json'
      - 'scripts/sync_p3_post_data_from_google_sheet.py'
  workflow_run:
    workflows: ['PDUFA Overnight Sequential Scans']
    types: [completed]
  schedule:
    - cron: '25 13 * * *'

permissions:
  contents: write

concurrency:
  group: p3-post-data-roster-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests beautifulsoup4
      - name: Run offline source and deduplication safety tests
        run: python -m unittest discover -s tests -p 'test_p3_auto_promotion.py' -v
      - name: Confirm planned/submitted/accepted/PDUFA stage classifications
        run: python -m unittest discover -s tests -p 'test_p3_regulatory_stage_rules.py' -v
      - name: Automatically append exact-NCT, verified POOL to P3 POST-DATA matches
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/auto_promote_p3_post_data.py
      - name: Preserve automatic-promotion and manual-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-post-data-auto-promotion-${{ github.run_id }}
          path: reports/p3_auto_promotion_latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run existing-row refresh safety tests
        run: python -m unittest discover -s tests -p 'test_p3_existing_row_refresh.py' -v
      - name: Verify secondary market-cap fallback parser and primary-source priority
        run: python -m unittest discover -s tests -p 'test_p3_market_cap_secondary.py' -v
      - name: Refresh existing P3 trial market caps, registry and vetted FDA fields
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/refresh_existing_p3_post_data.py
      - name: Archive existing-row source refresh and review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-existing-row-refresh-${{ github.run_id }}
          path: reports/p3_existing_row_refresh_latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validate and sync the canonical post-Phase-3 roster only
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_p3_post_data_from_google_sheet.py
      - name: Commit only verified roster changes (if any)
        run: |
          git add new-platform/frontend/data/p3PostDataActive.json
          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh P3 POST-DATA qualified candidate roster from Google Sheets"
            git push origin main
          fi
