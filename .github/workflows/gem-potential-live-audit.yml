name: GEM Potential Live Browser Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gem-potential-live-audit.yml"
      - "scripts/gem_potential_live_audit.cjs"
      - "app.py"
      - "gem_potential_ui.py"
      - "gem_potential_list.py"
      - "gem_jr_ui.py"
      - "gem_stage_dossier.py"
      - "gem_visual_page.py"
      - "gem_trade_navigation.py"
      - "gem_trial_hierarchy_ui.py"
      - "gem_nested_master_ui.py"
      - "ticker_toggle_panel.py"
      - "unified_clinical_trading.py"

permissions:
  contents: read

concurrency:
  group: gem-potential-live-browser-check
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser instrumentation
        run: npm install --no-save playwright-core
      - name: Locate Chrome
        shell: bash
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/google-chrome-stable ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome-stable" >> "$GITHUB_ENV"
          else
            echo "::error::Chrome browser not available on GitHub runner"
            exit 1
          fi
      - name: Check deployed #1 GEM Potential list and reasons
        run: node scripts/gem_potential_live_audit.cjs
      - name: Upload GEM browser screenshots and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-potential-live-evidence
          path: gem-potential-live-artifacts/
          if-no-files-found: warn
          retention-days: 7
