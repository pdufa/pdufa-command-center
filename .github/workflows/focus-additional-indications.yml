name: FOCUS — Additional Indications Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/focus-additional-indications.yml'
      - 'scripts/collect_focus_additional_indications.py'
      - 'scripts/sync_focus_additional_indications_to_sheets.py'
      - 'tests/test_focus_additional_indications.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/focus-additional-indications.yml'
      - 'scripts/collect_focus_additional_indications.py'
      - 'scripts/sync_focus_additional_indications_to_sheets.py'
  schedule:
    - cron: '30 16 * * *'

permissions:
  contents: write

concurrency:
  group: pdufa-focus-additional-indications
  cancel-in-progress: false

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm syntax for exact-NCT candidate research and protected sheet sync
        run: |
          python -m py_compile scripts/collect_focus_additional_indications.py scripts/sync_focus_additional_indications_to_sheets.py
      - name: Test exact active intervention matching, candidate qualifiers, no unreviewed approvals
        run: python -m unittest discover -s tests -p 'test_focus_additional_indications.py' -v

  search:
    if: github.event_name != 'pull_request'
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover same registered drug in other NCT records via public API
        run: python scripts/collect_focus_additional_indications.py
      - name: Validate public-source coverage before changes to Google Sheets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/focus-survey/additional-indication-coverage.json').read_text())
          if summary['focusTrials'] != 29 or not 1 <= summary['uniqueDrugQueries'] <= 29:
              raise SystemExit('FOCUS additional-indication roster drift: no Sheets write')
          if summary['searchesUnavailable']:
              raise SystemExit('One or more official source searches unavailable; reports preserved, prior Sheet unchanged')
          print('Active trials:',summary['focusTrials'],'candidate study links:',summary['candidateOtherIndicationLinks'])
          print('Truncated search drugs:',summary['searchTruncatedDrugs'])
          PY
      - name: Sync evidence leads only to two independent auto-owned Google Sheet tabs
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install google-auth requests
          python scripts/sync_focus_additional_indications_to_sheets.py
      - name: Archive source data and research errors even when sync is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-indication-candidates-${{ github.run_id }}
          path: |
            reports/focus-survey/additional-indication-research.json
            reports/focus-survey/additional-indication-coverage.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit research-only source reports without touching clinical or RAAS records
        if: always()
        run: |
          for file in reports/focus-survey/additional-indication-coverage.json reports/focus-survey/additional-indication-research.json; do
            if [ ! -f "$file" ]; then
              echo "No candidate source report available; not committing"
              exit 0
            fi
          done
          git add reports/focus-survey/additional-indication-coverage.json reports/focus-survey/additional-indication-research.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh FOCUS additional-indication research leads [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
