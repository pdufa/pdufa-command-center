name: Private Recovery ZIP Assembly Tests

on:
  push:
    paths:
      - "scripts/assemble_private_recovery_zip.py"
      - "tests/test_private_recovery_zip_assembler.py"
      - "scripts/validate_private_recovery_zip.py"
      - "tests/test_validate_private_recovery_zip.py"
      - ".github/workflows/private-recovery-zip-tests.yml"
  pull_request:
    paths:
      - "scripts/assemble_private_recovery_zip.py"
      - "tests/test_private_recovery_zip_assembler.py"
      - "scripts/validate_private_recovery_zip.py"
      - "tests/test_validate_private_recovery_zip.py"
      - ".github/workflows/private-recovery-zip-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-assembly-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test ZIP assembly with synthetic data
        run: python -m pytest tests/test_private_recovery_zip_assembler.py tests/test_validate_private_recovery_zip.py -v
