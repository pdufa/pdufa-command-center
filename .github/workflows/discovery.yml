name: Legacy Company Discovery (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manual-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Run company discovery manually
        env:
          DISCOVERY_LOOKBACK_DAYS: "10"
          DISCOVERY_CT_LIMIT: "200"
          DISCOVERY_SEC_DOCS_PER_COMPANY: "3"
          DISCOVERY_SEC_PAUSE_SECONDS: "0.12"
        run: python scripts/discover_new_companies.py
      - name: Run repository checks
        run: python smoke_test.py
      - name: Commit manual discovery updates
        run: |
          git config user.name "pdufa-discovery-bot"
          git config user.email "pdufa-discovery-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No discovery changes."
          else
            git commit -m "Manual company discovery update"
            git pull --rebase origin main
            git push
          fi
