name: MAIN Installation Progress and Health Monitor QA
on:
  pull_request:
    paths:
      - 'new-platform/frontend/lib/main-install-progress.ts'
      - 'new-platform/frontend/app/main/**'
      - 'new-platform/frontend/app/api/main/**'
      - 'new-platform/frontend/app/GlobalNavigation.tsx'
      - 'new-platform/frontend/tests/main-install-progress.test.cjs'
      - 'new-platform/backend/app/installation_monitor.py'
      - 'new-platform/backend/tests/test_installation_monitor.py'
      - 'new-platform/backend/app/main.py'
      - '.github/workflows/main-installation-monitor-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Installation dashboard TypeScript and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: new-platform/frontend
      - name: Verify typecheck
        run: npm run typecheck
        working-directory: new-platform/frontend
      - name: Verify installation dashboard state transitions
        run: node --test tests/main-install-progress.test.cjs
        working-directory: new-platform/frontend
  backend:
    name: Installation telemetry and Telegram idempotence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r new-platform/backend/requirements.txt
      - name: Verify durable monitor telemetry and alert delivery
        run: PYTHONPATH=new-platform/backend python -m pytest -q new-platform/backend/tests/test_installation_monitor.py
