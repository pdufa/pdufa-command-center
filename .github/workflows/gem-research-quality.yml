name: ARCHIVED — GEM research qualification
# Deprecated GEM block, source data and FS/FA settings are kept in archive.
# Explicit historical invocation has no effect on live memberships or data.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Archived mode (no source mutation)"
        type: choice
        options: [VERIFY_ALL, REVERIFY_PARTIAL, RESCAN_ALL]
        default: VERIFY_ALL
  workflow_call:
    inputs:
      action:
        type: string
        default: VERIFY_ALL
permissions:
  contents: read
jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Retired GEM qualification
        run: echo "Archived GEM block is inactive. Independent Phase 3 source collectors remain elsewhere."
