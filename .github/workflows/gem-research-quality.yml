name: GEM Research Quality Snapshot

# Primary ranked candidate list: verified Phase 3 release + verified second
# separate post-readout financing closing; other dimensions rank/flag only.
# Fourth SCANS dashboard block: GEMS — research-only Phase 3 discovery,
# post-financing monitoring and PDUFA. Existing #2/#3/#4 clinical IDs stay
# unchanged. No live SEC/issuer verification or automated trading is implied.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gem-research-quality.yml"
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "GEM block: saved-source verify, incremental recheck or full registry rescan"
        type: choice
        required: true
        default: REVERIFY_PARTIAL
        options: [VERIFY_ALL, REVERIFY_PARTIAL, RESCAN_ALL]

permissions:
  contents: write

concurrency:
  group: gem-research-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GEM_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'REVERIFY_PARTIAL' }}
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
    steps:
      - name: Checkout latest research-only source data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Gmail START — GEM block
        id: start_email
        continue-on-error: true
        run: |
          case "$GEM_ACTION" in
            VERIFY_ALL) mode=RECONCILE;;
            RESCAN_ALL) mode=BASELINE;;
            *) mode=DELTA;;
          esac
          python -m scripts.gem_block_email --event START --mode "$mode"

      - name: Collect fresh Phase 3 results (incremental or full backfill)
        id: clinical
        if: ${{ env.GEM_ACTION != 'VERIFY_ALL' && steps.start_email.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ "$GEM_ACTION" = "RESCAN_ALL" ] || [ ! -s data/phase3_announcements.csv ]; then
            python scripts/phase3_results_intake.py --mode backfill --max-pages 120 --data-dir data
          else
            python scripts/phase3_results_intake.py --mode daily --max-pages 120 --data-dir data
          fi

      - name: Reconcile actual registry ledger and collector totals
        id: registry_validation
        if: ${{ env.GEM_ACTION != 'VERIFY_ALL' && steps.clinical.outcome == 'success' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          state = json.loads(Path("data/phase3_intake_status.json").read_text())
          with Path("data/phase3_announcements.csv").open(newline="", encoding="utf-8-sig") as f:
              actual = sum(1 for _ in csv.DictReader(f))
          if state.get("status") != "COMPLETE" or state.get("complete") is not True or state.get("errors"):
              raise SystemExit("Registry collection failed or reported partial source coverage")
          if state.get("stored_results") != actual:
              raise SystemExit("Collector count disagrees with saved Phase 3 ledger")
          print(f"Reconciled {actual} posted-result research observations — NOT clinical successes.")
          PY

      # Financial data may be collected before Phase 3 success is adjudicated;
      # it does not relax GEM 2/3 clinical or second-financing trade-entry gates.
      - name: Recheck SEC cash runway for future PDUFA watch candidates
        id: runway
        if: ${{ env.GEM_ACTION != 'VERIFY_ALL' && steps.start_email.outcome == 'success' }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
        run: |
          python scripts/collect_gem_runway.py --data-dir data --max-tickers 75

      - name: Scan quarterly SEC 13F specialist-manager holdings
        id: hedge_funds
        if: ${{ env.GEM_ACTION != 'VERIFY_ALL' && steps.start_email.outcome == 'success' }}
        continue-on-error: true
        env:
          SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
        run: |
          python scripts/collect_gem_hedge_funds.py --data-dir data

      - name: Audit all saved GEM source gates and research stage scores
        id: gem_audit
        if: always()
        continue-on-error: true
        run: python scripts/run_gem_daily_readiness.py --output-dir reports/gem_daily

      - name: Publishable fourth-block status — distinguish partial and failed
        id: block_report
        if: always()
        continue-on-error: true
        env:
          COLLECTOR_OUTCOME: ${{ steps.registry_validation.outcome }}
          AUDIT_OUTCOME: ${{ steps.gem_audit.outcome }}
        run: |
          python -m scripts.publish_gem_scan_block \
            --action "$GEM_ACTION" \
            --collector-outcome "$COLLECTOR_OUTCOME" \
            --audit-outcome "$AUDIT_OUTCOME" \
            --output data/gem_scan_block_report.json

      - name: Publish fourth-block dashboard status and validated registry observations
        if: always()
        run: |
          set -euo pipefail
          test -s data/gem_scan_block_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/gem_scan_block_report.json
          # A failed SEC collection publishes empty current records, never
          # silently continuing to qualify an earlier successful scan.
          if [ "$GEM_ACTION" != "VERIFY_ALL" ] && [ -f data/gem_runway_evidence.json ]; then
            git add -- data/gem_runway_evidence.json
          fi
          # 13F is a supplemental ranking source: unavailable managers are
          # reported as partial and never invent holdings or block base scans.
          if [ "$GEM_ACTION" != "VERIFY_ALL" ] && [ -f data/gem_hedge_fund_13f.json ]; then
            git add -- data/gem_hedge_fund_13f.json
          fi
          # Source data is published ONLY after a fully reconciled registry run.
          if [ "$GEM_ACTION" != "VERIFY_ALL" ] && \
             [ "${{ steps.registry_validation.outcome }}" = "success" ]; then
            git add -- data/phase3_intake_status.json data/phase3_announcements.csv
          fi
          if git diff --cached --quiet; then
            echo "No change to the GEM dashboard report or source registry"
            exit 0
          fi
          git commit -m "data: publish audited GEM fourth-block research status"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1

      - name: Gmail END — GEM block including any source failures
        id: end_email
        if: always()
        continue-on-error: true
        run: |
          case "$GEM_ACTION" in
            VERIFY_ALL) mode=RECONCILE;;
            RESCAN_ALL) mode=BASELINE;;
            *) mode=DELTA;;
          esac
          python -m scripts.gem_block_email --event END --mode "$mode" --report data/gem_scan_block_report.json

      - name: Retain GEM reports and source snapshots as audited artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-research-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/gem_daily/
            data/gem_scan_block_report.json
            data/gem_runway_evidence.json
            data/gem_hedge_fund_13f.json
            data/phase3_intake_status.json
            data/phase3_announcements.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Final independently auditable run result
        if: always()
        env:
          START_RESULT: ${{ steps.start_email.outcome }}
          END_RESULT: ${{ steps.end_email.outcome }}
          COLLECT_RESULT: ${{ steps.registry_validation.outcome }}
          RUNWAY_RESULT: ${{ steps.runway.outcome }}
          AUDIT_RESULT: ${{ steps.gem_audit.outcome }}
          REPORT_RESULT: ${{ steps.block_report.outcome }}
        run: |
          if [ "$START_RESULT" != "success" ] || [ "$END_RESULT" != "success" ]; then
            echo "::error::GEM START/END Gmail messages were not both acknowledged."
            exit 1
          fi
          if [ "$AUDIT_RESULT" != "success" ] || [ "$REPORT_RESULT" != "success" ]; then
            echo "::error::GEM read-only source audit or published block report failed."
            exit 1
          fi
          if [ "$GEM_ACTION" != "VERIFY_ALL" ] && [ "$COLLECT_RESULT" != "success" ]; then
            echo "::error::GEM registry source scan was blocked or incomplete."
            exit 1
          fi
          if [ "$GEM_ACTION" != "VERIFY_ALL" ] && [ "$RUNWAY_RESULT" != "success" ]; then
            echo "::error::GEM SEC financial runway recheck failed or partial; runway sources remain unverified."
            exit 1
          fi
          echo "GEM block execution and notifications completed; trading eligibility remains independently source-gated."
