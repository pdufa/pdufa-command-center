name: GEM Research Quality Snapshot

# Refresh actual ClinicalTrials.gov registry results, audit saved GEM
# sources, and publish only reconciled review-only ledger observations.
# The routine does NOT refresh SEC, certify issuer Phase 3 toplines,
# validate historical stock returns, or place trades.
on:
  # Also initiate a run when this exact workflow is updated, so activating
  # the safety gate does not depend on waiting for the next scheduled slot.
  # Publishing CSV/JSON files will not recursively trigger this workflow.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gem-research-quality.yml"
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gem-research-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout current saved source snapshots
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Backfill missing Phase 3 history or refresh daily changes
        id: clinical
        continue-on-error: true
        run: |
          if [ ! -s data/phase3_announcements.csv ]; then
            echo "Empty discovery ledger: retrieve all registry Phase 3 posted results before incremental scanning"
            python scripts/phase3_results_intake.py --mode backfill --max-pages 120 --data-dir data
          else
            python scripts/phase3_results_intake.py --mode daily --max-pages 120 --data-dir data
          fi
      - name: Write fail-closed GEM quality report and prospective research observations
        if: always()
        run: python scripts/run_gem_daily_readiness.py --output-dir reports/gem_daily
      - name: Retain time-stamped research evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-research-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/gem_daily/
            data/phase3_intake_status.json
            data/phase3_announcements.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Fail workflow if live Phase 3 collection was not complete
        if: always()
        env:
          COLLECTOR_OUTCOME: ${{ steps.clinical.outcome }}
        run: |
          if [ "$COLLECTOR_OUTCOME" != "success" ]; then
            echo "::error::Phase 3 collector request failed; archived files are NOT a complete discovery refresh."
            exit 1
          fi
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          state = json.loads(Path("data/phase3_intake_status.json").read_text())
          with Path("data/phase3_announcements.csv").open(newline="", encoding="utf-8-sig") as f:
              saved = sum(1 for row in csv.DictReader(f))
          if not state.get("complete") or state.get("status") != "COMPLETE" or state.get("errors"):
              raise SystemExit("Phase 3 collection incomplete; see archived audit")
          if state.get("stored_results") != saved:
              raise SystemExit("Phase 3 collector count disagrees with saved announcement rows")
          PY

      - name: Publish validated Phase 3 discovery ledger to live dashboard repository
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/phase3_intake_status.json data/phase3_announcements.csv
          if git diff --cached --quiet; then
            echo "No new registry discovery observations to publish"
            exit 0
          fi
          git commit -m "data: publish verified registry intake observations (research only)"
          git pull --rebase origin main
          git push origin HEAD:main
