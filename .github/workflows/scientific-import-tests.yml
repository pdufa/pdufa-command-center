name: Scientific importer safety tests

on:
  push:
    branches:
      - feature/scientific-assessment-v1
    paths:
      - "new-platform/backend/app/scientific_import.py"
      - "new-platform/backend/app/scientific_batch_import.py"
      - "new-platform/backend/app/scientific_batch_jobs.py"
      - "new-platform/backend/app/scientific_batch_ui.py"
      - "new-platform/backend/app/main.py"
      - "new-platform/backend/app/scientific_stored_record.py"
      - "new-platform/backend/app/scientific_registry_evidence.py"
      - "new-platform/backend/tests/test_scientific_import.py"
      - "new-platform/backend/tests/test_scientific_batch_import.py"
      - "new-platform/backend/tests/test_scientific_batch_api.py"
      - ".github/workflows/scientific-import-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline importer safety tests
        env:
          DATABASE_URL: "sqlite:///./scientific_import_ci.sqlite3"
          PDUFA_REQUIRE_POSTGRES: "0"
        run: python -m pytest -q tests/test_scientific_import.py tests/test_scientific_batch_import.py tests/test_scientific_batch_api.py
