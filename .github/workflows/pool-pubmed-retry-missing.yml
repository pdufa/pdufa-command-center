name: POOL PubMed exact-NCT missing-query retry (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retry-missing:
    if: github.ref == 'refs/heads/codex/levels-09-20-development-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse overlapping original PubMed shard execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/actions/runs/44117022600" --jq '.status')
          test "$state" = completed || {
            echo 'Original PubMed shards still running; refuse duplicate NCBI traffic.'
            exit 1
          }
      - name: Verify immutable shard retry tests
        run: |
          python -m pip install pytest
          python -m pytest -q new-platform/backend/tests/test_pool_pubmed_discovery.py new-platform/backend/tests/test_pool_pubmed_shards.py new-platform/backend/tests/test_pool_pubmed_retry_missing.py
      - name: Restore ALL original shards from one completed source run
        uses: actions/download-artifact@v4
        with:
          run-id: 44117022600
          pattern: pool-pubmed-shard-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: reports/pool-research/original-shards
      - name: Retry only NCTs with failed or incomplete PubMed queries
        id: recovery
        continue-on-error: true
        run: |
          python scripts/medical/pool_pubmed_retry_missing.py \
            --roster new-platform/frontend/data/tools-pool-snapshot.json \
            --source-shards reports/pool-research/original-shards \
            --retry-shards reports/pool-research/retry-shards \
            --merged-output reports/pool-research/pool-pubmed-retried.json
      - name: Preserve exact-NCT retry receipts and whole-POOL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-pubmed-retry-${{ github.run_id }}
          path: |
            reports/pool-research/retry-shards
            reports/pool-research/pool-pubmed-retried.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed if any source query is still unresolved
        if: steps.recovery.outcome != 'success'
        run: |
          echo 'Unreviewed PubMed query coverage remains incomplete. No scientific review or prediction.'
          exit 1
