name: ATSMS — FOCUS Alpaca Extended-Hours Monitor
# Read-only market-data research; no trading, broker token, or execution code.
on:
  schedule:
    # Every five minutes offset from :00 to reduce busy-hour scheduler delay.
    # Covers 04:00–20:00 America/New_York through both EST and EDT.
    # Saturday UTC 00–01 covers Friday US after-hours.
    - cron: '4-59/5 0-1,8-23 * * 1-6'
  workflow_dispatch:
  workflow_run:
    workflows: ['FOCUS Google Sheets → Website source snapshot']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/atsms-focus-market-monitor.yml'
      - 'scripts/atsms_focus_monitor.py'
  pull_request:
    paths:
      - '.github/workflows/atsms-focus-market-monitor.yml'
      - 'scripts/atsms_focus_monitor.py'
      - 'tests/test_atsms_focus_monitor.py'
permissions:
  contents: read
concurrency:
  group: atsms-read-only-focus-market-scanner
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test source, completed sessions, 8 metrics, and non-execution contracts
        run: python -m unittest discover -s tests -p 'test_atsms_focus_monitor.py' -v
      - name: Verify no broker-order API can be called
        run: |
          python - <<'PY'
          from pathlib import Path
          monitor=Path('scripts/atsms_focus_monitor.py').read_text()
          for phrase in ('api.alpaca.markets/v2/orders','/orders/place','/orders/preview','etrade.com/v1/accounts'):
              assert phrase not in monitor, phrase
          assert 'https://data.alpaca.markets' in monitor
          PY
  scan:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'new-platform/backend/requirements.txt'
      - name: Install NYSE holiday and early-close calendar
        run: python -m pip install --disable-pip-version-check 'exchange_calendars>=4.5,<5'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/atsms/signal_state.json
          key: atsms-focus-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            atsms-focus-state-
      - name: Run every current FOCUS ticker with Alpaca read-only data
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPACA_DATA_FEED: iex
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATSMS_STATE_FILE: .cache/atsms/signal_state.json
        run: python scripts/atsms_focus_monitor.py --report reports/atsms/latest.json
      - name: Persist last evaluated signals when a valid ledger exists
        if: always()
        id: has_state
        run: |
          if test -f .cache/atsms/signal_state.json; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: steps.has_state.outputs.valid == 'true'
        with:
          path: .cache/atsms/signal_state.json
          key: atsms-focus-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive timestamped metric/status outcome without redeploying WT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atsms-focus-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/atsms/latest.json
          if-no-files-found: warn
          retention-days: 7
