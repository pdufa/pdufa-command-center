name: RAAS ACTIVE 2024-2025 original FDA and SEC historical case research
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
  pull_request:
    paths:
      - 'new-platform/frontend/data/raas-active-2024-2025-primary-source-leads.json'
      - 'new-platform/frontend/data/raas-active-2024-2025-sec-cover-share-leads.json'
      - 'new-platform/frontend/data/raas-active-2024-2025-preentry-sec-share-leads.json'
      - 'scripts/raas_active_2024_2025_primary_cap_research.cjs'
      - 'scripts/raas_active_2024_2025_window79_audit.cjs'
      - 'scripts/raas_active_2024_2025_full_90_3_grid.cjs'
      - 'tests/raas_active_2024_2025_full_90_3_grid.test.cjs'
      - 'scripts/raas_active_2024_2025_window_robustness_audit.cjs'
      - 'tests/raas_active_2024_2025_window_robustness_audit.test.cjs'
      - 'scripts/raas_active_2024_2025_sec_cap_snapshot_sensitivity.cjs'
      - 'tests/raas_active_2024_2025_sec_cap_snapshot_sensitivity.test.cjs'
      - 'new-platform/frontend/data/raas-2025-adverse-candidate-inclusion-exclusion-leads.json'
      - 'scripts/raas_2025_crl_candidate_inclusion_exclusion.cjs'
      - 'tests/raas_2025_crl_candidate_inclusion_exclusion.test.cjs'
      - 'new-platform/frontend/data/raas-2025-unanchored-crl-source-leads.json'
      - 'scripts/raas_2025_crl_candidate_coverage_funnel.cjs'
      - 'tests/raas_2025_crl_candidate_coverage_funnel.test.cjs'
      - 'tests/raas_active_2024_2025_window79_audit.test.cjs'
      - 'tests/raas_active_2024_2025_primary_cap_research.test.cjs'
      - '.github/workflows/raas-active-2024-2025-original-source-research.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/data/raas-active-2024-2025-primary-source-leads.json'
      - 'new-platform/frontend/data/raas-active-2024-2025-sec-cover-share-leads.json'
      - 'new-platform/frontend/data/raas-active-2024-2025-preentry-sec-share-leads.json'
      - 'scripts/raas_active_2024_2025_primary_cap_research.cjs'
      - 'scripts/raas_active_2024_2025_window79_audit.cjs'
      - 'scripts/raas_active_2024_2025_full_90_3_grid.cjs'
      - 'tests/raas_active_2024_2025_full_90_3_grid.test.cjs'
      - 'scripts/raas_active_2024_2025_window_robustness_audit.cjs'
      - 'tests/raas_active_2024_2025_window_robustness_audit.test.cjs'
      - 'scripts/raas_active_2024_2025_sec_cap_snapshot_sensitivity.cjs'
      - 'tests/raas_active_2024_2025_sec_cap_snapshot_sensitivity.test.cjs'
      - 'new-platform/frontend/data/raas-2025-adverse-candidate-inclusion-exclusion-leads.json'
      - 'scripts/raas_2025_crl_candidate_inclusion_exclusion.cjs'
      - 'tests/raas_2025_crl_candidate_inclusion_exclusion.test.cjs'
      - 'new-platform/frontend/data/raas-2025-unanchored-crl-source-leads.json'
      - 'scripts/raas_2025_crl_candidate_coverage_funnel.cjs'
      - 'tests/raas_2025_crl_candidate_coverage_funnel.test.cjs'
      - 'tests/raas_active_2024_2025_window79_audit.test.cjs'
      - 'tests/raas_active_2024_2025_primary_cap_research.test.cjs'
      - '.github/workflows/raas-active-2024-2025-original-source-research.yml'
permissions:
  contents: read
jobs:
  active-2024-2025-original-source-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual 2024/2025 original FDA target dates, historical SEC shares, raw versus adjusted price rules
        run: |
          node --test tests/raas_active_2024_2025_primary_cap_research.test.cjs
          node --test tests/raas_active_2024_2025_window79_audit.test.cjs
          node --test tests/raas_active_2024_2025_full_90_3_grid.test.cjs
          node --test tests/raas_active_2024_2025_window_robustness_audit.test.cjs
          node --test tests/raas_active_2024_2025_sec_cap_snapshot_sensitivity.test.cjs
          node --test tests/raas_2025_crl_candidate_inclusion_exclusion.test.cjs
          node --test tests/raas_2025_crl_candidate_coverage_funnel.test.cjs
          node --test tests/raas_historical_raw_market_cap_research.test.cjs
          node --test tests/raas_historical_preentry_share_window_research.test.cjs
      - name: Gather active 2024/2025 original source case as-of RAW and adjusted Alpaca daily prices
        if: github.event_name != 'pull_request'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RAAS_ACTIVE_SOURCE_RESEARCH_OUTPUT: ${{ runner.temp }}/raas-2024-2025-original-source-research.json
        run: node scripts/raas_active_2024_2025_primary_cap_research.cjs
      - name: Verify and export T-79 to T-14 issuer-level provisional results with price/source audit
        if: github.event_name != 'pull_request'
        env:
          RAAS_ACTIVE_SOURCE_RESEARCH_OUTPUT: ${{ runner.temp }}/raas-2024-2025-original-source-research.json
          RAAS_T79_14_AUDIT_JSON: ${{ runner.temp }}/raas-2024-2025-t79-14-audit.json
          RAAS_T79_14_AUDIT_CSV: ${{ runner.temp }}/raas-2024-2025-t79-14-audit.csv
        run: node scripts/raas_active_2024_2025_window79_audit.cjs
      - name: Compare all 3,828 T-90 to T-3 entry-exit combinations for each published PDUFA goal version (NOT validated)
        if: github.event_name != 'pull_request'
        env:
          RAAS_ACTIVE_SOURCE_RESEARCH_OUTPUT: ${{ runner.temp }}/raas-2024-2025-original-source-research.json
          RAAS_T90_T3_GRID_JSON: ${{ runner.temp }}/raas-2024-2025-full-t90-t3-grid.json
          RAAS_T90_T3_GRID_CSV: ${{ runner.temp }}/raas-2024-2025-full-t90-t3-grid.csv
        run: node scripts/raas_active_2024_2025_full_90_3_grid.cjs
      - name: Quantify T-79/T-14 leave-one-issuer-out fragility and holdout split (NOT validated)
        if: github.event_name != 'pull_request'
        env:
          RAAS_T79_14_AUDIT_JSON: ${{ runner.temp }}/raas-2024-2025-t79-14-audit.json
          RAAS_T79_14_ROBUSTNESS_JSON: ${{ runner.temp }}/raas-2024-2025-t79-14-robustness.json
          RAAS_T79_14_ROBUSTNESS_CSV: ${{ runner.temp }}/raas-2024-2025-t79-14-leave-one-out.csv
        run: node scripts/raas_active_2024_2025_window_robustness_audit.cjs
      - name: Compare earlier and later SEC cover snapshot capitalization without future-date lookahead (NOT validated)
        if: github.event_name != 'pull_request'
        env:
          RAAS_ACTIVE_SOURCE_RESEARCH_OUTPUT: ${{ runner.temp }}/raas-2024-2025-original-source-research.json
          RAAS_T79_14_AUDIT_JSON: ${{ runner.temp }}/raas-2024-2025-t79-14-audit.json
          RAAS_SEC_SENSITIVITY_JSON: ${{ runner.temp }}/raas-2024-2025-sec-cap-snapshot-sensitivity.json
          RAAS_SEC_SENSITIVITY_CSV: ${{ runner.temp }}/raas-2024-2025-sec-cap-snapshot-sensitivity.csv
        run: node scripts/raas_active_2024_2025_sec_cap_snapshot_sensitivity.cjs
      - name: Independently screen CAPR and ALDX 2025 FDA CRL candidates for Phase 3 timing, early FDA action, and historic entry cap
        if: github.event_name != 'pull_request'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RAAS_CRL_CANDIDATE_AUDIT_JSON: ${{ runner.temp }}/raas-2025-crl-candidate-exclusions.json
          RAAS_CRL_CANDIDATE_AUDIT_CSV: ${{ runner.temp }}/raas-2025-crl-candidate-exclusions.csv
        run: node scripts/raas_2025_crl_candidate_inclusion_exclusion.cjs
      - name: Build 2024/2025 FDA selected-case and unqualified-candidate coverage ledger (NOT a census)
        if: github.event_name != 'pull_request'
        env:
          RAAS_T79_14_AUDIT_JSON: ${{ runner.temp }}/raas-2024-2025-t79-14-audit.json
          RAAS_CRL_CANDIDATE_AUDIT_JSON: ${{ runner.temp }}/raas-2025-crl-candidate-exclusions.json
          RAAS_CRL_FUNNEL_JSON: ${{ runner.temp }}/raas-2024-2025-crl-candidate-coverage-funnel.json
          RAAS_CRL_FUNNEL_CSV: ${{ runner.temp }}/raas-2024-2025-crl-candidate-coverage-funnel.csv
        run: node scripts/raas_2025_crl_candidate_coverage_funnel.cjs
      - name: Publish provisional case price and SEC share audit gaps, no validated scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raas-2024-2025-original-source-research
          path: |
            ${{ runner.temp }}/raas-2024-2025-original-source-research.json
            ${{ runner.temp }}/raas-2024-2025-t79-14-audit.json
            ${{ runner.temp }}/raas-2024-2025-t79-14-audit.csv
            ${{ runner.temp }}/raas-2024-2025-full-t90-t3-grid.json
            ${{ runner.temp }}/raas-2024-2025-full-t90-t3-grid.csv
            ${{ runner.temp }}/raas-2024-2025-t79-14-robustness.json
            ${{ runner.temp }}/raas-2024-2025-t79-14-leave-one-out.csv
            ${{ runner.temp }}/raas-2024-2025-sec-cap-snapshot-sensitivity.json
            ${{ runner.temp }}/raas-2024-2025-sec-cap-snapshot-sensitivity.csv
            ${{ runner.temp }}/raas-2025-crl-candidate-exclusions.json
            ${{ runner.temp }}/raas-2025-crl-candidate-exclusions.csv
            ${{ runner.temp }}/raas-2024-2025-crl-candidate-coverage-funnel.json
            ${{ runner.temp }}/raas-2024-2025-crl-candidate-coverage-funnel.csv
          if-no-files-found: ignore
          retention-days: 30
