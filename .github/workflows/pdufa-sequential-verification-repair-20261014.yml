name: PDUFA Sequential Verification Repair 2026-10-14
# One-time focused source recheck -> scoring-input audit -> GEMS research refresh.
# Does not change canonical source claims or issue any broker trade.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdufa-sequential-verification-repair-20261014.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: pdufa-targeted-verification-20261014
  cancel-in-progress: false
jobs:
  verify-score-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
      SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '38575279522'
    steps:
      - name: Checkout current reviewed source ledger and scanner
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install primary-source parser and score-audit dependencies
        run: python -m pip install -r requirements.txt
      - name: 1. Verify source provenance before touching unresolved records
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python - "$RUNNER_TEMP/source-run.json" "$SOURCE_RUN_ID" <<'PY'
          import csv, json, sys
          from pathlib import Path
          with open(sys.argv[1]) as f: run=json.load(f)
          src=sys.argv[2]
          report=json.loads(Path("data/pdufa_source_report.json").read_text())
          with Path("data/pdufa_source_review_queue.csv").open(newline="", encoding="utf-8-sig") as f:
              queue=list(csv.DictReader(f))
          if (run.get("id") != int(src) or run.get("name") != "PDUFA Nightly FDA SEC Financial Market Issuer Sources"
              or run.get("conclusion") != "success" or run.get("status") != "completed"
              or report.get("latest_run_id") != src
              or report.get("required_findings_unresolved") != len(queue)
              or len(queue) != 45):
              raise SystemExit("Unverified or changed source scope; abort without evidence promotion")
          print("Source run validated; exact unresolved claims:", len(queue))
          PY
      - name: 2. Triage full 45-claim review queue (no automatic evidence promotion)
        run: |
          python scripts/scan_recovery_triage.py \
            --source-run-id "$SOURCE_RUN_ID" \
            --out reports/verification_repair_triage.json
      - name: 3. Recheck FDA then SEC then FINANCIAL then ISSUER with START and END notifications
        id: focused
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan REVERIFY --mode RECONCILE \
            --status-file reports/targeted_recheck_status.json \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 4200 -- \
            python -m scripts.targeted_verification_repair \
              --source-run-id "$SOURCE_RUN_ID" \
              --scan-report reports/targeted_recheck_status.json
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "::error::Recheck or required email failed; do not publish"
            exit "$code"
          fi
          test -s data/pdufa_targeted_recheck_report.json || exit 1
          test -s data/pdufa_targeted_recheck_results.csv || exit 1
          python - <<'PY'
          import csv, json
          from pathlib import Path
          result=json.loads(Path("data/pdufa_targeted_recheck_report.json").read_text())
          with Path("data/pdufa_targeted_recheck_results.csv").open(newline="") as f: checked=list(csv.DictReader(f))
          assert result["findings_due"] == 45 and len(checked) == 45
          assert result["source_baseline_unchanged"] and not result["trade_entry_authorized"]
          print("Exact source claims rechecked:", len(checked))
          print("Still unresolved:", result["required_findings_unresolved"])
          PY
      - name: 4. Run score lineage and missing-input tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_score_input_audit.py tests/test_nightly_scoring_audit.py tests/test_scoring_tab_navigation.py
      - name: 5. Build scored-input audit tied to latest completed source run
        run: |
          python -m scripts.nightly_scoring_audit \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-workflow "PDUFA Nightly FDA SEC Financial Market Issuer Sources" \
            --source-conclusion success \
            --out data/nightly_scoring_audit.json
      - name: 6. Publish recheck diagnostics and scoring audit without changing trade gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdufa-focus"
          cp data/pdufa_targeted_recheck_report.json data/pdufa_targeted_recheck_results.csv data/nightly_scoring_audit.json "$RUNNER_TEMP/pdufa-focus/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B focused-verification-publish origin/main
            python - "$SOURCE_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          obj=json.loads(Path("data/pdufa_source_report.json").read_text())
          if obj.get("latest_run_id") != sys.argv[1]:
              raise SystemExit("New source evidence published; refuse stale targeted write")
          PY
            cp "$RUNNER_TEMP/pdufa-focus/"* data/
            git add data/pdufa_targeted_recheck_report.json data/pdufa_targeted_recheck_results.csv data/nightly_scoring_audit.json
            if git diff --cached --quiet; then
              echo "Latest source diagnostics already published."
              exit 0
            fi
            git commit -m "Publish targeted PDUFA source recheck and source-bound scoring audit"
            if git push origin HEAD:main; then
              echo "Published source-bound verification and scoring diagnostics."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Unable to publish source diagnostics after retries"
          exit 1
      - name: 7. Request GEMS refreshed research scan AFTER verification and scoring publish
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/gem-research-quality.yml/dispatches" \
            -f ref=main -f 'inputs[action]=REVERIFY_PARTIAL'
          echo "GEMS research refresh accepted (not proof of completion or trade eligibility)."
      - name: Archive conservative verification evidence and notification audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-targeted-verification-repair-${{ github.run_id }}
          path: |
            reports/verification_repair_triage.json
            reports/targeted_recheck_status.json
            reports/scan_notifications/
            data/pdufa_targeted_recheck_report.json
            data/pdufa_targeted_recheck_results.csv
            data/nightly_scoring_audit.json
          if-no-files-found: warn
          retention-days: 30
