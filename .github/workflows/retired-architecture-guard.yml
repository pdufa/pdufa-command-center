name: Permanent Retired Architecture Guard

on:
  push:
    branches:
      - main
      - feature/deep-medical-intelligence-preview-20261107
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-retirement:
    name: Reject retired scoring, screens and scheduled workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify permanent architecture and archive preservation
        run: python scripts/check_retired_raas_policy.py
