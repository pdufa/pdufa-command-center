name: POOL missing-source targeted retry (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  missing-only:
    if: github.ref == 'refs/heads/codex/levels-09-20-development-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject overlap with original recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/actions/runs/44120924177" --jq '.status')
          test "$state" = completed || { echo 'Existing registry recovery still active; no overlapping source requests.'; exit 1; }
      - name: Verify request pacing and missing-NCT selection offline
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_pool_registry_resume.py tests/test_registry_rate_limit_retry.py
      - name: Restore most recent saved registry archive
        id: latest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 44120924177
          name: pool-registry-recovery-44120924177
          github-token: ${{ github.token }}
          path: reports/deep-medical-intelligence
      - name: Restore original preserved archive if newer one unavailable
        if: steps.latest.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          run-id: 44112507426
          name: pool-registry-raw-research
          github-token: ${{ github.token }}
          path: reports/deep-medical-intelligence
      - name: Reject incompatible source roster or fabricated reviews
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("reports/deep-medical-intelligence")
          inventory=json.loads((base/"inventory.json").read_text())
          files={s["path"]:s["sha256"] for s in inventory["sourceFiles"]}
          expected={"new-platform/frontend/data/tools-pool-snapshot.json",
                    "new-platform/frontend/data/p3PostDataActive.json",
                    "data/all_phase_trials.csv"}
          assert set(files)==expected
          for name,sha in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha, name
          total=inventory["counts"]["uniqueInventoryNcts"]
          assert total==11667
          assert inventory["counts"]["rawRegistryPacketsCaptured"]>=11626
          assert inventory["counts"]["fullySourceReviewed"]==0
          print("SOURCE_SNAPSHOT_MATCHED_NOT_CLINICALLY_VERIFIED",total)
          PY
      - name: Retry only absent exact-NCT source packets with slow pacing
        id: fetch
        continue-on-error: true
        run: |
          python scripts/collect_deep_medical_intelligence.py \
            --all --fetch-all --missing-only --resume \
            --workers 1 --retries 3 --timeout 25 --request-delay 3
      - name: Count remaining original-source gaps without clinical interpretation
        id: audit
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("reports/deep-medical-intelligence")
          inv=json.loads((base/"inventory.json").read_text())
          state=json.loads((base/"ingestion-state.json").read_text())
          job=json.loads((base/"ingestion-job.json").read_text())
          ncts={r["nctId"] for r in inv["records"]}
          missing=sorted(r["nctId"] for r in inv["records"] if not r["rawRegistryCaptured"])
          assert len(ncts)==inv["counts"]["uniqueInventoryNcts"]==11667
          assert inv["counts"]["fullySourceReviewed"]==0
          assert inv["counts"]["scientificReviewIncomplete"]==11667
          assert all(not state["sources"][n]["versions"] for n in missing)
          print("RAW_REGISTRY_UNCAPTURED_EXACT_NCTS",missing)
          assert not missing, "Original source capture incomplete; no scientific completion claim"
          assert job["state"]=="COMPLETED"
          PY
      - name: Save preserved original-source archive and unresolved gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-registry-targeted-retry-${{ github.run_id }}
          path: reports/deep-medical-intelligence/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail if any exact source packet remains unavailable
        if: always() && (steps.fetch.outcome != 'success' || steps.audit.outcome != 'success')
        run: |
          echo 'Missing primary-source packets remain unresolved; no production update.'
          exit 1
