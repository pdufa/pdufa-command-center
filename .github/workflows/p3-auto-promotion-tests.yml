name: P3 POST-DATA auto-transfer safety checks
on:
  pull_request:
    paths:
      - 'scripts/auto_promote_p3_post_data.py'
      - 'new-platform/backend/app/phase3_curated_announcements.json'
      - 'data/post_phase3_discoveries.csv'
      - 'tests/test_p3_auto_promotion.py'
      - 'scripts/refresh_existing_p3_post_data.py'
      - 'scripts/p3_market_cap_secondary.py'
      - 'tests/test_p3_market_cap_secondary.py'
      - 'tests/test_p3_existing_row_refresh.py'
      - '.github/workflows/p3-post-data-google-sheet-sync.yml'
      - '.github/workflows/p3-auto-promotion-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/auto_promote_p3_post_data.py'
      - 'tests/test_p3_auto_promotion.py'
      - '.github/workflows/p3-auto-promotion-tests.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only public test dependencies
        run: python -m pip install requests google-auth beautifulsoup4
      - name: Verify eligibility gates, exact-NCT dedupe and fail-closed review
        run: |
          python -m unittest discover -s tests -p 'test_p3_auto_promotion.py' -v
          python -m unittest discover -s tests -p 'test_p3_regulatory_stage_rules.py' -v
          python -m unittest discover -s tests -p 'test_p3_existing_row_refresh.py' -v
          python -m unittest discover -s tests -p 'test_p3_market_cap_secondary.py' -v
