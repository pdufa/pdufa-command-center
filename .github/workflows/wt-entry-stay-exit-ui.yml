name: WT ENTRY STAY EXIT UI Checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'new-platform/frontend/**'
      - '.github/workflows/wt-entry-stay-exit-ui.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wt-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
