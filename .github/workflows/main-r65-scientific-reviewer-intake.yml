name: MAIN R65 original-source independent reviewer intake readiness

# Draft medical research only. This workflow creates a read-only 232-item
# evidence and original-document reviewer intake queue, never signs reviews,
# grades a method, enables the isolated existing POST API, or predicts FDA.
# No production, original clinical ledger, FOCUS roster, retired scan, Track B
# historical outcome, or auto-model-training writes.
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r65-scientific-reviewer-intake.yml
      - new-platform/backend/scripts/build_focus_reviewer_adjudication_intake_r65.py
      - new-platform/backend/tests/test_focus_reviewer_adjudication_intake_r65.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: main-r65-original-reviewer-intake
  cancel-in-progress: false

jobs:
  build-read-only-independent-adjudication-worklist:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact code and independent FOCUS membership untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python scripts/audit_raas_retirement.py --check
      - name: Restore exact R63 source-checked eight-domain original PDF archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42713443428
          name: main-r63-eight-domain-source-ladder-42713443428
          path: ${{ runner.temp }}/r65/source
      - name: Adversarial unit tests on immutable archived original R63 bytes
        shell: bash
        env:
          R65_ORIGINAL_R63_PATH: ${{ runner.temp }}/r65/source/FOCUS_29_TRIAL_EIGHT_DOMAIN_SOURCE_REVIEW_R63.json
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<10'
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_focus_reviewer_adjudication_intake_r65.py
      - name: Build immutable, unsigned human-review docket without writing clinical data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r65/research"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/build_focus_reviewer_adjudication_intake_r65.py \
            --original-r63 "$RUNNER_TEMP/r65/source/FOCUS_29_TRIAL_EIGHT_DOMAIN_SOURCE_REVIEW_R63.json" \
            --output "$RUNNER_TEMP/r65/research/FOCUS_29_TRIAL_232_HUMAN_REVIEW_INTAKE_R65.json" \
            --summary "$RUNNER_TEMP/r65/research/FOCUS_HUMAN_REVIEW_READINESS_R65.md"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ["RUNNER_TEMP"])/"r65/research"
          r=json.loads((root/"FOCUS_29_TRIAL_232_HUMAN_REVIEW_INTAKE_R65.json").read_bytes())
          assert r["schema"]=="MAIN_R65_ORIGINAL_SOURCE_HUMAN_ADJUDICATION_INTAKE_ONLY"
          assert r["exactNctCount"]==29 and r["provisionalApplicationCount"]==23
          assert r["scientificReviewerTasks"]==232
          assert r["originalMachinePdfPageLeads"]==466
          assert r["originalPdfFilesWithLeads"]==22
          assert len(r["trialIndependentReviewPackets"])==29
          assert len({x["nct"] for x in r["trialIndependentReviewPackets"]})==29
          assert r["qualifiedReviewerAttestationsRecorded"]==0
          assert r["independentVerifiedPhaseEventsRecorded"]==0
          assert r["independentlyCompletedMethodGrades"]==0
          assert r["independentStatisticalOrSafetySignoffs"]==0
          assert r["independentlyValidatedFDAApplicationPredictions"]==0
          assert r["measuredOutOfTimeForecastAccuracy"] is None
          assert r["officialFDAOutcome"]=="ABSTAIN"
          assert r["fdaReviewTiming"]=="ABSTAIN"
          assert r["gradeOrProbabilityReleasePermitted"] is False
          assert r["reviewWritesEnabled"] is False
          assert r["productionOrLedgerWrites"] is False
          assert r["historicalOutcomeDataAccessed"] is False
          assert all(t["phaseVerifiedByIndependentReviewer"] is False
                     and t["completedClinicalMethodScores"]==0
                     and len(t["trialReviewSlots"])==8
                     and all(s["grade"] is None and s["reviewerId"] is None
                             and s["secondIndependentVerifier"] is None
                             and s["readyToRecordClinicalMethodGrade"] is False
                             for s in t["trialReviewSlots"])
                     for t in r["trialIndependentReviewPackets"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## R65 original-source human scientific adjudication intake\n\n")
            f.write("29 unique trials, 23 provisional FDA cycle groups, 232 eight-domain reviewer tasks linked to 466 original machine PDF page leads. Each task records the evidence needed for phase-first original pre-unblinding protocol/SAP, statistical, safety and human-role verification. **No reviewer has signed, no method has been graded, no FDA prediction is validated, and no historical outcome was consulted.**\n\n")
            f.write((root/"FOCUS_HUMAN_REVIEW_READINESS_R65.md").read_text())
          PY
      - name: Preserve R65 research-only human review worklist and task summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-r65-source-linked-unsigned-review-worklist-${{ github.run_id }}
          path: ${{ runner.temp }}/r65/research/
          retention-days: 90
          if-no-files-found: error
