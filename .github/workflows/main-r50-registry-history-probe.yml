name: MAIN R50 exact FOCUS registry historical source probe
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r50-registry-history-probe.yml
      - new-platform/backend/scripts/probe_focus_registry_versions_r50.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-r50-registry-version-probe
  cancel-in-progress: false
jobs:
  inspect-original-registry-version-availability:
    if: github.repository == 'pdufa/pdufa-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin source membership and never use retired analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python scripts/audit_raas_retirement.py --check > /dev/null
      - name: Probe original first posted trial version and history index source shapes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/probe_focus_registry_versions_r50.py
