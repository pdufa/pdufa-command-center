name: Assessment merge conflict diagnostic
on:
  push:
    branches:
      - codex/level1-6-explicit-scientific-readiness-20261114
    paths:
      - 'scripts/check_assessment_merge_conflicts.sh'
      - '.github/workflows/assessment-merge-diagnostic.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_assessment_merge_conflicts.sh'
      - '.github/workflows/assessment-merge-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/level1-6-explicit-scientific-readiness-20261114
      - name: Verify main merge compatibility without committing
        run: bash scripts/check_assessment_merge_conflicts.sh .
