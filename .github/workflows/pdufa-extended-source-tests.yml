name: PDUFA Extended Source Scan Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdufa-extended-source-tests.yml'
      - 'scripts/nightly_missing_sources.py'
      - 'scripts/source_verification.py'
      - 'scripts/recheck_events.py'
      - 'scripts/scan_email.py'
      - 'tests/test_nightly_missing_sources.py'
      - 'tests/test_source_verification.py'
      - 'tests/test_ryzumvi_fda_decision_evidence.py'
      - 'tests/test_fda_weekday_delta.py'
      - 'tests/test_scan_completion_repairs.py'
      - 'tests/test_scan_email_notifications.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pdufa-extended-source-tests.yml'
      - 'scripts/nightly_missing_sources.py'
      - 'scripts/source_verification.py'
      - 'scripts/recheck_events.py'
      - 'scripts/scan_email.py'
      - 'tests/test_nightly_missing_sources.py'
      - 'tests/test_source_verification.py'
      - 'tests/test_fda_weekday_delta.py'
      - 'tests/test_scan_completion_repairs.py'
      - 'tests/test_scan_email_notifications.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source collector test dependencies
        run: python -m pip install pandas pypdf
      - name: Test source scan audits without contacting outside data providers
        run: |
          python -m unittest discover -s tests -p 'test_nightly_missing_sources.py' -v
          python -m unittest discover -s tests -p 'test_source_verification.py' -v
          python -m unittest discover -s tests -p 'test_ryzumvi_fda_decision_evidence.py' -v
          python -m unittest discover -s tests -p 'test_fda_weekday_delta.py' -v
          python -m unittest discover -s tests -p 'test_scan_completion_repairs.py' -v
          python -m unittest discover -s tests -p 'test_scan_email_notifications.py' -v


