name: MAIN Historical FDA Backtesting and Calibration
on:
  push:
    branches:
      - feature/medical-stage4-verified-method-matrix-20261108
    paths:
      - .github/workflows/main-r47-historical-source-track-b.yml
      - new-platform/backend/scripts/build_historical_source_checkpoint_r47.py
      - new-platform/backend/tests/test_parallel_focus_historical_r47.py
      - new-platform/backend/scripts/build_historical_source_identity_audit_r48.py
      - new-platform/backend/tests/test_historical_source_identity_r48.py
      - new-platform/backend/scripts/crosscheck_historical_fda_action_sources_r49.py
      - new-platform/backend/scripts/probe_fda_pdufa_appendix_r50.py
      - new-platform/backend/scripts/build_fda_fy2024_cycle_events_r50.py
      - new-platform/backend/tests/test_fda_fy2024_cycle_events_r50.py
      - new-platform/backend/tests/test_historical_fda_action_source_crosscheck_r49.py
      - new-platform/backend/scripts/research_workstream_history.py
      - new-platform/backend/scripts/select_research_history_run.py
      - new-platform/backend/tests/test_research_workstream_history.py
      - new-platform/backend/tests/test_historical_fda_action_source_crosscheck_r49.py
      - new-platform/backend/app/hop_probability_calibration.py
      - new-platform/backend/tests/test_hop_probability_calibration.py
  workflow_dispatch:
  schedule:
    - cron: '28 10 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: main-r47-history-track-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-research:
    if: github.repository == 'pdufa/pdufa-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONPATH: new-platform/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent historical replay integrity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install pytest pymupdf
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_parallel_focus_historical_r47.py tests/test_hop_blinded_phase3_backtest.py tests/test_hop_fda_source_recovery_r38.py tests/test_historical_source_identity_r48.py tests/test_hop_probability_calibration.py tests/test_research_workstream_history.py tests/test_historical_fda_action_source_crosscheck_r49.py tests/test_fda_fy2024_cycle_events_r50.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Locate the latest completed Track B history without changing either workstream
        id: previous_history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python new-platform/backend/scripts/select_research_history_run.py --track B
      - name: Restore the immutable Track B history artifact
        if: steps.previous_history.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_history.outputs.run_id }}
          name: ${{ steps.previous_history.outputs.artifact_name }}
          path: ${{ runner.temp }}/r47-history/previous-history
      - name: Capture current original FDA approval and CRL publication sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-history/approved" "$RUNNER_TEMP/r47-history/crl" "$RUNNER_TEMP/r47-history/derived"
          python new-platform/backend/scripts/collect_hop_drugsfda.py --output-dir "$RUNNER_TEMP/r47-history/approved"
          python new-platform/backend/scripts/collect_hop_openfda_crl.py --output-dir "$RUNNER_TEMP/r47-history/crl"
      - name: Rebuild strictly segregated source candidates
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/refresh_hop_fda_action_candidates.py \
            --approved "$RUNNER_TEMP/r47-history/approved/drugsfda_approved_registry_quarantined.json" \
            --crl "$RUNNER_TEMP/r47-history/crl/fda_crl_published_quarantined.json" \
            --out "$RUNNER_TEMP/r47-history/derived" \
            --as-of "$(date -u +%Y-%m-%d)"
      - name: Publish valid independent historical-replay readiness
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/build_historical_source_checkpoint_r47.py \
            --candidates "$RUNNER_TEMP/r47-history/derived/r38_fda_source_candidates.json" \
            --receipt "$RUNNER_TEMP/r47-history/derived/r38_fda_source_receipt.json" \
            --output "$RUNNER_TEMP/r47-history/historical_replay_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r47-history/historical_replay_readiness.json"
          r=json.loads(p.read_bytes())
          assert r["schema"]=="MAIN_R47_HISTORICAL_SOURCE_BUILD_CHECKPOINT"
          assert r["pairedIndependentHistory"]==0
          assert r["prospectiveAccuracy"] is None
          assert r["calibration"] is None
          assert r["productionWriteAuthorized"] is False
          message=("Historical FDA source actions examined: "+str(r["researchSourceActionCandidates"])+
                   ". True historical backtests: 0; accuracy unverified. Cohort and independent review still required.")
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(message+"\n")
          PY
      - name: Identify repeated FDA parent source records and distinct historical review-cycle blockers
        shell: bash
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/build_historical_source_identity_audit_r48.py \
            --candidates "$RUNNER_TEMP/r47-history/derived/r38_fda_source_candidates.json" \
            --receipt "$RUNNER_TEMP/r47-history/derived/r38_fda_source_receipt.json" \
            --out-dir "$RUNNER_TEMP/r47-history/derived"
      - name: Cross-check original FDA submission and selected published CRL source records
        shell: bash
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/crosscheck_historical_fda_action_sources_r49.py \
            --candidates "$RUNNER_TEMP/r47-history/derived/r38_fda_source_candidates.json" \
            --receipt "$RUNNER_TEMP/r47-history/derived/r38_fda_source_receipt.json" \
            --approved "$RUNNER_TEMP/r47-history/approved/drugsfda_approved_registry_quarantined.json" \
            --crl "$RUNNER_TEMP/r47-history/crl/fda_crl_published_quarantined.json" \
            --identity "$RUNNER_TEMP/r47-history/derived/postdecision_fda_source_identity_audit.json" \
            --output "$RUNNER_TEMP/r47-history/derived/r49_postdecision_fda_original_source_crosscheck.json"
      - name: Original FDA FY2024 approved-only review-cycle action history source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-history/fda2024"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/probe_fda_pdufa_appendix_r50.py \
            --out "$RUNNER_TEMP/r47-history/fda2024"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/build_fda_fy2024_cycle_events_r50.py \
            --pdf "$RUNNER_TEMP/r47-history/fda2024/original_fda_fy2024_pdufa_report.pdf" \
            --output "$RUNNER_TEMP/r47-history/fda2024/approved_only_regulator_review_cycle_actions.json"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"r47-history/fda2024"
          r=json.loads((root/"approved_only_regulator_review_cycle_actions.json").read_bytes())
          sha=hashlib.sha256((root/"original_fda_fy2024_pdufa_report.pdf").read_bytes()).hexdigest()
          assert r["sourceOriginalPdfSha256"]==sha
          assert r["sourceTableActionEvents"]==186
          assert r["sourceActionCounts"]=={"AP":126,"CR":43,"TA":17}
          assert r["modelEligibleIndependentHistoricalCases"]==0
          assert r["trueIndependentHistoricalBacktests"]==0
          assert r["measuredAccuracy"] is None
          assert r["forecasterInputAuthorized"] is False
          assert r["productionStateMutated"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Regulator review cycle evidence: FY2024 FDA **approved-only** cohort\\n"
                      "186 page-anchored cycle rows (126 AP, 43 CR, 17 TA). "
                      "These are NOT 186 independent cases; no prospective accuracy released.\\n")
          PY
      - name: Append Track B research history and source-change review receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-history/history"
          prior=()
          if [[ -n "${{ steps.previous_history.outputs.run_id }}" ]]; then
            test -f "$RUNNER_TEMP/r47-history/previous-history/research-history.json"
            prior=(--previous "$RUNNER_TEMP/r47-history/previous-history/research-history.json")
          fi
          python new-platform/backend/scripts/research_workstream_history.py \
            --track B --snapshot "$RUNNER_TEMP/r47-history/historical_replay_readiness.json" \
            --output "$RUNNER_TEMP/r47-history/history/research-history.json" \
            --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" "${prior[@]}"
      - name: Preserve separate Track B append-only history
        uses: actions/upload-artifact@v4
        with:
          name: main-historical-research-history-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-history/history/
          retention-days: 90
          if-no-files-found: error
      - name: Save original FDA sources and research-only reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-r47-historical-track-b-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-history/
          retention-days: 90
          if-no-files-found: warn
      - name: Report independent Track B failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=Track B research failed::Inspect this workflow's source/history receipts. No prediction or clinical grade was released; the other track is independent."
          echo "## Track B FAILED — separate run $GITHUB_RUN_ID; source gaps are not negative clinical findings. See the retained partial artifact and failed step." >> "$GITHUB_STEP_SUMMARY"
