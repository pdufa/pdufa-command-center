name: MAIN R47 historical FDA research track B
on:
  push:
    branches:
      - feature/medical-stage4-verified-method-matrix-20261108
    paths:
      - .github/workflows/main-r47-historical-source-track-b.yml
      - new-platform/backend/scripts/build_historical_source_checkpoint_r47.py
      - new-platform/backend/tests/test_parallel_focus_historical_r47.py
      - new-platform/backend/scripts/build_historical_source_identity_audit_r48.py
      - new-platform/backend/tests/test_historical_source_identity_r48.py
  workflow_dispatch:
  schedule:
    - cron: '28 10 * * *'
permissions:
  contents: read
concurrency:
  group: main-r47-history-track-b
  cancel-in-progress: false
jobs:
  historical-research:
    if: github.repository == 'pdufa/pdufa-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONPATH: new-platform/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent historical replay integrity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install pytest
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_parallel_focus_historical_r47.py tests/test_hop_blinded_phase3_backtest.py tests/test_hop_fda_source_recovery_r38.py tests/test_historical_source_identity_r48.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Capture current original FDA approval and CRL publication sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r47-history/approved" "$RUNNER_TEMP/r47-history/crl" "$RUNNER_TEMP/r47-history/derived"
          python new-platform/backend/scripts/collect_hop_drugsfda.py --output-dir "$RUNNER_TEMP/r47-history/approved"
          python new-platform/backend/scripts/collect_hop_openfda_crl.py --output-dir "$RUNNER_TEMP/r47-history/crl"
      - name: Rebuild strictly segregated source candidates
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/refresh_hop_fda_action_candidates.py \
            --approved "$RUNNER_TEMP/r47-history/approved/drugsfda_approved_registry_quarantined.json" \
            --crl "$RUNNER_TEMP/r47-history/crl/fda_crl_published_quarantined.json" \
            --out "$RUNNER_TEMP/r47-history/derived" \
            --as-of "$(date -u +%Y-%m-%d)"
      - name: Publish valid independent historical-replay readiness
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/build_historical_source_checkpoint_r47.py \
            --candidates "$RUNNER_TEMP/r47-history/derived/r38_fda_source_candidates.json" \
            --receipt "$RUNNER_TEMP/r47-history/derived/r38_fda_source_receipt.json" \
            --output "$RUNNER_TEMP/r47-history/historical_replay_readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r47-history/historical_replay_readiness.json"
          r=json.loads(p.read_bytes())
          assert r["schema"]=="MAIN_R47_HISTORICAL_SOURCE_BUILD_CHECKPOINT"
          assert r["pairedIndependentHistory"]==0
          assert r["prospectiveAccuracy"] is None
          assert r["calibration"] is None
          assert r["productionWriteAuthorized"] is False
          message=("Historical FDA source actions examined: "+str(r["researchSourceActionCandidates"])+
                   ". True historical backtests: 0; accuracy unverified. Cohort and independent review still required.")
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(message+"\n")
          PY
      - name: Identify repeated FDA parent source records and distinct historical review-cycle blockers
        shell: bash
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/build_historical_source_identity_audit_r48.py \
            --candidates "$RUNNER_TEMP/r47-history/derived/r38_fda_source_candidates.json" \
            --receipt "$RUNNER_TEMP/r47-history/derived/r38_fda_source_receipt.json" \
            --out-dir "$RUNNER_TEMP/r47-history/derived"
      - name: Save original FDA sources and research-only reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-r47-historical-track-b-${{ github.run_id }}
          path: ${{ runner.temp }}/r47-history/
          retention-days: 90
          if-no-files-found: warn
