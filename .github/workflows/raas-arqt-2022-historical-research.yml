name: RAAS 2022 ARQT original FDA PDUFA and Alpaca price research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/data/raas-historical-2022-primary-source-leads.json'
      - 'new-platform/frontend/data/raas-2022-sec-cover-share-leads.json'
      - 'new-platform/frontend/data/raas-preentry-2022-sec-cover-share-leads.json'
      - 'scripts/raas_historical_arqt_2022_research.cjs'
      - 'tests/raas_historical_arqt_2022_research.test.cjs'
      - '.github/workflows/raas-arqt-2022-historical-research.yml'
  pull_request:
    paths:
      - 'new-platform/frontend/data/raas-historical-2022-primary-source-leads.json'
      - 'new-platform/frontend/data/raas-2022-sec-cover-share-leads.json'
      - 'new-platform/frontend/data/raas-preentry-2022-sec-cover-share-leads.json'
      - 'scripts/raas_historical_arqt_2022_research.cjs'
      - 'tests/raas_historical_arqt_2022_research.test.cjs'
      - '.github/workflows/raas-arqt-2022-historical-research.yml'
permissions:
  contents: read
jobs:
  arqt-2022-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test FDA and SEC publication timing, source identity, no score promotion
        run: |
          node --test tests/raas_historical_arqt_2022_research.test.cjs
          node --test tests/raas_historical_raw_market_cap_research.test.cjs
      - name: Research ARQT 2022 historical raw and adjusted prices, no validated trade claims
        if: github.event_name != 'pull_request'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          RAAS_2022_ARQT_OUTPUT: ${{ runner.temp }}/raas-2022-arqt-zoryve-research.json
        run: node scripts/raas_historical_arqt_2022_research.cjs
      - name: Save 2022 historical price and share-study diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raas-2022-arqt-zoryve-research
          path: ${{ runner.temp }}/raas-2022-arqt-zoryve-research.json
          retention-days: 30
          if-no-files-found: ignore
