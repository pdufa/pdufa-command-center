name: Unrestricted 730 GEM JR GEM review
on:
  push:
    paths:
      - 'scripts/phase3_730_unfiltered_gem.py'
      - '.github/workflows/phase3-730-unfiltered-gem.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * 1'
permissions:
  contents: write
jobs:
  unfiltered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/phase3_730_unfiltered_gem.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase3_730_unfiltered_gem_queues.csv data/phase3_730_unfiltered_gem_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish unrestricted 730 GEM research queues"
          git pull --rebase origin main
          git push origin HEAD:main
