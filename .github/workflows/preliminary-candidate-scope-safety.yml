name: Preliminary candidate scope safety

on:
  pull_request:
    paths:
      - 'research/preliminary_candidate_scope.py'
      - 'tests/test_preliminary_candidate_scope.py'
      - '.github/workflows/preliminary-candidate-scope-safety.yml'
  push:
    branches:
      - 'research/fda-decision-label-gate-20261028'
    paths:
      - 'research/preliminary_candidate_scope.py'
      - 'tests/test_preliminary_candidate_scope.py'
      - '.github/workflows/preliminary-candidate-scope-safety.yml'

permissions:
  contents: read

jobs:
  scope-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run preliminary candidate scope tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_preliminary_candidate_scope.py
