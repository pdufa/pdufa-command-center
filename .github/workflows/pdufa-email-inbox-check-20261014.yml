name: PDUFA One-Time Gmail Auto-Filing Check
# One-shot verification of Gmail PDUFA labeling plus Inbox removal.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdufa-email-inbox-check-20261014.yml'
permissions:
  contents: read
jobs:
  check-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit one notification and verify automatic Gmail filing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts.scan_email import EmailSettings, send_email
          settings = EmailSettings.from_env()
          result = send_email(
              settings,
              "[PDUFA] AUTO-FILING VERIFICATION - 2026-10-15",
              "One-time automatic PDUFA label and Inbox removal verification. No clinical scan was started."
          )
          print("SMTP submission:", result["status"])
          print("PDUFA filing status:", result["filing_status"])
          if result["filing_status"] != "PDUFA_LABEL_AND_ARCHIVE_ACCEPTED":
              raise SystemExit("PDUFA label and Inbox removal were not confirmed. Email may have been sent; do not resend blindly.")
          PY
