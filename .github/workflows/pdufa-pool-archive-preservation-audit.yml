name: Verify original POOL trial identities in production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/pdufa-pool-archive-preservation-audit.yml]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare immutable baseline, current clinical source, and signed-in production POOL
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          ORIGINAL_RELEASE: a015bd0e8eb05d8ad752ce9e191f705c00bc407e
        run: |
          python3 - <<'PY'
          import csv,gzip,hashlib,http.cookiejar,io,json,os,re,subprocess,time,urllib.request,urllib.error
          def trials(text):
              reader=csv.DictReader(io.StringIO(text))
              if 'nct_id' not in (reader.fieldnames or []): raise AssertionError('Missing nct_id header')
              rows=list(reader)
              ids={r['nct_id'].strip() for r in rows if r.get('nct_id') and re.fullmatch(r'NCT\d{8}',r['nct_id'].strip())}
              if not ids: raise AssertionError('Empty NCT inventory')
              return ids,len(rows)
          original,original_rows=trials(subprocess.check_output(['git','show',os.environ['ORIGINAL_RELEASE']+':data/all_phase_trials.csv'],text=True))
          current,current_rows=trials(open('data/all_phase_trials.csv',encoding='utf-8-sig').read())
          print('IMMUTABLE_BASELINE unique_NCT',len(original),'rows',original_rows)
          print('CURRENT_SOURCE unique_NCT',len(current),'rows',current_rows)
          print('SOURCE_ORIGINAL_MISSING',len(original-current))
          if original-current: raise SystemExit('FAIL: original clinical NCT IDs absent in current source')
          password=os.environ.get('DASHBOARD_PASSWORD')
          if not password: raise SystemExit('BLOCKED: existing dashboard password secret missing')
          base='https://pdufa-new-dashboard.vercel.app'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def request(path,post=None):
              headers={'Accept':'application/json','Accept-Encoding':'gzip','User-Agent':'pdufa-immutable-readonly-audit/1'}
              if post is not None: headers.update({'Origin':base,'Content-Type':'application/json'})
              req=urllib.request.Request(base+path,method='POST' if post is not None else 'GET',data=json.dumps(post).encode() if post is not None else None,headers=headers)
              with opener.open(req,timeout=60) as response:
                  raw=response.read(40000001)
                  if len(raw)>40000000: raise AssertionError('Bounded audit response size exceeded')
                  if response.headers.get('Content-Encoding','').lower()=='gzip': raw=gzip.decompress(raw)
                  return json.loads(raw)
          if request('/api/auth',{'password':password})!={'authenticated':True}:raise AssertionError('Login rejected')
          if request('/api/auth')!={'authenticated':True}:raise AssertionError('Authenticated session missing')
          snapshot=None
          for attempt in range(3):
              try:
                  snapshot=request('/api/workspace')
                  break
              except urllib.error.HTTPError as err:
                  print('WORKSPACE_HTTP_STATUS',err.code,'attempt',attempt+1)
                  if err.code not in (502,503) or attempt==2:raise
                  time.sleep(5)
          rows=snapshot.get('pipeline')
          health=snapshot.get('sourceHealth') or {}
          if not isinstance(rows,list) or health.get('state')=='STALE': raise AssertionError('Source missing or stale')
          parity=health.get('pipelineSourceParity') or health.get('streamlitPipelineParity') or {}
          if parity.get('exactPrograms')!=len(rows): raise AssertionError('Source parity mismatch')
          ncts=set()
          for row in rows:
              key=row.get('id','')
              val=row.get('nctId') or (key.split('|')[1] if key.startswith(('TRIAL|','RESULT|')) and len(key.split('|'))>1 else '')
              if isinstance(val,str) and re.fullmatch(r'NCT\d{8}',val):ncts.add(val)
          def digest(values):
              return hashlib.md5(','.join(sorted(values)).encode('utf-8')).hexdigest()
          print('IMMUTABLE_NCT_SORTED_MD5',digest(original))
          print('CURRENT_NCT_SORTED_MD5',digest(current))
          print('PRODUCTION_NCT_SORTED_MD5',digest(ncts))
          print('PRODUCTION_SOURCE_RECORDS',len(rows),'PRODUCTION_DISTINCT_NCTS',len(ncts))
          print('BASELINE_MISSING_FROM_PRODUCTION',len(original-ncts))
          print('CURRENT_MISSING_FROM_PRODUCTION',len(current-ncts))
          if original-ncts or current-ncts: raise SystemExit('FAIL: live POOL does not cover original/current clinical source IDs')
          print('PASS: original and current clinical trial identities retained in signed-in live POOL')
          print('NOTE: This does not certify fully current FDA, SEC, market coverage, eligibility or database restore.')
          # Verify the live TOOLS counts against this same signed-in published POOL.
          from collections import Counter
          from urllib.parse import quote
          stage_labels=['Early Phase 1','Phase 1','Phase 1/2','Phase 2','Phase 2/3',
                        'Phase 3','Phase 3 Results','NDA/BLA Submission','FDA Acceptance',
                        'PDUFA Decision','Post-Decision','Phase 4','Not Applicable','Unknown']
          unique_trials=[r for r in rows if re.fullmatch(r'TRIAL\|NCT\d{8}',r.get('id',''))]
          stages=Counter(r.get('stage') if r.get('stage') in stage_labels else 'Unknown' for r in unique_trials)
          tools_path='/api/scope-funnel?view=pool&recordKind=trials&tools=1&limit=50&offset=0'
          tools=request(tools_path)
          totals=tools.get('stageStats') or {}
          stage_counts=totals.get('stages') or {}
          assert totals.get('trials')==len(unique_trials),'TOOLS NCT count differs from published workspace POOL'
          assert sum((stage_counts.get(s) or {}).get('trials',-1) for s in stage_labels)==len(unique_trials),'TOOLS stage totals do not add up'
          for label in stage_labels:
              assert (stage_counts.get(label) or {}).get('trials')==stages[label],f'TOOLS wrong stage count for {label}'
          assert tools.get('total')==0 and not tools.get('rows'),'TOOLS zero-selection state is not zero'
          assert (tools.get('selectionSummary') or {}).get('selectedCount')==0,'TOOLS initial checked selector count incorrect'
          stage=max(stage_labels,key=lambda label:stages[label])
          stage_request=tools_path+'&stages='+quote(stage,safe='')
          stage_selected=request(stage_request)
          assert stage_selected.get('total')==stages[stage],'Selected stage does not return its own verified NCT count'
          assert all(r.get('stage')==stage for r in stage_selected.get('spreadsheetRows',[])),'Wrong stage in spreadsheet'
          # Require a real positive designation-only match from the curated
          # drug/indication-to-NCT crosswalk, then verify the corresponding
          # intersection by recorded stage. Never accept a fabricated zero.
          idx=request('/api/trial-designations')
          coverage=idx.get('linkageCoverage') or {}
          assert coverage.get('verifiedNctCount',0)>=4,'Reviewed evidence index was not loaded'
          priority=request(tools_path+'&designations=priority_review')
          assert priority['total']>0,'No audited priority-review NCT links found in POOL'
          first=priority.get('spreadsheetRows',[None])[0]
          assert first and first.get('designationMatches',{}).get('priority_review'),'Missing source-backed priority evidence'
          matched_stage=first['stage']
          combined=request(tools_path+'&stages='+quote(matched_stage,safe='')+'&designations=priority_review')
          assert combined['total']>0 and combined['total']<=priority['total'],'Stage+designation intersection invalid'
          assert all(r.get('stage')==matched_stage and (r.get('designationMatches') or {}).get('priority_review')
                     for r in combined.get('spreadsheetRows',[])),'Combined selector evidence mismatch'
          assert (combined.get('selectionSummary') or {}).get('selectedCount')==2,'Combined clicked-selector total incorrect'
          print('PASS: exact NCT/therapy/indication-linked FDA designation AND stage filtering')
          print('LIVE_AUDITED_DESIGNATION_MATCHES',priority['total'],'priority_review')
          print('LIVE_AUDITED_STAGE_AND_DESIGNATION',matched_stage,combined['total'])
          print('PASS: signed-in TOOLS stage counts match published POOL NCT records')
          print('VERIFIED_LIVE_TOOLS_TRIALS',len(unique_trials))
          print('VERIFIED_LIVE_TOOLS_STAGE_SAMPLE',stage,'count',stages[stage])
          print('VERIFIED_LIVE_TOOLS_COMBINED_SAMPLE',combined['total'])
          print('NOTE: Only source-linked FDA designations are counted; this is not an FDA approval assessment.')
          PY