name: MAIN R62 real browser scientific source preview checks

# Draft medical development branch only: no production deploy or secret access.
# Real local Chromium at iPhone-sized and desktop viewports, not an authorized
# live application login. No medical ledger, forecast, FOCUS or Track B writes.
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r62-source-browser-responsive.yml
      - new-platform/frontend/scripts/verify-r62-source-browser.cjs
      - new-platform/frontend/app/predictions/FocusOriginalSourceChallengeR60.tsx
      - new-platform/frontend/app/predictions/FocusOriginalSourceChallengeR60.module.css
      - new-platform/frontend/lib/focus-r60-original-trial-research.ts
      - new-platform/frontend/data/focus-r60-original-source-trial-detail.json
      - new-platform/frontend/app/predictions/page.tsx
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: main-r62-source-browser-interaction
  cancel-in-progress: false

jobs:
  verify-local-next-real-browser-mobile-desktop:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm same original FOCUS 29/23 and no retired workflow dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python scripts/audit_raas_retirement.py --check
      - name: Restore independent archived R60 original trial source research
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42709199117
          name: main-r60-original-primary-safety-review-42709199117
          path: ${{ runner.temp }}/r62-source
      - name: Verify every 29-trial source field pinned in display
        shell: bash
        run: |
          set -euo pipefail
          python new-platform/backend/scripts/verify_r61_original_dashboard_snapshot.py \
            --original "$RUNNER_TEMP/r62-source/FOCUS_29_ORIGINAL_PRIMARY_AND_AE_SOURCE_CHALLENGE_R60.json" \
            --frontend new-platform/frontend/data/focus-r60-original-source-trial-detail.json
      - name: Install frontend and Chromium test-only dependency
        working-directory: new-platform/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify source-unit guards, TypeScript, and optimized Next.js build
        working-directory: new-platform/frontend
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/focus-r60-original-source-view.test.cjs
          npm run typecheck
          npm run build
      - name: Test real browser source interactions at desktop and 390px iPhone viewport
        working-directory: new-platform/frontend
        shell: bash
        env:
          RECEIPT_DIR: ${{ runner.temp }}/r62-browser
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          npm run start -- --port 3157 > "$RECEIPT_DIR/next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 5 http://127.0.0.1:3157/predictions -o /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Local Next.js preview never became healthy."
            tail -n 100 "$RECEIPT_DIR/next.log"
            exit 1
          fi
          node scripts/verify-r62-source-browser.cjs
          cat "$RECEIPT_DIR/R62_BROWSER_RESULTS.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive browser receipts and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-r62-local-interaction-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r62-browser/
          retention-days: 30
          if-no-files-found: warn
