name: Master Automation Controller — Manual Checkpoint / Resume
# NO schedule, automatic merges, deployments, or broker orders.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'Plan, start managed run, or resume a failed stage'
        options: [plan, run, resume]
        default: plan
      run_key:
        description: 'Unique operator run key for run'
        type: string
        required: false
        default: ''
      run_id:
        description: 'Existing controller UUID for resume'
        type: string
        required: false
        default: ''
      from_stage:
        type: choice
        description: 'The failed stage, without rerunning predecessors'
        options: [POOL, FOCUS]
        default: FOCUS

permissions:
  contents: read
  actions: write

concurrency:
  group: pdufa-master-manual-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      PDUFA_MASTER_API_BASE_URL: ${{ secrets.PDUFA_MASTER_API_BASE_URL }}
      PDUFA_MASTER_INTERNAL_API_KEY: ${{ secrets.PDUFA_MASTER_INTERNAL_API_KEY }}
      PDUFA_MASTER_ALLOW_EXECUTION: ${{ vars.PDUFA_MASTER_ALLOW_EXECUTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal controller dependencies
        run: python -m pip install "requests>=2.31,<3" "sqlalchemy>=2.0,<3" "fastapi>=0.115,<1" "pytest>=8,<10" "httpx>=0.27,<1"
      - name: Test checkpoint, lease and resume rules
        run: python -m pytest -q new-platform/backend/tests/test_master_automation.py
      - name: Check controller manifest without execution
        if: inputs.mode == 'plan'
        run: python scripts/master_automation_runner.py --mode plan
      - name: Execute an explicitly opted-in, checkpointed run
        if: inputs.mode == 'run'
        env:
          RUN_KEY: ${{ inputs.run_key }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PDUFA_MASTER_ALLOW_EXECUTION" = "1" || { echo "::error::Explicit execution opt-in disabled"; exit 1; }
          test -n "$RUN_KEY" || { echo "::error::Run key is mandatory"; exit 1; }
          python scripts/master_automation_runner.py --mode run --run-key "$RUN_KEY"
      - name: Resume only a recorded failed stage
        if: inputs.mode == 'resume'
        env:
          CONTROLLER_RUN_ID: ${{ inputs.run_id }}
          FROM_STAGE: ${{ inputs.from_stage }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PDUFA_MASTER_ALLOW_EXECUTION" = "1" || { echo "::error::Explicit execution opt-in disabled"; exit 1; }
          test -n "$CONTROLLER_RUN_ID" || { echo "::error::Controller run ID is mandatory"; exit 1; }
          python scripts/master_automation_runner.py --mode resume \
            --run-id "$CONTROLLER_RUN_ID" --from-stage "$FROM_STAGE"
      - name: Report execution status and scope
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          {
            echo "## Master Automation Controller"
            echo "- Mode: $MODE"
            echo "- Execution opt-in: ${PDUFA_MASTER_ALLOW_EXECUTION:-DISABLED}"
            echo "- Managed: POOL → FOCUS"
            echo "- Assessments, predictions, CAL/NEWS and alerts: NOT YET WIRED"
            echo "- ATSMS and backups: independent; not dispatched or paused here"
            echo "- Broker orders, production deployments, automatic merges: DISABLED"
          } >> "$GITHUB_STEP_SUMMARY"
