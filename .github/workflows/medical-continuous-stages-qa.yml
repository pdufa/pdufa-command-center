name: Medical continuous stage runtime QA
on:
  push:
    branches:
      - feature/deep-medical-intelligence-preview-20261107
    paths:
      - 'new-platform/backend/app/medical_continuous.py'
      - 'new-platform/backend/app/main.py'
      - 'new-platform/backend/tests/test_medical_continuous.py'
      - 'new-platform/frontend/app/medical-intelligence-preview/**'
      - 'new-platform/frontend/app/api/medical-intelligence-preview/continuous/**'
      - 'new-platform/frontend/tests/medical-intelligence-*.test.cjs'
      - '.github/workflows/medical-continuous-stages-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend persistent-stage regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r new-platform/backend/requirements.txt
      - name: Test persistent research, retries, stop/resume and fail-closed status
        run: PYTHONPATH=new-platform/backend python -m pytest -q new-platform/backend/tests/test_medical_continuous.py
  frontend:
    name: Frontend status controls and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: new-platform/frontend
      - name: Typecheck Next.js
        run: npm run typecheck
        working-directory: new-platform/frontend
      - name: Test click-to-run controls
        run: node --test tests/medical-intelligence-click-to-run.test.cjs
        working-directory: new-platform/frontend
