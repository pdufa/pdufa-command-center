name: MAIN R63 original 8-domain method reviewer source ladder

# Draft-branch research only. Machine page leads and 232 reviewer slots are
# NOT 232 clinical method grades or 800 completed scientific assessments.
# No production, reviewer-grade ledger, Track B, or retired-scanner writes.
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r63-original-method-review-ladder.yml
      - new-platform/backend/scripts/build_focus_method_reviewer_ladder_r63.py
      - new-platform/backend/tests/test_focus_method_reviewer_ladder_r63.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: main-r63-original-page-linked-reviewer-matrix
  cancel-in-progress: false

jobs:
  build-evidence-only-eight-domain-reviewer-ladder:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact unchanged FOCUS original scope and adversarial method review tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python -m pip install 'pytest>=8,<10' 'PyMuPDF>=1.24,<2'
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_focus_method_reviewer_ladder_r63.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Restore immutable R53-R55 exact original protocol and statistical research
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42696796318
          name: main-r53-original-public-protocol-sap-pdf-42696796318
          path: ${{ runner.temp }}/r63/original
      - name: Restore exact R60 original efficacy and safety source challenge
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42709199117
          name: main-r60-original-primary-safety-review-42709199117
          path: ${{ runner.temp }}/r63/r60
      - name: Assemble read-only 29 trial x 8 domain method reviewer worklist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r63/research"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/build_focus_method_reviewer_ladder_r63.py \
            --r54 "$RUNNER_TEMP/r63/original/FOCUS_23_APPLICATION_METHOD_SOURCE_CROSSWALK_R54.json" \
            --r55 "$RUNNER_TEMP/r63/original/FOCUS_23_APPLICATION_EFFICACY_SAFETY_SOURCE_REVIEW_PACKETS_R55.json" \
            --r60 "$RUNNER_TEMP/r63/r60/FOCUS_29_ORIGINAL_PRIMARY_AND_AE_SOURCE_CHALLENGE_R60.json" \
            --output "$RUNNER_TEMP/r63/research/FOCUS_29_TRIAL_EIGHT_DOMAIN_SOURCE_REVIEW_R63.json" \
            --summary "$RUNNER_TEMP/r63/research/FOCUS_EIGHT_DOMAIN_REVIEW_R63.md"
          python - <<'PY'
          import json,os
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"r63/research"
          r=json.loads((folder/"FOCUS_29_TRIAL_EIGHT_DOMAIN_SOURCE_REVIEW_R63.json").read_bytes())
          assert r["schema"]=="MAIN_R63_EIGHT_DOMAIN_ORIGINAL_METHOD_REVIEW_LADDER"
          assert r["uniqueTrials"]==29 and r["provisionalApplicationGroups"]==23
          assert r["domainTrialReviewSlots"]==232
          assert r["publicOriginalProtocolSapDocuments"]==23
          assert r["trialsWithOriginalAttachedMethodsDocuments"]==12
          assert len(r["trialMethodReviewerQueue"])==29
          assert len(r["applicationMethodReviewerQueue"])==23
          assert all(len(t["machineSourceReviewDimensions"])==8 for t in r["trialMethodReviewerQueue"])
          assert r["independentlySignedScientificAssessments"]==0
          assert r["scientificScoresCalculated"]==0
          assert r["validatedFDAForecasts"]==0
          assert r["independentHistoricalBacktests"]==0
          assert r["measuredPredictionAccuracy"] is None
          assert r["officialFutureFDAOutcome"]=="ABSTAIN"
          assert r["officialReviewDelayPrediction"]=="ABSTAIN"
          assert r["productionOrClinicalLedgerWrites"] is False
          assert r["modelTrainingAuthorized"] is False
          assert r["machinePageLeadsAreNeither800CompletedTestsNorClinicalValidation"] is True
          assert all(d["assessmentLevel"]=="UNASSESSED_SOURCE_ONLY"
              and d["independentScientificJudgment"] is None
              for t in r["trialMethodReviewerQueue"]
              for d in t["machineSourceReviewDimensions"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## R63 original method page-cited reviewer worklist\n\n")
            f.write("29 exact trials and 23 provisional application groups, 8 source-review domains per trial (232 **unscored** slots), 23 original current-protocol/SAP PDF attachments for 12 trials, no scientific reviewer signoffs, no approved/CRL forecast, no calibrated accuracy. Machine page hits do not prove original pre-unblinding plan adherence.\n\n")
            f.write((folder/"FOCUS_EIGHT_DOMAIN_REVIEW_R63.md").read_text())
          PY
      - name: Archive only source-grounded review worklist and summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-r63-eight-domain-source-ladder-${{ github.run_id }}
          path: ${{ runner.temp }}/r63/research/
          retention-days: 90
          if-no-files-found: error
