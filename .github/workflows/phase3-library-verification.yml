name: Phase 3 Trial Library authorized live verification

on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase3_library_browser.cjs'
      - '.github/workflows/phase3-library-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdufa-phase3-live-browser
  cancel-in-progress: false

jobs:
  authorized-phase3-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Require the existing authorized application credential
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "${DASHBOARD_PASSWORD:-}" ]; then
            echo 'INCOMPLETE: missing GitHub Actions secret DASHBOARD_PASSWORD' >> "$GITHUB_STEP_SUMMARY"
            echo 'INCOMPLETE: missing GitHub Actions secret DASHBOARD_PASSWORD' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright in runner temporary storage
        run: |
          npm install --prefix "$RUNNER_TEMP/pdufa-phase3-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pdufa-phase3-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify the deployed Phase 3 library using normal authentication
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          NODE_PATH: ${{ runner.temp }}/pdufa-phase3-browser/node_modules
          PHASE3_RESULT_PATH: ${{ runner.temp }}/phase3-library-browser-result.json
        run: node scripts/phase3_library_browser.cjs

      - name: Verify preserved Benchmark 1 against genuine NCT00116805
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          NODE_PATH: ${{ runner.temp }}/pdufa-phase3-browser/node_modules
          STAGE1_RESULT_PATH: ${{ runner.temp }}/stage1-live-browser-result.json
        run: node scripts/stage1_live_browser.cjs

      - name: Preserve sanitized verification results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-live-browser-sanitized-results
          path: |
            ${{ runner.temp }}/phase3-library-browser-result.json
            ${{ runner.temp }}/stage1-live-browser-result.json
          if-no-files-found: ignore
          retention-days: 14
