name: PDUFA Published Evidence & Source Checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'listing_exclusions.py'
      - 'tests/test_listing_exclusions.py'
      - 'tests/test_phase_pipeline.py'
      - 'data/**'
      - 'gem_reference_frontend/**'
      - '.github/workflows/streamlit-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'listing_exclusions.py'
      - 'tests/test_listing_exclusions.py'
      - 'tests/test_phase_pipeline.py'
      - 'data/**'
      - 'gem_reference_frontend/**'
      - '.github/workflows/streamlit-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# This workflow formerly tested the retired Streamlit dashboard. It can no
# longer use app.py or import streamlit: neither is a shipped application.
# Keep independent source validation, Python syntax and browser JS syntax.
# The current application is tested by .github/workflows/ci.yml and
# .github/workflows/pdufa-nextjs-main-checks.yml.
concurrency:
  group: pdufa-published-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Published-source schema and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check maintained Python source syntax
        run: |
          python -m compileall -q scripts
          python -m compileall -q new-platform/backend/app
      - name: Validate GEM source CSV integrity
        run: python scripts/validate_gem_source_ledgers.py
      - name: Install offline Pipeline validation dependency
        run: python -m pip install requests
      - name: Verify dated issuer listing exclusions cannot qualify retired tickers
        run: |
          python -m unittest discover -s tests -p 'test_listing_exclusions.py' -v
          python -m unittest discover -s tests -p 'test_phase_pipeline.py' -v
      - name: Check maintained research browser scripts
        run: |
          node --check gem_reference_frontend/dashboard.js
          node --check scripts/gem_potential_live_audit.cjs
          node --check scripts/prephase3_live_acceptance.cjs
