name: PDUFA prediction stream regression tests
on:
  push:
    branches: [new-platform-bootstrap]
    paths:
      - 'new-platform/backend/app/prediction_events.py'
      - 'new-platform/backend/tests/test_prediction_events.py'
      - '.github/workflows/pdufa-prediction-events-tests.yml'
  workflow_dispatch:
jobs:
  prediction-events:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile event module
        run: python -m py_compile app/prediction_events.py
      - name: Run isolated event tests
        run: python -m pytest -q tests/test_prediction_events.py
