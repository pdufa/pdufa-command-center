name: SEC First-Ten Financing Audit

on:
  push:
    branches:
      - 'sec-financing-first10-*'
    paths:
      - 'scripts/financing_first10_audit.py'
      - 'tests/test_financing_first10_audit.py'
      - '.github/workflows/first10-financing-audit.yml'
  workflow_dispatch:
    inputs:
      live_sec_check:
        description: 'Request issuer SEC filing text (requires SEC_USER_AGENT secret)'
        type: boolean
        required: true
        default: false

jobs:
  financing-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First-ten audit offline safety tests
        run: python -m unittest discover -s tests -p 'test_financing_first10_audit.py' -v
      - name: Generate baseline first-ten audit (no SEC HTTP)
        run: python scripts/financing_first10_audit.py --output output/first10_financing_audit.csv
      - name: Compliant live SEC evidence check (when configured)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live_sec_check)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Live SEC check requested but SEC_USER_AGENT is not configured. Add repository Actions secret SEC_USER_AGENT."
            exit 1
          fi
          python scripts/financing_first10_audit.py --live --output output/first10_financing_live.csv
      - name: Upload first-ten report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first10-financing-report
          path: output/*.csv
          if-no-files-found: warn
          retention-days: 30
