name: PDUFA Command Center CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run an unattended read-only verification every day, including days with no pushes.
  # GitHub cron is UTC; 15:00 UTC is 07:00 PST / 08:00 PDT.
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The Streamlit app.py was intentionally retired. Do not present an app.py
# FileNotFoundError as validation of the live Next.js / FastAPI deployment.
# Keep historical scripts and evidence intact; independent evidence validation
# remains fail-closed and never qualifies an unsupported trading conclusion.
concurrency:
  group: pdufa-command-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permanent-retirement-policy:
    name: Enforce independent analysis and read-only historical archives
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit permanently retired active dependencies
        run: python scripts/audit_raas_retirement.py --check
      - name: Test permanent retirement guards
        run: python -m unittest discover -s tests -p 'test_raas_retirement_guard.py' -v

  source-integrity:
    name: GEM ledger and exact-event source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source validators
        run: python -m py_compile scripts/validate_gem_source_ledgers.py
      - name: Validate strict GEM evidence ledger
        run: python scripts/validate_gem_source_ledgers.py
      - name: Offline scan email and SMS notification safety regressions
        run: |
          python -m unittest discover -s tests -p 'test_scan_email_notifications.py' -v
          python -m unittest discover -s tests -p 'test_scan_sms_notifications.py' -v
      - name: Source-safe saved score coverage regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_score_input_audit.py tests/test_nightly_scoring_audit.py tests/test_scoring_tab_navigation.py

  level4-protocol-audit:
    name: Level 4 protocol inventory safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Level 4 protocol audit regression tests
        run: python -m unittest discover -s tests -p 'test_level4_protocol_audit.py' -v
      - name: Test original registry field extraction and provenance
        run: |
          python -m unittest discover -s tests -p 'test_level4_registry_extraction.py' -v
          python -m unittest discover -s tests -p 'test_level4_focus_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_twenty_level_expansion.py' -v
          python -m unittest discover -s tests -p 'test_twenty_level_evidence_matrix.py' -v
          python -m unittest discover -s tests -p 'test_twenty_level_assessment_gate.py' -v
          python -m unittest discover -s tests -p 'test_level1_20_owner_policy.py' -v
          python -m unittest discover -s tests -p 'test_deep_clinical_subspecialty.py' -v
          python -m unittest discover -s tests -p 'test_subspecialty_dossier_builder.py' -v
          python -m unittest discover -s tests -p 'test_subspecialty_review_gate.py' -v
          python -m unittest discover -s tests -p 'test_subspecialty_registry_evidence_leads.py' -v
          python -m unittest discover -s tests -p 'test_subspecialty_evidence_gap_report.py' -v
          python -m unittest discover -s tests -p 'test_subspecialty_research_queue.py' -v
          python -m unittest discover -s tests -p 'test_subspecialty_verified_progress.py' -v
          python -m unittest discover -s tests -p 'test_focus_pubmed_discovery.py' -v

  backup-archive-integrity:
    name: Offline ZIP backup integrity regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify backup archive safety and CRC validation
        run: python -m unittest discover -s tests -p 'test_backup_archive_verification.py' -v

  scan-new-results:
    name: Audited new-scan identities and duplicate prevention
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scan collector and archive verification
        run: python -m py_compile scripts/phase3_results_intake.py scripts/nightly_clinical_collection.py scripts/pdufa_scan_audit.py
      - name: Verify exact new study identifiers, immutable scan archive and audit safeguards
        run: python -m unittest discover -s tests -p 'test_new_scan_result_identities.py' -v
      - name: Verify original nightly report compatibility
        run: python -m unittest discover -s tests -p 'test_pdufa_nightly_report.py' -v

  backend:
    name: Current FastAPI application regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current backend test dependencies
        run: python -m pip install -r new-platform/backend/requirements.txt
      - name: Run entire current backend test suite
        run: PYTHONPATH=new-platform/backend pytest -q new-platform/backend/tests

  frontend:
    name: Current Next.js typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install current frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend regression tests
        run: npm test
      - name: Production build
        run: npm run build
