name: PDUFA Command Center CI

on:
  push:
    branches: [main]
    paths:
      - 'new-platform/**'
      - 'scripts/validate_gem_source_ledgers.py'
      - 'scripts/phase3_results_intake.py'
      - 'scripts/nightly_clinical_collection.py'
      - 'scripts/pdufa_scan_audit.py'
      - 'scripts/run_scan_with_email.py'
      - 'scripts/scan_sms.py'
      - 'tests/test_scan_email_notifications.py'
      - 'tests/test_scan_sms_notifications.py'
      - 'score_input_audit.py'
      - 'tests/test_score_input_audit.py'
      - 'tests/test_nightly_scoring_audit.py'
      - 'tests/test_new_scan_result_identities.py'
      - 'data/pdufa_candidates.csv'
      - 'data/second_financing_status.csv'
      - 'scripts/verify_backup_archive.py'
      - 'tests/test_backup_archive_verification.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'new-platform/**'
      - 'scripts/validate_gem_source_ledgers.py'
      - 'scripts/phase3_results_intake.py'
      - 'scripts/nightly_clinical_collection.py'
      - 'scripts/pdufa_scan_audit.py'
      - 'scripts/run_scan_with_email.py'
      - 'scripts/scan_sms.py'
      - 'tests/test_scan_email_notifications.py'
      - 'tests/test_scan_sms_notifications.py'
      - 'score_input_audit.py'
      - 'tests/test_score_input_audit.py'
      - 'tests/test_nightly_scoring_audit.py'
      - 'tests/test_new_scan_result_identities.py'
      - 'data/pdufa_candidates.csv'
      - 'data/second_financing_status.csv'
      - '.github/workflows/ci.yml'
  # Run an unattended read-only verification every day, including days with no pushes.
  # GitHub cron is UTC; 15:00 UTC is 07:00 PST / 08:00 PDT.
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The Streamlit app.py was intentionally retired. Do not present an app.py
# FileNotFoundError as validation of the live Next.js / FastAPI deployment.
# Keep historical scripts and evidence intact; independent evidence validation
# remains fail-closed and never qualifies an unsupported trading conclusion.
concurrency:
  group: pdufa-command-center-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: GEM ledger and exact-event source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source validators
        run: python -m py_compile scripts/validate_gem_source_ledgers.py
      - name: Validate strict GEM evidence ledger
        run: python scripts/validate_gem_source_ledgers.py
      - name: Offline scan email and SMS notification safety regressions
        run: |
          python -m unittest discover -s tests -p 'test_scan_email_notifications.py' -v
          python -m unittest discover -s tests -p 'test_scan_sms_notifications.py' -v
      - name: Source-safe saved score coverage regressions
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_score_input_audit.py tests/test_nightly_scoring_audit.py

  backup-archive-integrity:
    name: Offline ZIP backup integrity regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify backup archive safety and CRC validation
        run: python -m unittest discover -s tests -p 'test_backup_archive_verification.py' -v

  scan-new-results:
    name: Audited new-scan identities and duplicate prevention
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scan collector and archive verification
        run: python -m py_compile scripts/phase3_results_intake.py scripts/nightly_clinical_collection.py scripts/pdufa_scan_audit.py
      - name: Verify exact new study identifiers, immutable scan archive and audit safeguards
        run: python -m unittest discover -s tests -p 'test_new_scan_result_identities.py' -v
      - name: Verify original nightly report compatibility
        run: python -m unittest discover -s tests -p 'test_pdufa_nightly_report.py' -v

  backend:
    name: Current FastAPI application regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current backend test dependencies
        run: python -m pip install -r new-platform/backend/requirements.txt 'cryptography>=43,<49'
      - name: Run entire current backend test suite
        run: PYTHONPATH=new-platform/backend pytest -q new-platform/backend/tests

  frontend:
    name: Current Next.js typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install current frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend regression tests
        run: npm test
      - name: Production build
        run: npm run build
