name: KEYNOTE-522 protocol acquisition (research only)

on:
  workflow_dispatch:
  push:
    branches:
      - plan/isolated-levels-7-20-20261116
    paths:
      - .github/workflows/keynote522-protocol-acquisition.yml

permissions:
  contents: read

jobs:
  acquire-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public registry protocol/SAP
        env:
          PYTHONPATH: new-platform/backend
        run: |
          python -m assessment_levels_07_20.discovery_download \
            --url 'https://cdn.clinicaltrials.gov/large-docs/88/NCT03036488/Prot_SAP_000.pdf' \
            --output research-output/keynote522-protocol-sap.pdf
      - name: Verify PDF bytes and provenance without historical eligibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p = Path('research-output/keynote522-protocol-sap.pdf')
          raw = p.read_bytes()
          meta = json.loads(Path(str(p) + '.json').read_text())
          if not raw.startswith(b'%PDF-') or len(raw) < 10000:
              raise SystemExit('Downloaded document is not a substantive PDF')
          if hashlib.sha256(raw).hexdigest() != meta['sha256'] or len(raw) != meta['byte_count']:
              raise SystemExit('PDF digest or byte count mismatch')
          report = {
              'source': meta['source_url'],
              'sha256': meta['sha256'],
              'byte_count': len(raw),
              'retrieved_at': meta['retrieved_at'],
              'status': 'DISCOVERY_ONLY',
              'historical_snapshot_verified': False,
              'blind_eligible': False,
              'protocol_revision_date_verified': False,
              'requires_manual_pdf_version_review': True,
          }
          Path('research-output/protocol-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload protocol bytes and checks
        uses: actions/upload-artifact@v4
        with:
          name: keynote522-protocol-discovery
          path: research-output/
          if-no-files-found: error
          retention-days: 14
