name: GEM Full Financing Block Research Audit

# Nightly financing-stage research must finish after the GEM source scan;
# no independent cron or data-push audit may overlap the serial chain.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gem-financing-full-coverage
  cancel-in-progress: false

jobs:
  bulk-evidence-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject shifted CSV columns and false benchmark eligibility
        run: python scripts/validate_gem_source_ledgers.py
      - name: Audit EVERY saved financing-stage exact program
        run: python scripts/gem_financing_batch_export.py --output-dir reports/gem_financing_batch
      - name: Run official ClinicalTrials.gov Phase 3 exact-NCT recheck
        continue-on-error: true
        run: |
          python scripts/gem_phase3_exact_recheck.py \
            --data-dir data \
            --output reports/gem_financing_batch/live_phase3_registry_recheck.csv \
            --summary reports/gem_financing_batch/live_phase3_registry_summary.json
      - name: Run official SEC recheck of documented second-close claims
        continue-on-error: true
        run: |
          python scripts/gem_two_close_recheck.py \
            --data-dir data \
            --output reports/gem_financing_batch/live_sec_two_close_recheck.csv \
            --summary reports/gem_financing_batch/live_sec_two_close_summary.json
      - name: Upload complete review and independent primary-source audit attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-full-financing-block-review
          path: reports/gem_financing_batch/
          if-no-files-found: error
          retention-days: 30
