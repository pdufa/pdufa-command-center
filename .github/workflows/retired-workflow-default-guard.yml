name: Default Branch Retired Workflow Guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permanent-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce permanently retired workflow and Codex constraints
        run: python scripts/check_retired_workflows.py
      - name: Enforce P3 spreadsheet retirement while preserving FOCUS
        run: python scripts/check_retired_p3_spreadsheets.py
