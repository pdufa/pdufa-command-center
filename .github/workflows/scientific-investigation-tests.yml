name: Scientific investigation contract tests
on:
  push:
    branches:
      - feature/scientific-assessment-v1
    paths:
      - 'new-platform/backend/app/scientific_investigation_contract.py'
      - 'new-platform/backend/tests/test_scientific_investigation_contract.py'
      - '.github/workflows/scientific-investigation-tests.yml'
  workflow_dispatch:

jobs:
  scientific-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify eight-layer contract
        working-directory: new-platform/backend
        run: python -m pytest -q tests/test_scientific_investigation_contract.py
