name: MAIN R44 original FOCUS registry safety source extraction
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-focus-registry-safety-evidence-r44.yml
      - new-platform/backend/scripts/build_focus_registry_safety_r44.py
      - new-platform/backend/tests/test_focus_registry_safety_r44.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-r44-registry-safety-research
  cancel-in-progress: false

jobs:
  exact-nct-posted-safety-research:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact pinned 29-NCT and 23-application source manifests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
      - name: Test safety-group identity, exact NCT provenance, no invented clinical grades
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_focus_registry_safety_r44.py tests/test_focus_registry_results_r42.py tests/test_hop_blinded_phase3_backtest.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Retrieve original registry bytes and arm-specific serious/nonserious event tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r44-safety/original"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/build_focus_registry_safety_r44.py \
            --output "$RUNNER_TEMP/r44-safety/reviewer_safety_r44.json" \
            --raw-dir "$RUNNER_TEMP/r44-safety/original"
      - name: Verify complete original source receipt and hold clinical prediction gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"r44-safety"
          raw=(d/"reviewer_safety_r44.json").read_bytes()
          r=json.loads(raw)
          assert r["schema"]=="MAIN_R44_EXACT_NCT_POSTED_SAFETY_SOURCE_V1"
          assert r["nctCount"]==29 and r["provisionalApplicationCount"]==23
          assert len(r["records"])==29 and len({x["nct"] for x in r["records"]})==29
          assert r["independentClinicalGrades"]==0
          assert r["validatedApplicationPredictions"]==0
          assert r["realHistoricalBacktests"]==0
          assert r["calibratedAccuracy"] is None
          assert r["numericalFdaProbability"] is None
          assert r["officialFutureFdaOutcomeForecast"]=="ABSTAIN"
          assert r["officialFutureDelayForecast"]=="ABSTAIN"
          assert r["trainingAuthorized"] is False
          assert r["productionOrScientificLedgerWrites"] is False
          for x in r["records"]:
            if x.get("sourceResponseSha256"):
              path=d/"original"/(x["nct"]+".json")
              assert hashlib.sha256(path.read_bytes()).hexdigest()==x["sourceResponseSha256"]
          items=[
           "# MAIN R44 FOCUS current original safety registry capture",
           f'FOCUS registry fetched: {r["registryFetched"]}/29',
           f'Current registry results sections: {r["trialsWithRegistryResultsSection"]}/29',
           f'Original registry adverse event modules: {r["trialsWithPostedAeModule"]}/29',
           f'Serious event term rows: {r["seriousEventTermRows"]}',
           f'Other event term rows: {r["otherEventTermRows"]}',
           f'Original event arm/group rows: {r["eventGroupRows"]}',
           f'Receipt sha256: {hashlib.sha256(raw).hexdigest()}',
           "Independent signed scientific scores: 0",
           "Validated FDA forecasts and real historical backtests: 0",
           "No arm pooling, causal claims, FDA outcome prediction or production change."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("\n\n".join(items)+"\n")
          print("\n".join(items))
          PY
      - name: Preserve byte-exact registry records and ungraded safety rows for reviewers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-r44-safety-original-source-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/r44-safety/
          retention-days: 90
          if-no-files-found: error
