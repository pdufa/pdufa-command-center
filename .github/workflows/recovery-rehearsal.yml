name: Isolated Source Recovery Rehearsal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recovery-rehearsal.yml'
      - 'new-platform/frontend/**'
      - 'new-platform/backend/**'

permissions:
  contents: read

jobs:
  recovered-frontend:
    name: Rebuild frontend from a clean source archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Create and safely extract source archive
        run: |
          mkdir -p "$RUNNER_TEMP/recovered"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/recovered"
          test -f "$RUNNER_TEMP/recovered/new-platform/frontend/package-lock.json"
      - name: Install exact locked dependencies
        working-directory: ${{ runner.temp }}/recovered/new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck recovered frontend
        working-directory: ${{ runner.temp }}/recovered/new-platform/frontend
        run: npm run typecheck
      - name: Test recovered frontend
        working-directory: ${{ runner.temp }}/recovered/new-platform/frontend
        run: npm test
      - name: Build recovered frontend
        working-directory: ${{ runner.temp }}/recovered/new-platform/frontend
        run: npm run build

  recovered-backend:
    name: Test backend from a clean source archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and safely extract source archive
        run: |
          mkdir -p "$RUNNER_TEMP/recovered"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/recovered"
          test -f "$RUNNER_TEMP/recovered/new-platform/backend/requirements.txt"
      - name: Install backend dependencies
        working-directory: ${{ runner.temp }}/recovered/new-platform/backend
        run: python -m pip install -r requirements.txt pytest 'cryptography>=43,<49'
      - name: Run recovered backend regression suite
        working-directory: ${{ runner.temp }}/recovered/new-platform/backend
        run: PYTHONPATH=. python -m pytest -q tests
