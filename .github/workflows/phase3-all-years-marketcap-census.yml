name: All-years Phase 3 market-cap census
on:
  push:
    paths:
      - 'scripts/phase3_all_years_marketcap_census.py'
      - '.github/workflows/phase3-all-years-marketcap-census.yml'
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC = Sunday 10 PM PST / 11 PM PDT.
    - cron: '0 6 * * 1'
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan all Phase 3 industry trials and match public market caps
        run: python scripts/phase3_all_years_marketcap_census.py
      # Publishing the census is independent of the downstream results scan:
      # an API issue cannot silently discard a completed $300M–$10B census.
      - name: Publish completed all-years Phase 3 market-cap census
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/phase3_all_years_300m_10b_trials.csv data/phase3_all_years_300m_10b_status.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Publish all-years Phase 3 market-cap census"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - name: Refresh results posting classifications against published census
        run: |
          set -euo pipefail
          python scripts/refresh_phase3_registry_postings.py
      - name: Publish reconciled TOOLS Phase 3 posting tables
        run: |
          set -euo pipefail
          git add -- new-platform/frontend/public/phase3-registry-postings-current.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Phase 3 TOOLS registry posting spreadsheets after census"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
