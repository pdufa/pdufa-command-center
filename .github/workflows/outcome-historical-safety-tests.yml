name: OUTCOME historical safety tests

on:
  pull_request:
    paths:
      - 'new-platform/backend/app/hop_backtest.py'
      - 'new-platform/backend/app/hop_outcome_cohort.py'
      - 'new-platform/backend/app/hop_outcomes_import.py'
      - 'new-platform/backend/tests/test_hop_backtest*.py'
      - 'new-platform/backend/tests/test_hop_outcome_cohort.py'
      - 'new-platform/backend/tests/test_hop_outcomes_import.py'
      - 'new-platform/backend/tests/test_hop_fda_identity_review_queue.py'
      - 'new-platform/backend/tests/test_hop_fda_application_crosswalk.py'
      - 'new-platform/backend/app/hop_fda_identity_review_queue.py'
      - 'new-platform/backend/app/hop_fda_application_crosswalk.py'
      - 'new-platform/backend/app/hop_fda_review_cycle_triage.py'
      - 'new-platform/backend/tests/test_hop_fda_review_cycle_triage.py'
      - 'new-platform/backend/tests/test_hop_fda_pdf_date_review_examples.py'
      - 'new-platform/backend/app/research_sources/hop_fda_pdf_date_review_examples.json'
      - 'outcome_fda_action_events.py'
      - 'test_outcome_fda_action_events.py'
      - 'outcome_fda_research_action_fixtures.py'
      - 'test_outcome_fda_research_action_fixtures.py'
      - 'outcome_fda_research_export.py'
      - 'test_outcome_fda_research_export.py'
      - 'outcome_fda_review_timeline_evidence.py'
      - 'test_outcome_fda_review_timeline_evidence.py'
      - 'outcome_fda_review_timeline_export.py'
      - 'test_outcome_fda_review_timeline_export.py'
      - 'outcome_fda_receipt_boundary_gap_report.py'
      - 'test_outcome_fda_receipt_boundary_gap_report.py'
      - 'outcome_fda_receipt_asof_audit.py'
      - 'test_outcome_fda_receipt_asof_audit.py'
      - '.github/workflows/outcome-historical-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/backend/app/hop_backtest.py'
      - 'new-platform/backend/app/hop_outcome_cohort.py'
      - 'new-platform/backend/app/hop_outcomes_import.py'
      - 'new-platform/backend/tests/test_hop_backtest*.py'
      - 'new-platform/backend/tests/test_hop_outcome_cohort.py'
      - 'new-platform/backend/tests/test_hop_outcomes_import.py'
      - 'new-platform/backend/tests/test_hop_fda_identity_review_queue.py'
      - 'new-platform/backend/tests/test_hop_fda_application_crosswalk.py'
      - 'new-platform/backend/app/hop_fda_identity_review_queue.py'
      - 'new-platform/backend/app/hop_fda_application_crosswalk.py'
      - 'new-platform/backend/app/hop_fda_review_cycle_triage.py'
      - 'new-platform/backend/tests/test_hop_fda_review_cycle_triage.py'
      - 'new-platform/backend/tests/test_hop_fda_pdf_date_review_examples.py'
      - 'new-platform/backend/app/research_sources/hop_fda_pdf_date_review_examples.json'
      - 'outcome_fda_action_events.py'
      - 'test_outcome_fda_action_events.py'
      - 'outcome_fda_research_action_fixtures.py'
      - 'test_outcome_fda_research_action_fixtures.py'
      - 'outcome_fda_research_export.py'
      - 'test_outcome_fda_research_export.py'
      - 'outcome_fda_review_timeline_evidence.py'
      - 'test_outcome_fda_review_timeline_evidence.py'
      - 'outcome_fda_review_timeline_export.py'
      - 'test_outcome_fda_review_timeline_export.py'
      - 'outcome_fda_receipt_boundary_gap_report.py'
      - 'test_outcome_fda_receipt_boundary_gap_report.py'
      - 'outcome_fda_receipt_asof_audit.py'
      - 'test_outcome_fda_receipt_asof_audit.py'
      - '.github/workflows/outcome-historical-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-outcome-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run historical outcome and backtest safety tests
        working-directory: new-platform/backend
        run: |
          python -m pytest -q \
            tests/test_hop_backtest.py \
            tests/test_hop_backtest_cohort_safety.py \
            tests/test_hop_backtest_duplicates.py \
            tests/test_hop_outcome_cohort.py \
            tests/test_hop_outcomes_import.py \
            tests/test_hop_fda_application_crosswalk.py \
            tests/test_hop_fda_identity_review_queue.py \
            tests/test_hop_fda_review_cycle_triage.py \
            tests/test_hop_fda_pdf_date_review_examples.py
      - name: Test FDA action-event normalization and fail-closed gate
        run: python -m pytest -q test_outcome_fda_action_events.py test_outcome_fda_research_action_fixtures.py test_outcome_fda_research_export.py test_outcome_fda_review_timeline_evidence.py test_outcome_fda_review_timeline_export.py test_outcome_fda_receipt_boundary_gap_report.py test_outcome_fda_receipt_asof_audit.py
      - name: Confirm published audit has no model clearance
        working-directory: new-platform/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('app/research_sources')
          files = (
              'hop_fda_full_action_pdf_audit_index.json',
              'hop_fda_shared_pdf_reconciliation_index.json',
              'hop_fda_pdf_document_verification_index.json',
          )
          for filename in files:
              audit = json.loads((base / filename).read_text())
              assert audit['model_eligible_records'] == 0, filename
              assert audit['prediction_probability'] is None, filename
              assert audit['complete_application_denominator_verified'] is False, filename
          print('Outcome audit records remain research-only')
          PY
