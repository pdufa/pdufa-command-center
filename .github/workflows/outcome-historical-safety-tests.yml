permissions:
  contents: read

jobs:
  historical-outcome-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run historical outcome and backtest safety tests
        working-directory: new-platform/backend
        run: |
          python -m pytest -q \
            tests/test_hop_backtest.py \
            tests/test_hop_backtest_cohort_safety.py \
            tests/test_hop_backtest_duplicates.py \
            tests/test_hop_outcome_cohort.py \
            tests/test_hop_outcomes_import.py \
            tests/test_hop_point_in_time_labels.py \
            tests/test_hop_history_ingest.py \
            tests/test_hop_comparators.py \
            tests/test_hop_fda_staging.py \
            tests/test_hop_cohort_manifest.py \
            tests/test_hop_cohort_roster.py \
            tests/test_hop_cohort_audit_cli.py \
            tests/test_hop_fda_application_crosswalk.py \
            tests/test_hop_fda_identity_review_queue.py \
            tests/test_hop_fda_review_cycle_triage.py \
            tests/test_hop_fda_pdf_date_review_examples.py \
            tests/test_hop_primary_action_letter_samples.py \
            tests/test_hop_fda_pdf_byte_audit.py \
            tests/test_hop_fda_public_disclosure_clock.py
      - name: Test FDA action-event normalization and fail-closed gate
        run: python -m pytest -q test_outcome_fda_action_events.py test_outcome_fda_research_action_fixtures.py test_outcome_fda_research_export.py test_outcome_fda_review_timeline_evidence.py test_outcome_fda_review_timeline_export.py test_outcome_fda_receipt_boundary_gap_report.py test_outcome_fda_receipt_asof_audit.py test_outcome_fda_research_feature_projection.py test_outcome_fda_dual_readiness_grades.py test_outcome_fda_readiness_panel.py test_outcome_fda_readiness_streamlit.py test_outcome_receipt_readiness_regression.py test_outcome_fda_cycle_evidence_certification.py test_outcome_fda_receipt_certification_workqueue.py
      - name: Validate machine-readable OUTCOME readiness payload
        run: |
          python outcome_fda_readiness_panel.py > /tmp/outcome_readiness_panel.json
          python outcome_fda_dual_readiness_grades.py > /tmp/outcome_readiness_grades.json
          python - <<'PY'
          import json
          from pathlib import Path
          panel = json.loads(Path('/tmp/outcome_readiness_panel.json').read_text())
          grades = json.loads(Path('/tmp/outcome_readiness_grades.json').read_text())
          assert panel['display_role'] == 'research_status_only'
          assert panel['primary']['prediction_ready'] is False
          assert panel['primary']['prediction_probability'] is None
          assert panel['primary']['documented_timeline_numerator'] == 17
          assert panel['primary']['selected_action_denominator'] == 20
          assert panel['secondary']['initially_collapsed'] is True
          assert panel['secondary']['blocking_condition_count'] == 5
          assert grades['blocking_gate_manifest']['all_prediction_gates_passed'] is False
          assert grades['prediction_grade']['model_eligible_records'] == 0
          print('Readiness JSON contract validated; no model authorization')
          PY
      - name: Confirm published audit has no model clearance
        working-directory: new-platform/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('app/research_sources')
          files = (
              'hop_fda_full_action_pdf_audit_index.json',
              'hop_fda_shared_pdf_reconciliation_index.json',
              'hop_fda_pdf_document_verification_index.json',
          )
          for filename in files:
              audit = json.loads((base / filename).read_text())
              assert audit['model_eligible_records'] == 0, filename
              assert audit['prediction_probability'] is None, filename
              assert audit['complete_application_denominator_verified'] is False, filename
          print('Outcome audit records remain research-only')
          PY
