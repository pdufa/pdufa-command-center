name: MAIN ACACIA original-source gaps — read-only

# Draft-branch research acquisition. No production cron, no application
# deployment, no clinical reviewer permissions, no scored-method writes.
on:
  push:
    branches:
      - feature/medical-stage4-verified-method-matrix-20261108
    paths:
      - scripts/medical/acacia_public_source_gap_reconciliation.py
      - tests/test_acacia_public_source_gap_reconciliation.py
      - .github/workflows/main-acacia-source-gap-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-acacia-original-source-gap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-public-source-receipts:
    if: ${{ github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact read-only research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python standard library only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate exact NCT and absence of medical write privileges
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/medical-stage4-verified-method-matrix-20261108"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/medical/acacia_public_source_gap_reconciliation.py
          python3 -m unittest discover -s tests -p test_acacia_public_source_gap_reconciliation.py -v
          echo "No production deploy, no clinical database or reviewer credentials."
      - name: Capture original public registry, sponsor safety and journal supplement access
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 scripts/medical/acacia_public_source_gap_reconciliation.py \
            --output acacia-public-gap-audit/receipt.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads(Path("acacia-public-gap-audit/receipt.json").read_text())
          assert v["nct"]=="NCT06081894"
          assert v["independentClinicalGradesWritten"]==0
          assert v["finalLockedSapAuthenticated"] is False
          assert v["hfSeriousEvent11vs1Versus12vs3Reconciled"] is False
          assert v["fdaPrediction"]=="ABSTAIN"
          lines=[
            "## ACACIA original source-gap audit — public research only",
            "Exact NCT: "+v["nct"],
            "Registry: "+v["registry"]["identity"],
            "SAP listing: "+v["registry"]["sapDocumentListed"]+" (not final SAP verification)",
            "Sponsor safety: "+v["sponsor"]["hfBreakdown"]+" (not independent event adjudication)",
            "Source access: "+", ".join(x["sourceId"]+"="+x["status"] for x in v["sources"]),
            "Original HF SAE disagreement 11/1 versus 12/3: UNRESOLVED",
            "Authorized clinical grades: 0; FDA prediction: ABSTAIN",
            "SHA-256 research receipt: "+v["receiptSha256"]
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("\n\n".join(lines)+"\n")
          PY
      - name: Retain small provenance receipt (no source PDFs or full HTML)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acacia-original-source-gap-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: acacia-public-gap-audit/receipt.json
          retention-days: 90
          if-no-files-found: warn
