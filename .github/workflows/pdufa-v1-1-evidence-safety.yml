name: PDUFA v1.1 research evidence safety tests

on:
  pull_request:
    paths:
      - 'research/prediction_v1_1_*.py'
      - 'research/evidence/prediction_v1_1_field_catalog_draft.json'
      - 'tests/test_prediction_v1_1_*.py'
      - 'new-platform/backend/app/science_40_question_catalog.json'
      - '.github/workflows/pdufa-v1-1-evidence-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical 40-assessment mappings
        run: python research/prediction_v1_1_catalog_validator.py
      - name: Test evidence intake, audit integrity, and reviewer security
        run: python -m unittest discover -s tests -p 'test_prediction_v1_1_*.py' -v
