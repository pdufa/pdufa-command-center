name: Publish Apple PDUFA FOCUS Calendar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ios-pdufa-calendar.yml'
      - 'scripts/publish_ios_pdufa_calendar.py'
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["PDUFA Overnight Sequential Scans"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-apple-pdufa-focus-calendar
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Sheets read-only dependency
        run: python -m pip install google-auth requests
      - name: Refresh only dated $300M-$10B FOCUS events
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/publish_ios_pdufa_calendar.py
      - name: Publish changes without mutating FOCUS
        run: |
          set -eu
          if git diff --quiet -- data/ios_focus_pdufa_calendar.json; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ios_focus_pdufa_calendar.json
          git commit -m "Refresh Apple Calendar FOCUS FDA dates"
          git pull --rebase origin main
          git push origin HEAD:main
