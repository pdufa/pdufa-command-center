name: P3 Full POOL Discovery Tests
on:
  pull_request:
    paths:
      - 'scripts/p3_pool_full_discovery.py'
      - 'tests/test_p3_pool_full_discovery.py'
      - '.github/workflows/p3-full-pool-discovery.yml'
      - '.github/workflows/p3-full-pool-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/p3_pool_full_discovery.py'
      - 'tests/test_p3_pool_full_discovery.py'
      - '.github/workflows/p3-full-pool-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests
      - run: python -m unittest discover -s tests -p 'test_p3_pool_full_discovery.py' -v
