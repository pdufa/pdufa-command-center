name: Phase 3 results cumulative intake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-results-intake.yml'
      - 'scripts/phase3_results_intake.py'
      - 'scripts/phase3_drug_identity.py'
  schedule:
    # Before 5 AM Pacific in both daylight and standard time.
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'backfill or daily'
        required: false
        default: 'backfill'

permissions:
  contents: write

concurrency:
  group: phase3-results-intake
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run cumulative Phase 3 result intake
        id: intake
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ -f data/phase3_intake_status.json ]; then
              MODE=daily
            else
              MODE=backfill
            fi
          fi
          echo "Mode: $MODE"
          python scripts/phase3_results_intake.py --mode "$MODE" --max-pages 200
      - name: Reconcile candidate drug identities
        run: python scripts/phase3_drug_identity.py
      - name: Commit accumulated evidence and coverage report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase3_announcements.csv data/phase3_intake_status.json data/phase3_drug_identity_review.csv data/phase3_drug_identity_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cumulative Phase 3 results evidence"
            # Other scanners may advance main while the intake is collecting.
            # Rebase our evidence commit and retry without force-pushing or
            # replacing another scanner's data. Conflicts fail visibly.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Saved Phase 3 evidence on attempt $attempt"
                exit 0
              fi
              echo "Concurrent update prevented push (attempt $attempt/5)." >&2
              sleep $((attempt * 3))
            done
            echo "Could not save Phase 3 evidence after five safe retries." >&2
            exit 1
          fi
