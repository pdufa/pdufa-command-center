name: Phase 2 Primary P Evidence Intake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase2-pvalues-intake.yml"
  schedule:
    - cron: "0 6 * * 0"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: phase2-primary-p-evidence-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install intake test dependencies
        run: pip install pandas
      - name: Intake dated Phase 2 primary p-value evidence
        run: python scripts/phase2_pvalues_intake.py
      - name: Validate intake and boundary tests
        run: python -m unittest discover -s tests -p "test_phase2_p_pre_readout.py"
      - name: Save Phase 2 p evidence safely
        run: |
          git config user.name "pdufa-research-bot"
          git config user.email "pdufa-research-bot@users.noreply.github.com"
          git add data/phase2_primary_pvalues.csv data/phase2_pvalues_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update linked Phase 2 primary p-value evidence"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((3 * attempt))
            done
            exit 1
          fi
