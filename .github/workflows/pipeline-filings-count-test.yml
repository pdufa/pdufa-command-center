name: Pipeline and filings count reconciliation

on:
  push:
    paths:
      - 'pipeline_filings_alignment.py'
      - 'pipeline_display.py'
      - 'pipeline_universe.py'
      - 'filings_base_amendments_ui.py'
      - 'tests/test_pipeline_filings_alignment.py'
      - '.github/workflows/pipeline-filings-count-test.yml'
  pull_request:
    paths:
      - 'pipeline_filings_alignment.py'
      - 'pipeline_display.py'
      - 'pipeline_universe.py'
      - 'filings_base_amendments_ui.py'
      - 'tests/test_pipeline_filings_alignment.py'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install 'pandas>=2.0'
      - name: Verify exact Pipeline count and event joins
        run: python -m unittest discover -s tests -p 'test_pipeline_filings_alignment.py' -v
