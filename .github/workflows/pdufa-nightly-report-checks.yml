name: PDUFA Nightly Report Checks

on:
  push:
    branches: [main]
    paths:
      - app.py
      - nightly_scan_dashboard.py
      - scripts/pdufa_scan_audit.py
      - tests/test_pdufa_nightly_report.py
      - '.github/workflows/pdufa-nightly-report-checks.yml'
      - '.github/workflows/pdufa-nightly-clinical.yml'
      - '.github/workflows/pdufa-nightly-report.yml'
      - '.github/workflows/pdufa-scan-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m compileall -q app.py nightly_scan_dashboard.py scripts/pdufa_scan_audit.py
      - name: Verify nightly scan audit invariants
        run: python -m unittest discover -s tests -p 'test_pdufa_nightly_report.py' -v
