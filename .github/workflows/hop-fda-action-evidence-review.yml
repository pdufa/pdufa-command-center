name: HOP FDA published-action date review (research only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hop-fda-action-evidence-review.yml'
      - 'new-platform/backend/scripts/collect_hop_fda_action_review.py'
      - 'new-platform/backend/app/hop_fda_action_review.py'
      - 'new-platform/backend/app/hop_fda_document_probe.py'
      - 'new-platform/backend/app/hop_fda_pdf_evidence_groups.py'
      - 'new-platform/backend/app/hop_fda_pdf_page_candidates.py'
      - 'new-platform/backend/app/hop_fda_page_review_worksheet.py'

permissions:
  contents: read

jobs:
  action-evidence-worklist:
    name: Check FDA publication types and source PDFs without model labels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest 'pypdf>=4,<7'
      - name: Validate FDA source action and PDF safeguards
        working-directory: new-platform/backend
        run: PYTHONPATH=. python -m pytest -q tests/test_hop_fda_action_review.py tests/test_hop_fda_document_probe.py tests/test_hop_fda_pdf_evidence_groups.py tests/test_hop_fda_pdf_page_candidates.py tests/test_hop_fda_page_review_worksheet.py
      - name: Collect FDA source evidence and index candidate pages across shared PDFs
        working-directory: new-platform/backend
        run: PYTHONPATH=. python scripts/collect_hop_fda_action_review.py --output-dir "${{ runner.temp }}/hop-fda-action-review" --pdf-batch-size 20
      - name: Retain research-only FDA action evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: hop-fda-published-actions-evidence-review
          path: ${{ runner.temp }}/hop-fda-action-review/
          if-no-files-found: error
          retention-days: 30
