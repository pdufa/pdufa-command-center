name: Scientific Cohort Coverage Safety

on:
  pull_request:
    branches:
      - integration/scientific-assessment-validation-20261025
      - main
    paths:
      - "new-platform/frontend/lib/scientific-cohort-coverage.ts"
      - "new-platform/frontend/lib/scientific-installation-gates.ts"
      - "new-platform/frontend/tests/scientific-installation-gates.test.cjs"
      - "new-platform/frontend/app/api/scientific-cohort/coverage/route.ts"
      - "new-platform/frontend/app/science/coverage/page.tsx"
      - "new-platform/frontend/tests/scientific-cohort-coverage*.test.cjs"
      - "new-platform/frontend/tests/scientific-coverage-live-connection.test.cjs"
      - ".github/workflows/scientific-cohort-coverage-safety.yml"
  push:
    branches:
      - integration/scientific-assessment-validation-20261025
    paths:
      - "new-platform/frontend/lib/scientific-cohort-coverage.ts"
      - "new-platform/frontend/lib/scientific-installation-gates.ts"
      - "new-platform/frontend/tests/scientific-installation-gates.test.cjs"
      - "new-platform/frontend/app/api/scientific-cohort/coverage/route.ts"
      - "new-platform/frontend/app/science/coverage/page.tsx"
      - "new-platform/frontend/tests/scientific-cohort-coverage*.test.cjs"
      - "new-platform/frontend/tests/scientific-coverage-live-connection.test.cjs"
      - ".github/workflows/scientific-cohort-coverage-safety.yml"

permissions:
  contents: read

jobs:
  published-source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - run: npm ci
      - name: Verify current source health, exact-NCT membership and session-only reads
        run: node --test tests/scientific-cohort-coverage.test.cjs tests/scientific-cohort-coverage-route.test.cjs tests/scientific-coverage-live-connection.test.cjs tests/scientific-installation-gates.test.cjs
      - name: Validate frontend types
        run: npx tsc --noEmit
