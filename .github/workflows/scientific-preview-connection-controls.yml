name: Scientific Preview Connection Safety

on:
  pull_request:
    branches:
      - main
      - integration/scientific-assessment-validation-20261025
    paths:
      - "new-platform/frontend/app/ScientificAssessment.tsx"
      - "new-platform/frontend/app/api/scientific-assessment/connection/route.ts"
      - "new-platform/frontend/tests/scientific-connection-check.test.cjs"
      - "new-platform/frontend/tests/scientific-connection-route-handler.test.cjs"
      - ".github/workflows/scientific-preview-connection-controls.yml"
  push:
    branches:
      - integration/scientific-assessment-validation-20261025
    paths:
      - "new-platform/frontend/app/ScientificAssessment.tsx"
      - "new-platform/frontend/app/api/scientific-assessment/connection/route.ts"
      - "new-platform/frontend/tests/scientific-connection-check.test.cjs"
      - "new-platform/frontend/tests/scientific-connection-route-handler.test.cjs"
      - ".github/workflows/scientific-preview-connection-controls.yml"

permissions:
  contents: read

jobs:
  frontend-scientific-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - run: npm ci
      - name: Validate scientific connection and identity protection
        run: node --test tests/scientific-connection-check.test.cjs tests/scientific-connection-route-handler.test.cjs
      - name: Typecheck frontend
        run: npx tsc --noEmit
