name: Supported dashboard and historical research contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'test_outcome*.py'
      - 'smoke_test.py'
      - 'pipeline_display.py'
      - 'requirements*.txt'
      - 'scripts/audit_scan_schedule.py'
      - 'scripts/build_phase3_census_sources.py'
      - 'data/snapshots/phase3-census-2026-10-26/**'
      - 'new-platform/frontend/**'
      - 'new-platform/backend/**'
      - '.github/workflows/supported-dashboard-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install locked supported frontend runtime
        working-directory: new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Install verification dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run all maintained Python, backend and supported-app contracts
        run: python -m pytest -q
      - name: Reproduce the immutable historical census
        run: python scripts/build_phase3_census_sources.py --check
      - name: Report clock metadata drift without modifying schedules
        run: |
          set +e
          python scripts/audit_scan_schedule.py > scan-schedule-audit.json
          audit_status=$?
          set -e
          cat scan-schedule-audit.json
          if [ "$audit_status" -eq 2 ]; then
            echo '::warning::Saved scan metadata differs from the verified runtime clock. No schedule was changed.'
          elif [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
