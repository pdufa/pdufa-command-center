name: MAIN ACACIA alternate public-source research — read-only
on:
  push:
    branches:
      - feature/medical-stage4-verified-method-matrix-20261108
    paths:
      - scripts/medical/acacia_alternative_public_evidence.py
      - tests/test_acacia_alternative_public_evidence.py
      - .github/workflows/main-acacia-alternate-public-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-acacia-alternative-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-check:
    if: ${{ github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out exact source with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python 3.12 stdlib
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prove read-only source and classification behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/medical/acacia_alternative_public_evidence.py
          python3 -m unittest discover -s tests -p test_acacia_alternative_public_evidence.py -v
      - name: Attempt authorized original publisher and Europe PMC public retrieval
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 scripts/medical/acacia_alternative_public_evidence.py \
            --output acacia-alternate-source-audit/receipt.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("acacia-alternate-source-audit/receipt.json").read_text())
          assert r["nct"]=="NCT06081894"
          assert r["signedClinicalGrades"]==0
          assert r["finalLockedPrimarySapAuthenticated"] is False
          assert r["hfSafety11vs1Vs12vs3Reconciled"] is False
          assert r["fdaPrediction"]=="ABSTAIN"
          summary=["## ACACIA alternative public source research — 0 clinical writes",
            "Sources: "+", ".join(x["sourceId"]+"="+x["retrieval"] for x in r["sources"]),
            "Article supplement listing: "+r["publisherSupplementListings"].get("sourceIdentity","UNVERIFIED"),
            "Responder statistical methods: "+r["supportiveSecondaryResponderMethods"].get("sourceIdentity","UNVERIFIED"),
            "Full original final SAP: NOT AUTHENTICATED",
            "Primary sensitivity independently reconstructed: NO",
            "HF SAE definitions reconciled: NO",
            "FDA prediction: ABSTAIN; clinical grades: 0",
            "Receipt SHA-256: "+r["receiptSha256"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("\n\n".join(summary)+"\n")
          PY
      - name: Archive metadata-only research receipt for up to 90 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acacia-alternative-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: acacia-alternate-source-audit/receipt.json
          retention-days: 90
          if-no-files-found: warn
