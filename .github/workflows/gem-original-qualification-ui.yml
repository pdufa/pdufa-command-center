name: GEM Original Qualification UI Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'new-platform/frontend/app/GemQualificationChecklist.tsx'
      - 'new-platform/frontend/app/globals.css'
      - 'new-platform/frontend/tests/gem-original-checkbox-groups.test.cjs'
      - '.github/workflows/gem-original-qualification-ui.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/app/GemQualificationChecklist.tsx'
      - 'new-platform/frontend/app/globals.css'
      - 'new-platform/frontend/tests/gem-original-checkbox-groups.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
