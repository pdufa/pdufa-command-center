name: RAAS FDA PASS-CRL-EXTENSION Prediction Accuracy Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/raas_fda_decision_accuracy_audit.py'
      - 'tests/test_raas_fda_decision_accuracy_audit.py'
      - 'scripts/raas_v2_prospective_source_readiness.py'
      - 'scripts/raas_v2_source_provenance_manifest.py'
      - 'scripts/raas_v2_openfda_application_watch.py'
      - 'tests/test_raas_v2_openfda_application_watch.py'
      - 'new-platform/frontend/data/raas-v2-nov14-review-cycle-triangulation.json'
      - 'tests/test_raas_v2_nov14_registry_triangulation.py'
      - 'tests/test_raas_v2_prospective_source_readiness.py'
      - 'tests/test_raas_v2_source_provenance_manifest.py'
      - 'tests/test_raas_v2_top8_source_intake.py'
      - 'tests/test_raas_v2_original_goal_queue_safety.py'
      - 'new-platform/frontend/data/raas-v2-top8-2026-source-intake.json'
      - 'data/raas_fda_three_way_*.json'
      - 'data/prediction_engine_history.csv'
      - 'data/fda_directional_100pct_freezes.csv'
      - 'new-platform/frontend/data/raas-2025-nine-archived-goal-original-source-triage.json'
      - 'tests/raas_2025_original_goal_triage.test.cjs'
      - 'new-platform/frontend/data/raas-fda-three-way-accuracy-site-snapshot.json'
      - 'new-platform/frontend/app/raas-worklist/page.tsx'
      - 'new-platform/frontend/tests/raas-fda-three-way-accuracy-site.test.cjs'
      - 'new-platform/frontend/data/raas-v2-candidate-source-readiness-site-snapshot.json'
      - 'new-platform/frontend/tests/raas-v2-source-readiness-site.test.cjs'
      - 'new-platform/frontend/tests/raas-v2-top8-source-site.test.cjs'
      - '.github/workflows/raas-fda-decision-accuracy.yml'
  pull_request:
    paths:
      - 'scripts/raas_fda_decision_accuracy_audit.py'
      - 'tests/test_raas_fda_decision_accuracy_audit.py'
      - 'scripts/raas_v2_prospective_source_readiness.py'
      - 'scripts/raas_v2_source_provenance_manifest.py'
      - 'scripts/raas_v2_openfda_application_watch.py'
      - 'tests/test_raas_v2_openfda_application_watch.py'
      - 'new-platform/frontend/data/raas-v2-nov14-review-cycle-triangulation.json'
      - 'tests/test_raas_v2_nov14_registry_triangulation.py'
      - 'tests/test_raas_v2_prospective_source_readiness.py'
      - 'tests/test_raas_v2_source_provenance_manifest.py'
      - 'tests/test_raas_v2_top8_source_intake.py'
      - 'tests/test_raas_v2_original_goal_queue_safety.py'
      - 'new-platform/frontend/data/raas-v2-top8-2026-source-intake.json'
      - 'data/raas_fda_three_way_*.json'
      - 'data/prediction_engine_history.csv'
      - 'data/fda_directional_100pct_freezes.csv'
      - 'new-platform/frontend/data/raas-2025-nine-archived-goal-original-source-triage.json'
      - 'tests/raas_2025_original_goal_triage.test.cjs'
      - 'new-platform/frontend/data/raas-fda-three-way-accuracy-site-snapshot.json'
      - 'new-platform/frontend/app/raas-worklist/page.tsx'
      - 'new-platform/frontend/tests/raas-fda-three-way-accuracy-site.test.cjs'
      - 'new-platform/frontend/data/raas-v2-candidate-source-readiness-site-snapshot.json'
      - 'new-platform/frontend/tests/raas-v2-source-readiness-site.test.cjs'
      - 'new-platform/frontend/tests/raas-v2-top8-source-site.test.cjs'
      - '.github/workflows/raas-fda-decision-accuracy.yml'
permissions:
  contents: read
jobs:
  prospective-three-way-decision-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify iPhone research-panel truthfulness and prospective ledger gates
        run: node --test new-platform/frontend/tests/raas-fda-three-way-accuracy-site.test.cjs
      - name: Verify original PDUFA goals and formal extension source leads (never approved trading or FDA metrics)
        run: node --test tests/raas_2025_original_goal_triage.test.cjs
      - name: Protect 3-class target, source clocks and 146 case baseline
        run: python -m unittest discover -s tests -p 'test_raas_fda_decision_accuracy_audit.py' -v
      - name: Confirm V2 candidate UI does not activate unvalidated RAAS calibrations
        run: node --test new-platform/frontend/tests/raas-v2-source-readiness-site.test.cjs
      - name: Verify V2 research candidate source triage, issuer grouping and zero forecast promotions
        run: python -m unittest discover -s tests -p 'test_raas_v2_prospective_source_readiness.py' -v
      - name: Validate mobile RAAS eight-case sources and unapproved V2 status
        run: node --test new-platform/frontend/tests/raas-v2-top8-source-site.test.cjs
      - name: Validate eight 2026 source cases, CAPR prior goal and ANAB third-party rights
        run: python -m unittest discover -s tests -p 'test_raas_v2_top8_source_intake.py' -v
      - name: Test V2 nightly original-deadline queue excludes revised goals and preserves source-only tags
        run: python -m unittest discover -s tests -p 'test_raas_v2_original_goal_queue_safety.py' -v
      - name: Verify six-file source snapshots cannot promote FDA application candidates or forecasts
        run: python -m unittest discover -s tests -p 'test_raas_v2_source_provenance_manifest.py' -v
      - name: Validate FDA public application watch against S-001 false positives, 404 uncertainty and future status rows
        run: python -m unittest discover -s tests -p 'test_raas_v2_openfda_application_watch.py' -v
      - name: Confirm November 14 NCT trials and unrelated FDA S-001 REMS review are never auto-predictions
        run: python -m unittest discover -s tests -p 'test_raas_v2_nov14_registry_triangulation.py' -v
      - name: Compute retrospective baseline and prospective FDA decision audit
        env:
          RAAS_FDA_ACCURACY_JSON: ${{ runner.temp }}/raas-fda-three-way-prediction-accuracy.json
          RAAS_FDA_ACCURACY_QUEUE_CSV: ${{ runner.temp }}/raas-fda-historical-source-review-queue.csv
          RAAS_FDA_LEGACY_FUTURE_QUEUE_CSV: ${{ runner.temp }}/raas-fda-upcoming-original-goal-review-queue.csv
        run: |
          export RAAS_FDA_EVALUATION_AS_OF_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/raas_fda_decision_accuracy_audit.py
      - name: Produce as-of V2 candidate source-readiness worklist (no model predictions)
        env:
          RAAS_V2_SOURCE_STATUS_JSON: ${{ runner.temp }}/raas-v2-prospective-source-readiness.json
          RAAS_V2_SOURCE_STATUS_CSV: ${{ runner.temp }}/raas-v2-prospective-source-review.csv
        run: |
          export RAAS_V2_ASOF_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python scripts/raas_v2_prospective_source_readiness.py
      - name: Check openFDA public parent application history (absence never means no pending BLA/sNDA)
        env:
          RAAS_OPENFDA_APPLICATION_WATCH_JSON: ${{ runner.temp }}/raas-v2-openfda-application-identity-watch.json
        run: python scripts/raas_v2_openfda_application_watch.py
      - name: Create GitHub-run-bound checksum manifest for V2 research sources only
        env:
          RAAS_SOURCE_REPORTS_DIRECTORY: ${{ runner.temp }}
          RAAS_V2_SOURCE_PROVENANCE_JSON: ${{ runner.temp }}/raas-v2-source-research-provenance.json
        run: python scripts/raas_v2_source_provenance_manifest.py
      - name: Publish evidence-gap and accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raas-fda-three-way-decision-validation
          path: |
            ${{ runner.temp }}/raas-fda-three-way-prediction-accuracy.json
            ${{ runner.temp }}/raas-fda-historical-source-review-queue.csv
            ${{ runner.temp }}/raas-fda-upcoming-original-goal-review-queue.csv
            ${{ runner.temp }}/raas-v2-prospective-source-readiness.json
            ${{ runner.temp }}/raas-v2-prospective-source-review.csv
            ${{ runner.temp }}/raas-v2-source-research-provenance.json
            ${{ runner.temp }}/raas-v2-openfda-application-identity-watch.json
          if-no-files-found: warn
          retention-days: 90
