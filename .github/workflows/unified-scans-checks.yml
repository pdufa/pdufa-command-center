name: Unified SCANS Score and Dispatch Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified-scans-checks.yml'
      - '.github/workflows/pdufa-individual-source-scan.yml'
      - '.github/workflows/pdufa-individual-clinical-scan.yml'
      - 'unified_scans_command_center.py'
      - 'overnight_status_ui.py'
      - 'nightly_scan_dashboard.py'
      - 'tests/test_unified_scans_command_center.py'
  pull_request:
    paths:
      - 'unified_scans_command_center.py'
      - 'tests/test_unified_scans_command_center.py'
      - '.github/workflows/pdufa-individual-source-scan.yml'
      - '.github/workflows/pdufa-individual-clinical-scan.yml'

permissions:
  contents: read

jobs:
  validate-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight dashboard test dependencies
        run: python -m pip install streamlit pandas
      - name: Compile code and verify per-section score and dispatch routing
        run: |
          python -m py_compile unified_scans_command_center.py overnight_status_ui.py nightly_scan_dashboard.py
          python -m unittest discover -s tests -p 'test_unified_scans_command_center.py' -v
      - name: Verify section-specific workflows preserve all-source isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.github/workflows')
          source = (root/'pdufa-individual-source-scan.yml').read_text()
          clinical = (root/'pdufa-individual-clinical-scan.yml').read_text()
          for text, tokens in (
              (source, ['workflow_dispatch:', 'options: [FDA, SEC, FINANCIAL, MARKET, ISSUER]',
                        '--scan "$SOURCE" --mode "$notify_mode"',
                        '--source "$SOURCE" --mode "$SCAN_MODE"',
                        'data/individual_source_scans']),
              (clinical, ['workflow_dispatch:', 'options: [PIPELINE, PHASE3_RESULTS]',
                          '--scan "$scan" --mode "$notify_mode"',
                          '--scan "$scan" --mode "$SCAN_MODE"',
                          'data/individual_clinical_scans']),
          ):
              for token in tokens:
                  assert token in text, f'Missing section scan safety contract: {token}'
          print('Individual source and clinical workflows are correctly scoped.')
          PY
