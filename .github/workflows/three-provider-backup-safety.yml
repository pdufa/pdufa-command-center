name: Three-provider backup safety tests

on:
  push:
    paths:
      - "scripts/replicate_recovery_archive.py"
      - "tests/test_replicate_recovery_archive.py"
      - "docs/THREE_PROVIDER_BACKUP_SETUP.md"
      - ".github/workflows/three-provider-backup-safety.yml"
  pull_request:
    paths:
      - "scripts/replicate_recovery_archive.py"
      - "tests/test_replicate_recovery_archive.py"
      - "docs/THREE_PROVIDER_BACKUP_SETUP.md"
      - ".github/workflows/three-provider-backup-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline backup safety unit tests
        run: python -m unittest discover -s tests -p 'test_replicate_recovery_archive.py' -v
      - name: Check for syntax errors
        run: python -m py_compile scripts/replicate_recovery_archive.py
