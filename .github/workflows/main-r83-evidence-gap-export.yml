name: MAIN R83-R86 source-gap, phase and original-doc inventory acceptance
# Read-only source status and documented reviewer handoff; not clinical validation.
on:
  push:
    branches: [feature/main-r83-evidence-gap-export-20261109]
    paths:
      - .github/workflows/main-r83-evidence-gap-export.yml
      - new-platform/frontend/lib/focus-r83-evidence-gap-export.ts
      - new-platform/frontend/app/predictions/evidence-gaps/export/route.ts
      - new-platform/frontend/app/predictions/evidence-gaps/FocusSourceReadinessR81.tsx
      - new-platform/frontend/tests/focus-r83-evidence-gap-export.test.cjs
      - new-platform/frontend/lib/focus-r84-application-verification-queue.ts
      - new-platform/frontend/app/predictions/evidence-gaps/ApplicationVerificationR84.tsx
      - new-platform/frontend/tests/focus-r84-application-verification.test.cjs
      - new-platform/frontend/lib/focus-r85-registry-phase-crosscheck.ts
      - new-platform/frontend/app/predictions/phase-verification/check/route.ts
      - new-platform/frontend/app/predictions/phase-verification/page.tsx
      - new-platform/frontend/tests/focus-r85-registry-phase-crosscheck.test.cjs
      - new-platform/frontend/lib/focus-r86-original-document-inventory.ts
      - new-platform/frontend/app/predictions/original-documents/page.tsx
      - new-platform/frontend/app/predictions/original-documents/OriginalSourceDocumentsR86Client.tsx
      - new-platform/frontend/app/predictions/original-documents/check/route.ts
      - new-platform/frontend/tests/focus-r86-original-document-inventory.test.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-r83-review-export
  cancel-in-progress: false

jobs:
  read-only-export-acceptance:
    if: github.repository == 'pdufa/pdufa-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Confirm exact canonical FOCUS population and permanent retirement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python scripts/audit_raas_retirement.py --check
      - name: Test source-only CSV export, TypeScript and production build
        shell: bash
        working-directory: new-platform/frontend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test tests/focus-r81-all-source-readiness.test.cjs tests/focus-r83-evidence-gap-export.test.cjs tests/focus-r84-application-verification.test.cjs tests/focus-r85-registry-phase-crosscheck.test.cjs tests/focus-r86-original-document-inventory.test.cjs
          npm run typecheck
          npm run build
      - name: Report limited scientific status
        if: success()
        shell: bash
        run: |
          {
            echo "## Revisions 83-86: exact-NCT evidence-gap, issuer date, registry phase and original document listings"
            echo "29 exact FOCUS NCT rows, with all 23 provisional application cycle links and original-source absence explicitly described."
            echo "Source and schema integrity validated; source-reported application goals are not FDA verified. CSV has no scientific grade, calibrated probability or production write."
            echo "Posted public protocol/SAP metadata is not authenticated signed chronology or science; live registry field matching is not phase signoff. 0 independent clinical signoffs; 0 validated future FDA forecasts. Scientific installation remains incomplete."
          } >> "$GITHUB_STEP_SUMMARY"
