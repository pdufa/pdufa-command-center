name: PDUFA Daily Research Safety Checks
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pdufa_readiness_gate.py'
      - 'scripts/evaluate_fda_predictions.py'
      - 'scripts/compare_fda_prediction_baseline.py'
      - 'scripts/screen_fda_evidence.py'
      - 'scripts/build_fda_evidence_review_queue.py'
      - 'tests/test_pdufa_readiness_gate.py'
      - 'tests/test_evaluate_fda_predictions.py'
      - 'tests/test_compare_fda_prediction_baseline.py'
      - 'tests/test_screen_fda_evidence.py'
      - 'tests/test_build_fda_evidence_review_queue.py'
      - '.github/workflows/pdufa-daily-research-safety.yml'
  pull_request:
    paths:
      - '.github/workflows/pdufa-daily-research-safety.yml'
      - 'scripts/pdufa_readiness_gate.py'
      - 'scripts/evaluate_fda_predictions.py'
      - 'scripts/compare_fda_prediction_baseline.py'
      - 'scripts/screen_fda_evidence.py'
      - 'scripts/build_fda_evidence_review_queue.py'
      - 'tests/test_pdufa_readiness_gate.py'
      - 'tests/test_evaluate_fda_predictions.py'
      - 'tests/test_compare_fda_prediction_baseline.py'
      - 'tests/test_screen_fda_evidence.py'
      - 'tests/test_build_fda_evidence_review_queue.py'

permissions:
  contents: read

concurrency:
  group: pdufa-research-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify existing nightly scan clock and publication safeguards
        run: python -m unittest discover -s tests -p 'test_nightly_pacific_sequence.py' -v
      - name: Checkout isolated SCIENCE and OUTCOME research branch
        uses: actions/checkout@v4
        with:
          ref: feature/decision-workstream-20261026
          path: research
          persist-credentials: false
      - name: Run isolated FDA prediction research tests
        working-directory: research
        run: |
          python -m pytest -q \
            tests/test_pdufa_readiness_gate.py \
            tests/test_evaluate_fda_predictions.py \
            tests/test_compare_fda_prediction_baseline.py \
            tests/test_screen_fda_evidence.py \
            tests/test_build_fda_evidence_review_queue.py \
            tests/test_fda_bepirovirsen_candidate.py \
            tests/test_historical_parallel_matching.py \
            tests/test_fda_decision_taxonomy.py \
            tests/test_audit_fda_decisions.py \
            tests/test_fda_historical_candidate_ledger.py \
            tests/test_collect_fda_source_hashes.py \
            tests/test_reconcile_fda_source_evidence.py \
            tests/test_pdufa_integrated_readiness.py \
            tests/test_prepare_fda_review_packet.py \
            tests/test_summarize_fda_discovery.py \
            tests/test_stage_drugsatfda_submissions.py
      - name: Download and stage official Drugs@FDA archive (non-blocking)
        id: fda_bulk_stage
        continue-on-error: true
        working-directory: research
        run: |
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
            --max-filesize 50000000 \
            'https://www.fda.gov/media/89850/download?attachment=' \
            --output drugsatfda.zip
          python scripts/stage_drugsatfda_submissions.py \
            --zip drugsatfda.zip --output historical_drugsatfda_candidates.json
          python -m json.tool historical_drugsatfda_candidates.json > /dev/null
      - name: Publish official Drugs@FDA staged candidates
        if: steps.fda_bulk_stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: historical-drugsatfda-staged-candidates
          path: research/historical_drugsatfda_candidates.json
          retention-days: 7
      - name: Produce quarantined historical FDA candidate ledger
        working-directory: research
        run: |
          python scripts/build_fda_historical_candidate_ledger.py \
            --candidate-dir data > historical_fda_candidate_ledger.json
          python -m json.tool historical_fda_candidate_ledger.json > /dev/null
      - name: Collect official FDA PDF source fingerprints (non-blocking)
        working-directory: research
        run: |
          python scripts/collect_fda_source_hashes.py --candidate-dir data > historical_fda_source_hashes.json
          python -m json.tool historical_fda_source_hashes.json > /dev/null
      - name: Reconcile FDA candidate and source evidence reports
        working-directory: research
        run: |
          python scripts/reconcile_fda_source_evidence.py \
            --ledger historical_fda_candidate_ledger.json \
            --fingerprints historical_fda_source_hashes.json > historical_fda_reconciliation.json
          python -m json.tool historical_fda_reconciliation.json > /dev/null
      - name: Build integrated SCIENCE OUTCOME MAIN readiness report
        working-directory: research
        run: |
          python scripts/build_pdufa_integrated_readiness.py \
            --ledger historical_fda_candidate_ledger.json \
            --fingerprints historical_fda_source_hashes.json \
            --reconciliation historical_fda_reconciliation.json > pdufa_integrated_readiness.json
          python -m json.tool pdufa_integrated_readiness.json > /dev/null
      - name: Prepare FDA independent-review packets
        working-directory: research
        run: |
          python scripts/prepare_fda_review_packet.py \
            --ledger historical_fda_candidate_ledger.json \
            --reconciliation historical_fda_reconciliation.json > historical_fda_review_packet.json
          python -m json.tool historical_fda_review_packet.json > /dev/null
      - name: Summarize FDA announcement discovery queue
        working-directory: research
        run: |
          python scripts/summarize_fda_discovery.py \
            --discovery data/fda_official_announcement_discovery_20261027.json > historical_fda_discovery_summary.json
          python -m json.tool historical_fda_discovery_summary.json > /dev/null
      - name: Publish FDA discovery summary
        uses: actions/upload-artifact@v4
        with:
          name: historical-fda-discovery-summary
          path: research/historical_fda_discovery_summary.json
          retention-days: 30
      - name: Publish FDA review packets
        uses: actions/upload-artifact@v4
        with:
          name: historical-fda-review-packets
          path: research/historical_fda_review_packet.json
          retention-days: 30
      - name: Publish integrated PDUFA readiness report
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-integrated-readiness
          path: research/pdufa_integrated_readiness.json
          retention-days: 30
      - name: Publish FDA reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: historical-fda-evidence-reconciliation
          path: research/historical_fda_reconciliation.json
          retention-days: 30
      - name: Publish FDA source fingerprint report
        uses: actions/upload-artifact@v4
        with:
          name: historical-fda-source-fingerprints
          path: research/historical_fda_source_hashes.json
          retention-days: 30
      - name: Publish candidate ledger for review
        uses: actions/upload-artifact@v4
        with:
          name: historical-fda-candidate-ledger
          path: research/historical_fda_candidate_ledger.json
          retention-days: 30
