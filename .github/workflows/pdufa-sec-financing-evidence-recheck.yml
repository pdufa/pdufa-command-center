name: PDUFA SEC Financing Evidence Recheck

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/provisional_financing_sec_recheck.py'
      - 'config/issuer_sources.json'
      - 'scripts/targeted_verification_repair.py'
      - 'scripts/source_verification.py'
      - 'tests/test_source_verification.py'
      - 'tests/test_provisional_financing_sec_recheck.py'
      - 'tests/test_targeted_verification_repair.py'
      - 'tests/test_sec_evidence_recheck_workflow.py'
      - 'tests/test_targeted_verification_repair.py'
      - 'tests/test_sec_evidence_recheck_workflow.py'
      - 'sec_search_discovery.py'
      - 'sec_financing_closure_ui.py'
      - 'nightly_scan_dashboard.py'
      - 'tests/test_sec_search_discovery.py'
      - '.github/workflows/pdufa-sec-financing-evidence-recheck.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/provisional_financing_sec_recheck.py'
      - 'config/issuer_sources.json'
      - 'scripts/targeted_verification_repair.py'
      - 'scripts/source_verification.py'
      - 'tests/test_source_verification.py'
      - 'tests/test_provisional_financing_sec_recheck.py'
      - 'sec_search_discovery.py'
      - 'sec_financing_closure_ui.py'
      - 'nightly_scan_dashboard.py'
      - 'tests/test_sec_search_discovery.py'
      - '.github/workflows/pdufa-sec-financing-evidence-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify financing evidence stays fail-closed
        run: python -m unittest discover -s tests -p 'test_provisional_financing_sec_recheck.py' -v
      - name: Check Yahoo and Bing discovery link safety
        run: python -m unittest discover -s tests -p 'test_sec_search_discovery.py' -v
      - name: Verify targeted-claim SEC and FDA recheck safeguards
        run: python -m unittest discover -s tests -p 'test_targeted_verification_repair.py' -v
      - name: Verify independent recheck workflow scheduling and scope
        run: python -m unittest discover -s tests -p 'test_sec_evidence_recheck_workflow.py' -v

  live-recheck:
    needs: offline-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SEC researcher identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SEC_USER_AGENT" != *"@"* ]]; then
            echo "::error::SEC_USER_AGENT must include a real contact email. No verification was performed."
            exit 1
          fi
      - name: Independently recheck dated issuer financing leads against SEC
        run: |
          python scripts/provisional_financing_sec_recheck.py \
            --targets data/finance_ir_sec_recheck_targets.csv \
            --output reports/missing_sources/sec_financing_ir_recheck.csv
      - name: Publish research-only result summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import csv
          import os
          from pathlib import Path
          p = Path('reports/missing_sources/sec_financing_ir_recheck.csv')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## SEC financing research leads\n\n')
              if not p.is_file():
                  out.write('No report: SEC recheck did not finish. **No evidence promoted.**\n')
              else:
                  rows = list(csv.DictReader(p.open(newline='', encoding='utf-8')))
                  counts = collections.Counter(r['sec_recheck_status'] for r in rows)
                  out.write(f'Rechecked {len(rows)} dated issuer leads.\n\n')
                  for status, count in sorted(counts.items()):
                      out.write(f'- {status}: {count}\n')
                  out.write('\nNo second post-Phase-3 financing or trade-entry gate is automatically verified.\n')
          PY
      - name: Archive SEC source recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-financing-issuer-recheck-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: reports/missing_sources/sec_financing_ir_recheck.csv

  unresolved-claim-recheck:
    needs: [offline-tests, live-recheck]
    # Preserve serial API usage, but do not lose the canonical unresolved-claim
    # comparison when the unrelated provisional lead job fails or is skipped.
    # Failed/offline safeguards still block all live rechecks.
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs['offline-tests'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install primary document extraction
        run: python -m pip install pypdf
      - name: Verify SEC researcher identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SEC_USER_AGENT" != *"@"* ]]; then
            echo "::error::SEC_USER_AGENT must include a real contact email"
            exit 1
          fi
      - name: Fresh recheck of canonical required unresolved source claims
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN_ID=$(python -c 'import json;print(json.load(open("data/pdufa_source_report.json"))["latest_run_id"])')
          python -m scripts.targeted_verification_repair \
            --source-run-id "$SOURCE_RUN_ID" \
            --output reports/missing_sources/targeted_required_recheck.json \
            --csv-output reports/missing_sources/targeted_required_recheck.csv
      - name: Show exact-run research recheck outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("reports/missing_sources/targeted_required_recheck.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Canonical unresolved source recheck\\n\\n")
              if not path.is_file():
                  out.write("No complete report. **Claims remain unverified; no source promotion.**\\n")
              else:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  out.write("Source run: " + str(data["source_report_run_id"]) + "\\n\\n")
                  out.write("Required claims rechecked: " + str(data["findings_due"]) + "\\n\\n")
                  out.write("Freshly supported claims (research-only): " + str(data["findings_verified"]) + "\\n\\n")
                  out.write("Still unresolved: " + str(data["required_findings_unresolved"]) + "\\n\\n")
                  out.write("No original ledger, model or trade gate was changed.\\n")
          PY
      - name: Archive evidence-backed unresolved source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-required-claim-recheck-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/missing_sources/targeted_required_recheck.json
            reports/missing_sources/targeted_required_recheck.csv
