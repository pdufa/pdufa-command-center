name: Phase 3 2026 issuer-positive census audit
on:
  push:
    paths:
      - 'scripts/phase3_2026_public_census.py'
      - '.github/workflows/phase3-2026-census.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all saved Phase 3 results records
        run: python scripts/phase3_2026_public_census.py
      - name: Publish audit counts and accepted rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase3_2026_public_census.csv data/phase3_2026_public_census_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish conservative 2026 Phase 3 issuer census audit"
          git pull --rebase origin main
          git push origin HEAD:main
