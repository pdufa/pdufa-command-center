name: PDUFA Nightly Clinical Scans

# Nightly 8:30 PM Pacific start is dispatched by the DST-aware Pacific scheduler.
# Ad-hoc workflow_dispatch remains available; only one clinical scan runs at a time.
on:
  workflow_dispatch:
    inputs:
      scan:
        description: 'Clinical scan to collect (#2, #3, #4, or all)'
        type: choice
        options: ['ALL', '2', '3', '4']
        default: 'ALL'
        required: true

permissions:
  contents: read

concurrency:
  group: pdufa-nightly-clinical-collectors
  cancel-in-progress: false

jobs:
  scan2:
    name: 'PDUFA #2 PIPELINE — notified scan'
    if: ${{ inputs.scan == 'ALL' || inputs.scan == '2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
    steps:
      - name: Checkout saved clinical source snapshots
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ClinicalTrials.gov collector dependency
        run: python -m pip install requests
      - name: Verify email settings exist before any scanning
        shell: bash
        run: |
          for key in PDUFA_GMAIL_USER PDUFA_GMAIL_APP_PASSWORD PDUFA_ALERT_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret ${key}; scan will not start."
              exit 1
            fi
          done
      - name: Submit START email, scan evidence, submit END email
        id: scan
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan "2" --mode DELTA \
            --status-file "reports/nightly-clinical-2.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7100 -- \
            python scripts/nightly_clinical_collection.py \
              --scan "2" \
              --report "reports/nightly-clinical-2.json"
          exit_code=$?
          echo "Notification/scanner exit code: $exit_code"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Clinical collector completed, all-source PDUFA baseline remains PARTIAL."
            exit 0
          fi
          exit "$exit_code"
      - name: Archive scan results, source status and notification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-clinical-2-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/nightly-clinical-2.json
            reports/scan_notifications/
            data/all_phase_scan_state.json
            data/all_phase_trials.csv
            data/phase_pipeline.csv
            data/phase_pipeline_market_caps.csv
            data/phase3_announcements.csv

  scan3:
    name: 'PDUFA #3 PRE3 — notified scan'
    needs: scan2
    if: ${{ always() && (inputs.scan == 'ALL' || inputs.scan == '3') }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
    steps:
      - name: Checkout saved clinical source snapshots
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ClinicalTrials.gov collector dependency
        run: python -m pip install requests
      - name: Verify email settings exist before any scanning
        shell: bash
        run: |
          for key in PDUFA_GMAIL_USER PDUFA_GMAIL_APP_PASSWORD PDUFA_ALERT_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret ${key}; scan will not start."
              exit 1
            fi
          done
      - name: Submit START email, scan evidence, submit END email
        id: scan
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan "3" --mode DELTA \
            --status-file "reports/nightly-clinical-3.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7100 -- \
            python scripts/nightly_clinical_collection.py \
              --scan "3" \
              --report "reports/nightly-clinical-3.json"
          exit_code=$?
          echo "Notification/scanner exit code: $exit_code"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Clinical collector completed, all-source PDUFA baseline remains PARTIAL."
            exit 0
          fi
          exit "$exit_code"
      - name: Archive scan results, source status and notification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-clinical-3-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/nightly-clinical-3.json
            reports/scan_notifications/
            data/phase_pipeline_state.json
            data/all_phase_trials.csv
            data/phase_pipeline.csv
            data/phase_pipeline_market_caps.csv
            data/phase3_announcements.csv

  scan4:
    name: 'PDUFA #4 POST3 — notified scan'
    needs: scan3
    if: ${{ always() && (inputs.scan == 'ALL' || inputs.scan == '4') }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
    steps:
      - name: Checkout saved clinical source snapshots
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ClinicalTrials.gov collector dependency
        run: python -m pip install requests
      - name: Verify email settings exist before any scanning
        shell: bash
        run: |
          for key in PDUFA_GMAIL_USER PDUFA_GMAIL_APP_PASSWORD PDUFA_ALERT_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret ${key}; scan will not start."
              exit 1
            fi
          done
      - name: Submit START email, scan evidence, submit END email
        id: scan
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan "4" --mode DELTA \
            --status-file "reports/nightly-clinical-4.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7100 -- \
            python scripts/nightly_clinical_collection.py \
              --scan "4" \
              --report "reports/nightly-clinical-4.json"
          exit_code=$?
          echo "Notification/scanner exit code: $exit_code"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Clinical collector completed, all-source PDUFA baseline remains PARTIAL."
            exit 0
          fi
          exit "$exit_code"
      - name: Archive scan results, source status and notification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-clinical-4-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
