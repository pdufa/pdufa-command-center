name: PDUFA Nightly Clinical Scans

# Called and awaited by the single 9 PM Pacific overnight workflow.
# Ad-hoc workflow_dispatch remains available; only one clinical scan runs at a time.
on:
  workflow_call:
    inputs:
      scan:
        type: string
        default: ALL
      scan_mode:
        type: string
        default: DELTA
  workflow_dispatch:
    inputs:
      scan:
        description: 'Clinical source stage (POOL, Pipeline or posted Phase 3 results)'
        type: choice
        options: ['ALL', 'PIPELINE', 'PHASE3_RESULTS']
        default: 'ALL'
        required: true
      scan_mode:
        description: 'DELTA new/changed evidence, or FULL Sunday reconciliation'
        type: choice
        options: [DELTA, FULL]
        default: DELTA

permissions:
  contents: write
  actions: read

concurrency:
  group: pdufa-nightly-clinical-collectors
  cancel-in-progress: false

jobs:
  pipeline:
    name: 'PIPELINE — trial inventory and early-clinical evidence'
    if: ${{ inputs.scan == 'ALL' || inputs.scan == 'PIPELINE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
      PDUFA_SMS_VERIFIED: ${{ secrets.PDUFA_SMS_VERIFIED }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      PDUFA_SMS_TO_NUMBER: ${{ secrets.PDUFA_SMS_TO_NUMBER }}
    steps:
      - name: Checkout saved clinical source snapshots
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ClinicalTrials.gov collector dependency
        run: python -m pip install requests
      - name: Verify email settings exist before any scanning
        shell: bash
        run: |
          for key in PDUFA_GMAIL_USER PDUFA_GMAIL_APP_PASSWORD PDUFA_ALERT_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret ${key}; scan will not start."
              exit 1
            fi
          done
      - name: Submit START email, scan evidence, submit END email
        id: scan
        shell: bash
        run: |
          set +e
          sms_opt=()
          # Never activate untested SMS delivery: opt in only after real handset verification.
          if [[ "${PDUFA_SMS_VERIFIED:-}" == "true" ]]; then sms_opt+=(--require-sms); fi
          python scripts/run_scan_with_email.py "${sms_opt[@]}" \
            --scan "2" --mode "${{ inputs.scan_mode == 'FULL' && 'BASELINE' || 'DELTA' }}" \
            --status-file "reports/nightly-clinical-2.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7100 -- \
            python scripts/nightly_clinical_collection.py \
              --scan "2" --mode "${{ inputs.scan_mode || 'DELTA' }}" \
              --report "reports/nightly-clinical-2.json"
          exit_code=$?
          echo "Notification/scanner exit code: $exit_code"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Clinical collector completed, all-source PDUFA baseline remains PARTIAL."
            exit 0
          fi
          exit "$exit_code"
      - name: Publish completed clinical snapshot before the next scan
        run: |
          set -euo pipefail
          python scripts/validate_clinical_snapshot.py --scan 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/all_phase_scan_state.json data/all_phase_trials.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish completed clinical scan 2 source snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          echo "::error::Clinical snapshot could not be published; source artifacts retained."
          exit 1
      - name: Archive scan results, source status and notification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-clinical-2-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/nightly-clinical-2.json
            reports/scan_notifications/
            data/all_phase_scan_state.json
            data/all_phase_trials.csv
            data/phase_pipeline.csv
            data/phase_pipeline_market_caps.csv
            data/phase3_announcements.csv
      - name: PIPELINE — enrich tracked Phase 2/3 trials
        id: clinical_enrichment
        shell: bash
        run: |
          set +e
          sms_opt=()
          # Never activate untested SMS delivery: opt in only after real handset verification.
          if [[ "${PDUFA_SMS_VERIFIED:-}" == "true" ]]; then sms_opt+=(--require-sms); fi
          python scripts/run_scan_with_email.py "${sms_opt[@]}" \
            --scan "3" --mode "${{ inputs.scan_mode == 'FULL' && 'BASELINE' || 'DELTA' }}" \
            --status-file "reports/nightly-clinical-3.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7100 -- \
            python scripts/nightly_clinical_collection.py \
              --scan "3" --mode "${{ inputs.scan_mode || 'DELTA' }}" \
              --report "reports/nightly-clinical-3.json"
          exit_code=$?
          echo "Notification/scanner exit code: $exit_code"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Clinical collector completed, all-source PDUFA baseline remains PARTIAL."
            exit 0
          fi
          exit "$exit_code"
      - name: Publish verified PIPELINE early-clinical snapshot
        run: |
          set -euo pipefail
          python scripts/validate_clinical_snapshot.py --scan 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/phase_pipeline_state.json data/phase_pipeline.csv data/phase_pipeline_market_caps.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish completed clinical scan 3 source snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          echo "::error::Clinical snapshot could not be published; source artifacts retained."
          exit 1
      - name: Archive PIPELINE early-clinical source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-clinical-3-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/nightly-clinical-3.json
            reports/scan_notifications/
            data/phase_pipeline_state.json
            data/all_phase_trials.csv
            data/phase_pipeline.csv
            data/phase_pipeline_market_caps.csv
            data/phase3_announcements.csv

  phase3_results:
    name: 'Post–Phase 3 — registry results collector'
    needs: pipeline
    # PHASE3_RESULTS-only dispatch skips PIPELINE by design. always() prevents the
    # implicit needs-success guard from skipping this independently requested job.
    if: ${{ always() && (inputs.scan == 'PHASE3_RESULTS' || (inputs.scan == 'ALL' && needs.pipeline.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
      PDUFA_SMS_VERIFIED: ${{ secrets.PDUFA_SMS_VERIFIED }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      PDUFA_SMS_TO_NUMBER: ${{ secrets.PDUFA_SMS_TO_NUMBER }}
    steps:
      - name: Checkout saved clinical source snapshots
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ClinicalTrials.gov collector dependency
        run: python -m pip install requests
      - name: Verify email settings exist before any scanning
        shell: bash
        run: |
          for key in PDUFA_GMAIL_USER PDUFA_GMAIL_APP_PASSWORD PDUFA_ALERT_EMAIL; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret ${key}; scan will not start."
              exit 1
            fi
          done
      - name: Submit START email, scan evidence, submit END email
        id: scan
        shell: bash
        run: |
          set +e
          sms_opt=()
          # Never activate untested SMS delivery: opt in only after real handset verification.
          if [[ "${PDUFA_SMS_VERIFIED:-}" == "true" ]]; then sms_opt+=(--require-sms); fi
          python scripts/run_scan_with_email.py "${sms_opt[@]}" \
            --scan "4" --mode "${{ inputs.scan_mode == 'FULL' && 'BASELINE' || 'DELTA' }}" \
            --status-file "reports/nightly-clinical-4.json" \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 7100 -- \
            python scripts/nightly_clinical_collection.py \
              --scan "4" --mode "${{ inputs.scan_mode || 'DELTA' }}" \
              --report "reports/nightly-clinical-4.json"
          exit_code=$?
          echo "Notification/scanner exit code: $exit_code"
          if [ "$exit_code" -eq 3 ]; then
            echo "::warning::Clinical collector completed, all-source PDUFA baseline remains PARTIAL."
            exit 0
          fi
          exit "$exit_code"
      - name: Publish completed clinical snapshot before the next scan
        run: |
          set -euo pipefail
          python scripts/validate_clinical_snapshot.py --scan 4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/phase3_intake_status.json data/phase3_announcements.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish completed clinical scan 4 source snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          echo "::error::Clinical snapshot could not be published; source artifacts retained."
          exit 1
      # The two TOOLS spreadsheets must track actual downloaded registry data,
      # never the separate issuer-topline classifications.
      - name: Refresh both TOOLS Phase 3 registry results spreadsheets
        run: |
          set -euo pipefail
          python scripts/refresh_phase3_registry_postings.py
      - name: Publish updated TOOLS registry results immediately after scan 4
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- new-platform/frontend/public/phase3-registry-postings-current.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Phase 3 TOOLS results-posting tables after scan 4"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          echo "::error::TOOLS results tables publication failed; last complete snapshot preserved."
          exit 1
      - name: Archive scan results, source status and notification audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-clinical-4-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/nightly-clinical-4.json
            reports/scan_notifications/
            data/phase3_intake_status.json
            data/all_phase_trials.csv
            data/phase_pipeline.csv
            data/phase_pipeline_market_caps.csv
            data/phase3_announcements.csv

