name: PDUFA Nightly 8:30 PM Pacific Start

# GitHub cron is UTC, not Pacific. Run both candidate UTC slots, then
# dispatch exactly the one matching the current Los Angeles UTC offset.
# GitHub may start scheduled jobs late; the cron/offset gate avoids a
# second nightly dispatch during daylight/standard time transitions.
on:
  schedule:
    - cron: '30 3 * * *'  # 8:30 PM PDT
    - cron: '45 3 * * *'  # 8:45 PM PDT fallback if no start
    - cron: '0 4 * * *'   # 9:00 PM PDT fallback if no start
    - cron: '30 4 * * *'  # 8:30 PM PST
    - cron: '45 4 * * *'  # 8:45 PM PST fallback if no start
    - cron: '0 5 * * *'   # 9:00 PM PST fallback if no start
    - cron: '15 4 * * *'  # 9:15 PM PDT publisher handoff watchdog
    - cron: '15 5 * * *'  # 9:15 PM PST publisher handoff watchdog
    - cron: '30 5 * * *'  # 9:30 PM PST second publisher watchdog
  workflow_dispatch:
  # One-time bootstrap on an explicit scheduler repair (not ordinary app pushes).
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-nightly-pacific-start.yml']

permissions:
  actions: write
  contents: read

concurrency:
  group: pdufa-nightly-pacific-start
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start one serial nightly scan chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept only matching 8:30 PM Pacific cron slot
        id: pacific
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Authorized manual start"
            exit 0
          fi
          if [ "$EVENT_NAME" = push ]; then
            hour="$(TZ=America/Los_Angeles date +%H)"
            minute="$(TZ=America/Los_Angeles date +%M)"
            now_minutes=$((10#$hour * 60 + 10#$minute))
            if [ "$now_minutes" -ge 1230 ] && [ "$now_minutes" -lt 1320 ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Scheduler repair push during nightly window: guarded bootstrap"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Scheduler repair outside nightly window: no scan started"
            fi
            exit 0
          fi
          offset="$(TZ=America/Los_Angeles date +%z)"
          if { { [ "$SCHEDULE_CRON" = '30 3 * * *' ] || [ "$SCHEDULE_CRON" = '45 3 * * *' ] || [ "$SCHEDULE_CRON" = '0 4 * * *' ]; } && [ "$offset" = -0700 ]; } ||
             { { [ "$SCHEDULE_CRON" = '30 4 * * *' ] || [ "$SCHEDULE_CRON" = '45 4 * * *' ] || [ "$SCHEDULE_CRON" = '0 5 * * *' ]; } && [ "$offset" = -0800 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Correct Pacific-night slot; offset $offset"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skip non-matching UTC slot; offset $offset"
          fi
      - name: Dispatch clinical scan to start serial chain
        if: steps.pacific.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub scheduled starts can be delayed or retried. Do not start a
          # second nightly chain when a clinical workflow exists after 8:30 PM LA.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-clinical.yml/runs?per_page=100" > "$RUNNER_TEMP/pdufa-clinical-runs.json"
          if python - "$RUNNER_TEMP/pdufa-clinical-runs.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          start = now.astimezone(ZoneInfo("America/Los_Angeles")).replace(
              hour=20, minute=30, second=0, microsecond=0).astimezone(timezone.utc)
          with open(sys.argv[1], encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          exists = any(
              run.get("event") == "workflow_dispatch"
              and start <= datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")) <= now
              for run in runs if run.get("created_at")
          )
          print("Nightly clinical scan already started today" if exists else "No nightly clinical run found since 8:30 PM Pacific")
          raise SystemExit(0 if exists else 1)
          PY
          then
            echo "No duplicate dispatch; nightly clinical workflow is already recorded."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-clinical.yml/dispatches" \
            -f ref=main -f 'inputs[scan]=ALL'
          echo "Requested nightly clinical 2 -> 3 -> 4; report -> FDA -> SEC -> FINANCIAL -> MARKET -> ISSUER -> reconcile -> scoring -> error check -> repair."
          echo "Dispatch acceptance is not scan completion; check the actual downstream runs."

      - name: Recover missing clinical report publishing handoff
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only act after 9 PM Pacific; the completed clinical run must have
          # had at least three minutes for its normal workflow_run trigger.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-clinical.yml/runs?per_page=100" > "$RUNNER_TEMP/clinical-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-report.yml/runs?per_page=100" > "$RUNNER_TEMP/publisher-runs.json"
          python - "$RUNNER_TEMP/clinical-runs.json" "$RUNNER_TEMP/publisher-runs.json" "$RUNNER_TEMP/publisher-source-id" <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo("America/Los_Angeles"))
          if not (21 <= local.hour < 23):
              print("Report handoff recovery disabled outside 9-11 PM Pacific")
              raise SystemExit(0)
          start = local.replace(hour=20, minute=30, second=0, microsecond=0).astimezone(timezone.utc)
          def read(index):
              with open(sys.argv[index], encoding="utf-8") as handle:
                  return json.load(handle).get("workflow_runs", [])
          def moment(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))
          scans = [run for run in read(1) if run.get("event") == "workflow_dispatch"
                   and run.get("created_at") and start <= moment(run["created_at"]) <= now]
          if not scans:
              print("No clinical run tonight; report recovery not dispatched")
              raise SystemExit(0)
          scan = max(scans, key=lambda run: run["created_at"])
          if scan.get("status") != "completed" or scan.get("conclusion") != "success":
              print("Clinical scan not fully successful; do not publish unverified report")
              raise SystemExit(0)
          completed = moment(scan["updated_at"])
          if now - completed < timedelta(minutes=3):
              print("Allowing the native workflow_run publisher to start")
              raise SystemExit(0)
          publishers = [run for run in read(2)
                        if run.get("created_at") and moment(run["created_at"]) >= completed]
          if publishers:
              print("Report publisher already started after this clinical scan; no duplicate")
              raise SystemExit(0)
          Path(sys.argv[3]).write_text(str(scan["id"]), encoding="utf-8")
          print("Missing completed-clinical report handoff: requesting publisher for run " + str(scan["id"]))
          PY
          if [ -s "$RUNNER_TEMP/publisher-source-id" ]; then
            source_id="$(cat "$RUNNER_TEMP/publisher-source-id")"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-report.yml/dispatches" \
              -f ref=main -f "inputs[source_run_id]=$source_id"
            echo "Requested source-validated report publishing for clinical run $source_id"
          fi

      - name: Recover missing extended-source verification handoff
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The publisher's ordinary workflow_run trigger gets first chance.
          # Fallback only for this Pacific-night window and only after a verified
          # successful report publishing run; never call incomplete evidence COMPLETE.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-clinical.yml/runs?per_page=100" > "$RUNNER_TEMP/clinical-before-sources.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-report.yml/runs?per_page=100" > "$RUNNER_TEMP/publisher-before-sources.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-missing-sources.yml/runs?per_page=100" > "$RUNNER_TEMP/extended-before-sources.json"
          python - "$RUNNER_TEMP/clinical-before-sources.json" "$RUNNER_TEMP/publisher-before-sources.json" "$RUNNER_TEMP/extended-before-sources.json" "$RUNNER_TEMP/extended-source-request" <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          la = now.astimezone(ZoneInfo("America/Los_Angeles"))
          if not (21 <= la.hour < 23):
              print("Extended-source recovery is limited to 9-11 PM Pacific")
              raise SystemExit(0)
          night_start = la.replace(hour=20, minute=30, second=0, microsecond=0).astimezone(timezone.utc)

          def runs(index):
              with open(sys.argv[index], encoding="utf-8") as handle:
                  return json.load(handle).get("workflow_runs", [])

          def moment(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          clinical = [r for r in runs(1) if r.get("event") == "workflow_dispatch"
                      and r.get("created_at") and night_start <= moment(r["created_at"]) <= now]
          if not clinical:
              print("No nightly clinical run; skip extended-source recovery")
              raise SystemExit(0)
          latest_clinical = max(clinical, key=lambda r: r["created_at"])
          if latest_clinical.get("status") != "completed" or latest_clinical.get("conclusion") != "success":
              print("Clinical job is not successful; skip downstream recovery")
              raise SystemExit(0)
          publishers = [r for r in runs(2) if r.get("created_at")
                        and moment(r["created_at"]) >= moment(latest_clinical["updated_at"])]
          if not publishers:
              print("No publisher run exists after completed clinical scan")
              raise SystemExit(0)
          publisher = max(publishers, key=lambda r: r["created_at"])
          if publisher.get("status") != "completed" or publisher.get("conclusion") != "success":
              print("Report publishing not successful; skip extended-source recovery")
              raise SystemExit(0)
          finished = moment(publisher["updated_at"])
          if now - finished < timedelta(minutes=2):
              print("Allowing standard report-to-extended workflow_run trigger")
              raise SystemExit(0)
          existing = [r for r in runs(3) if r.get("created_at")
                      and moment(r["created_at"]) >= moment(publisher["created_at"])]
          if existing:
              print("Extended verification run already exists; skip duplicate")
              raise SystemExit(0)
          Path(sys.argv[4]).write_text(str(publisher["id"]), encoding="utf-8")
          print("Missing publisher-to-extended handoff after publisher run " + str(publisher["id"]))
          PY
          if [ -s "$RUNNER_TEMP/extended-source-request" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-missing-sources.yml/dispatches" \
              -f ref=main
            echo "Requested FDA, SEC, financial, market, issuer, and coverage reconciliation."
            echo "Dispatch does not establish source verification or completion."
          fi
