name: PDUFA Daily 8:00 PM Pacific Start

# One clock dispatches the WHOLE awaited chain. Recovery slots can start a
# missed night; a recorded or active full chain prevents duplicate dispatch.
# 2026-10-15 22:06 Pacific: operator-requested kickoff through the existing push guard.
# 2026-10-17 22:06 Pacific: operator-requested kickoff using the same guarded push entrypoint.
# 2026-10-18: manually requested Sunday FULL / RESCAN_ALL kickoff through its guarded push entrypoint.
on:
  schedule:
    - cron: '0 3 * * *'   # 8:00 PM PDT
    - cron: '15 3 * * *'
    - cron: '30 3 * * *'
    - cron: '0 4 * * *'   # 8:00 PM PST
    - cron: '15 4 * * *'
    - cron: '30 4 * * *'
    - cron: '5 7 * * *'
    - cron: '35 7 * * *'
    - cron: '5 8 * * *'
    - cron: '35 8 * * *'
    - cron: '5 9 * * *'
    - cron: '35 9 * * *'
    # Five independent recovery opportunities per hour, offset from busy :00.
    # The admission script is timezone/DST aware and prevents a second nightly
    # chain when one has already started; repeated ticks are otherwise no-ops.
    - cron: '3-53/10 3-10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-nightly-pacific-start.yml']

permissions:
  actions: write
  contents: read

concurrency:
  group: pdufa-nightly-pacific-start
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start one complete serial daily scan chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Pacific slot and existing full overnight runs
        id: pacific
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-overnight-sequential.yml/runs?branch=main&per_page=100" > "$RUNNER_TEMP/overnight-runs.json"
          python scripts/nightly_start.py --event "$EVENT_NAME" --cron "$SCHEDULE_CRON" \
            --runs-json "$RUNNER_TEMP/overnight-runs.json" --output "$GITHUB_OUTPUT"
      - name: Validate one-time manual recovery from failed pre-scan validation
        id: manual_recovery
        if: github.event_name == 'push' && github.event.head_commit.message == 'Recover Sunday 2026-10-18 full scan after fixing clock admission tests'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39200392037" > "$RUNNER_TEMP/manual-failed-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39200392037/jobs?per_page=100" > "$RUNNER_TEMP/manual-failed-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-overnight-sequential.yml/runs?branch=main&per_page=100" > "$RUNNER_TEMP/manual-all-runs.json"
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          failed=json.loads((root/'manual-failed-run.json').read_text())
          jobs=json.loads((root/'manual-failed-jobs.json').read_text())['jobs']
          runs=json.loads((root/'manual-all-runs.json').read_text())['workflow_runs']
          assert failed['id']==39200392037 and failed['event']=='workflow_dispatch'
          assert failed['head_branch']=='main' and failed['status']=='completed' and failed['conclusion']=='failure'
          assert failed['display_title']=='ALL + GEM — PDUFA overnight'
          job_results={job['name']:job['conclusion'] for job in jobs}
          assert job_results.get('validate')=='failure'
          assert all(job_results.get(name)=='skipped' for name in
                     ('clinical','report','sources','scoring-and-repair'))
          start=datetime.fromisoformat('2026-10-19T04:00:00+00:00')
          for run in runs:
              if run['id']==failed['id'] or run.get('event')!='workflow_dispatch' or run.get('head_branch')!='main':
                  continue
              created=datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))
              assert created<start, 'A second full night run already exists; recovery aborted'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              print('run=true',file=out)
          print('Verified pre-scan-only failure and no duplicate; allow a single Sunday FULL recovery')
          PY
      - name: Validate one-time October 20 pre-scan recovery
        id: validation_recovery
        if: github.event_name == 'push' && github.event.head_commit.message == 'Recover October 20 8PM scan after fixing workflow label assertion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39537943917" > "$RUNNER_TEMP/failed-validation-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39537943917/jobs?per_page=100" > "$RUNNER_TEMP/failed-validation-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-overnight-sequential.yml/runs?branch=main&per_page=100" > "$RUNNER_TEMP/recovery-all-runs.json"
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          failed = json.loads((root/'failed-validation-run.json').read_text())
          jobs = json.loads((root/'failed-validation-jobs.json').read_text())['jobs']
          runs = json.loads((root/'recovery-all-runs.json').read_text())['workflow_runs']
          assert failed['id'] == 39537943917
          assert failed['event'] == 'workflow_dispatch' and failed['head_branch'] == 'main'
          assert failed['path'].split('@',1)[0] == '.github/workflows/pdufa-overnight-sequential.yml'
          assert failed['display_title'] == 'ALL + GEM — PDUFA overnight'
          assert failed['status'] == 'completed' and failed['conclusion'] == 'failure'
          results = {job['name']: job['conclusion'] for job in jobs}
          assert results.get('validate') == 'failure', 'Expected pre-scan validation failure'
          for name in ('clinical','report','sources','scoring-and-repair'):
              assert results.get(name) == 'skipped', f'Collection reached {name}; abort recovery'
          start = datetime.fromisoformat('2026-10-21T03:00:00+00:00')
          for run in runs:
              if run['id'] == failed['id'] or run.get('event') != 'workflow_dispatch' or run.get('head_branch') != 'main':
                  continue
              if run.get('display_title') != 'ALL + GEM — PDUFA overnight':
                  continue
              created = datetime.fromisoformat(run['created_at'].replace('Z','+00:00'))
              assert created < start, f'Another overnight run {run["id"]} exists for tonight; abort'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              print('run=true',file=out)
          print('Verified no collection ran and no duplicate tonight; allow one DELTA recovery')
          PY

      - name: Dispatch the entire awaited sequence
        id: full_scan_dispatch
        if: steps.pacific.outputs.run == 'true' || steps.manual_recovery.outputs.run == 'true' || steps.validation_recovery.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-overnight-sequential.yml/dispatches" \
            -f ref=main -f "inputs[scan_mode]=${{ steps.manual_recovery.outputs.run == 'true' && 'FULL' || steps.validation_recovery.outputs.run == 'true' && 'DELTA' || steps.pacific.outputs.scan_mode }}" \
            -f "inputs[night_date_pacific]=${{ steps.pacific.outputs.night_date_pacific }}"
          echo "Requested POOL, Pipeline, Phase 3 results, source, scoring, error-check and repair stages in ONE awaited workflow."
          echo "Dispatch acceptance is not completion; inspect PDUFA Overnight Sequential Scans."
# Operator-requested guarded start: 2026-10-19 21:23 America/Los_Angeles (Monday DELTA clinical source collection).

      - name: Show whether nightly scanning actually started
        if: always()
        env:
          START_GUARD: ${{ steps.pacific.outputs.run }}
          GUARD_REASON: ${{ steps.pacific.outputs.reason }}
          NIGHT_DATE: ${{ steps.pacific.outputs.night_date_pacific }}
          DISPATCH_OUTCOME: ${{ steps.full_scan_dispatch.outcome }}
        run: |
          {
            echo "### Overnight scan start — separate from scheduler success"
            echo "- Pacific night: ${NIGHT_DATE:-UNKNOWN}"
            if [[ "$DISPATCH_OUTCOME" == "success" ]]; then
              echo "- Result: **DISPATCH REQUESTED** — see the separate PDUFA Overnight Sequential Scans workflow to confirm collection."
            elif [[ "$DISPATCH_OUTCOME" == "failure" ]]; then
              echo "- Result: **DISPATCH FAILED** — overnight scans were not started."
            else
              echo "- Result: **NO DISPATCH** — a green scheduler job alone is not a completed scan."
            fi
            echo "- Admission decision: ${GUARD_REASON:-UNAVAILABLE}"
            echo "- Duplicate safety: once per Pacific night; previous recorded full scan blocks a second."
          } >> "$GITHUB_STEP_SUMMARY"
# Operator-requested guarded kickoff of missed 2026-10-21 Pacific 8 PM scan; duplicate gate remains authoritative.
# Operator-requested guarded kickoff of missing 2026-10-22 Pacific 8 PM scan; preserve existing no-duplicate admission.

