name: PDUFA Daily 10:00 PM Pacific Start

# One clock dispatches the WHOLE awaited chain. Recovery slots can start a
# missed night; a recorded or active full chain prevents duplicate dispatch.
on:
  schedule:
    - cron: '0 5 * * *'   # 10:00 PM PDT
    - cron: '15 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'   # 10:00 PM PST
    - cron: '15 6 * * *'
    - cron: '30 6 * * *'
    - cron: '5 7 * * *'
    - cron: '35 7 * * *'
    - cron: '5 8 * * *'
    - cron: '35 8 * * *'
    - cron: '5 9 * * *'
    - cron: '35 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-nightly-pacific-start.yml']

permissions:
  actions: write
  contents: read

concurrency:
  group: pdufa-nightly-pacific-start
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start one complete serial daily scan chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Pacific slot and existing full overnight runs
        id: pacific
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-overnight-sequential.yml/runs?branch=main&per_page=100" > "$RUNNER_TEMP/overnight-runs.json"
          python scripts/nightly_start.py --event "$EVENT_NAME" --cron "$SCHEDULE_CRON" \
            --runs-json "$RUNNER_TEMP/overnight-runs.json" --output "$GITHUB_OUTPUT"
      - name: Dispatch the entire awaited sequence
        if: steps.pacific.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-overnight-sequential.yml/dispatches" \
            -f ref=main -f "scan_mode=${{ steps.pacific.outputs.scan_mode }}" \
            -f "gem_action=${{ steps.pacific.outputs.gem_action }}"
          echo "Requested ALL clinical, GEM, source, scoring, error-check and repair stages in ONE awaited workflow."
          echo "Dispatch acceptance is not completion; inspect PDUFA Overnight Sequential Scans."
