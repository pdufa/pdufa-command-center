name: MAIN ACACIA public evidence checkpoint (read only)

# GitHub schedules execute only on default branch (main).
# Default-branch push tests and nightly schedule run ONLY this public evidence monitor.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/main-acacia-public-evidence-nightly.yml
      - scripts/medical/acacia_nightly_evidence_monitor.py
      - tests/test_acacia_nightly_evidence_monitor.py
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"
      timezone: "America/Los_Angeles"
permissions:
  contents: read
  actions: read
concurrency:
  group: acacia-research-receipt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-evidence-checkpoint:
    if: ${{ github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline policy and source integrity tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/medical/acacia_nightly_evidence_monitor.py
          python3 -m unittest discover -s tests -p test_acacia_nightly_evidence_monitor.py -v
      - name: Retrieve previous branch-only checkpoint for comparison
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous acacia-evidence-monitor
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main-acacia-public-evidence-nightly.yml --branch "$GITHUB_REF_NAME" --status success --limit 5 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
          if [[ -n "$run" ]] && gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'acacia-public-evidence-checkpoint-*' --dir previous >/dev/null 2>&1; then
            file="$(find previous -type f -name receipt.json -print -quit)"
            if [[ -n "$file" ]]; then
              echo "file=$file" >> "$GITHUB_OUTPUT"
              echo "Prior checkpoint available."
            fi
          fi
      - name: Capture bounded public-only registry and publication source receipts
        shell: bash
        timeout-minutes: 3
        env:
          PRIOR_FILE: ${{ steps.previous.outputs.file }}
        run: |
          set -euo pipefail
          if [[ -n "${PRIOR_FILE:-}" && -f "$PRIOR_FILE" ]]; then
            python3 scripts/medical/acacia_nightly_evidence_monitor.py --previous "$PRIOR_FILE" --output acacia-evidence-monitor/receipt.json
          else
            python3 scripts/medical/acacia_nightly_evidence_monitor.py --output acacia-evidence-monitor/receipt.json
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path("acacia-evidence-monitor/receipt.json").read_text())
          lines=["## ACACIA exact-NCT research receipt",
            "Status: "+data["status"],"Previous: "+data["historyStatus"],
            "Source identities: "+", ".join(x["sourceId"]+"="+x["status"] for x in data["sources"]),
            "Research leads: "+(", ".join(data["newResearchCandidates"]) or "none"),
            "Changed sources: "+(", ".join(data["sourceChangesSincePrevious"]) or "none confirmed"),
            "Documentary points: 5.1=3/5, 4.2=3/5, 5.3=2/5 (not clinical grades)",
            "FDA prediction: ABSTAIN; official clinical grades: 0",
            "Receipt SHA-256: "+data["receiptSha256"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("\n".join(lines)+"\n")
          PY
      - name: Archive check receipt for 90 days even if upstream is unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acacia-public-evidence-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: acacia-evidence-monitor/receipt.json
          retention-days: 90
          if-no-files-found: warn
