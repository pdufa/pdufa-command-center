name: Selected NCT Scientific Archive Review
on:
  push:
    branches:
      - feature/science-selected-archive-dossier-20261024
  pull_request:
    branches:
      - feature/scientific-assessment-v1
permissions:
  contents: read
jobs:
  frontend:
    name: Selected NCT source-only viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile check frontend
        run: npm run typecheck
      - name: Verify selected NCT source-only evidence and no-score guarantees
        run: node --test tests/science-archive-selected.test.cjs tests/trial-science-pilot.test.cjs
  backend:
    name: Existing authenticated dossier contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r new-platform/backend/requirements.txt
      - name: Verify archive identity, corruption and authenticated endpoint
        env:
          PYTHONPATH: new-platform/backend
        run: |
          python -m unittest discover -s new-platform/backend/tests -p 'test_scientific_dossier.py' -v
          python -m unittest discover -s new-platform/backend/tests -p 'test_scientific_dossier_archive.py' -v
          python -m unittest discover -s new-platform/backend/tests -p 'test_scientific_dossier_http.py' -v
