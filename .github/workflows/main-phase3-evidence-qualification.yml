name: MAIN Phase 3 evidence-to-qualification ledger
on:
  workflow_dispatch:
  # GitHub cron is UTC. DST gate runs only the 8 PM Pacific nominal slot.
  schedule:
    - cron: '0 3 * * *'  # 8 PM PDT (7 PM PST is intentionally skipped)
    - cron: '0 4 * * *'  # 8 PM PST (9 PM PDT is intentionally skipped)
  pull_request:
    paths:
      - 'scripts/check_phase3_full_original_sources.py'
      - 'scripts/check_phase3_original_registry_pilot.py'
      - 'tests/test_phase3_original_registry_pilot.py'
      - 'scripts/phase3_trial_program_identity.py'
      - 'scripts/phase3_sec_trial_rights_join.py'
      - 'tests/test_phase3_sec_trial_rights_join.py'
      - 'tests/test_phase3_trial_program_identity.py'
      - 'scripts/phase3_qualification_ledger.py'
      - 'scripts/phase3_evidence_intake.py'
      - 'tests/test_phase3_evidence_intake.py'
      - 'tests/test_phase3_evidence_intake_security.py'
      - 'scripts/phase3_gate_coverage.py'
      - 'tests/test_phase3_gate_coverage.py'
      - 'scripts/phase3_sponsor_rights_triage.py'
      - 'tests/test_phase3_sponsor_rights_triage.py'
      - 'scripts/phase3_rights_casebook.py'
      - 'tests/test_phase3_rights_casebook.py'
      - 'scripts/phase3_sec_rights_discovery.py'
      - 'tests/test_phase3_sec_rights_discovery.py'
      - 'scripts/phase3_sec_rights_documents_pilot.py'
      - 'tests/test_phase3_sec_rights_documents_pilot.py'
      - 'tests/test_phase3_sec_rights_documents_pilot_locators.py'
      - 'scripts/phase3_sec_exact_term_leads.py'
      - 'tests/test_phase3_sec_exact_term_leads.py'
      - 'scripts/phase3_rights_review_worklist.py'
      - 'tests/test_phase3_rights_review_worklist.py'
      - 'scripts/phase3_rights_review_submissions.py'
      - 'tests/test_phase3_rights_review_submissions.py'
      - 'scripts/phase3_qualification_scorecard.py'
      - 'scripts/phase3_nightly_pacific_gate.py'
      - 'tests/test_phase3_nightly_pacific_gate.py'
      - 'tests/test_phase3_qualification_scorecard.py'
      - 'scripts/phase3_nightly_artifact_integrity.py'
      - 'tests/test_phase3_nightly_artifact_integrity.py'
      - 'data/phase3_rights_review_submissions.json'
      - 'scripts/build_phase3_rights_evidence_gaps.py'
      - 'tests/test_phase3_evidence_boundaries.py'
      - '.github/workflows/main-phase3-evidence-qualification.yml'
      - 'data/phase3_all_years_300m_10b_trials.csv'
permissions:
  contents: read
jobs:
  pacific-nightly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.pacific-time.outputs.proceed }}
      pacific_date: ${{ steps.pacific-time.outputs.pacific_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Pacific DST scheduling guard
        run: python3 -m unittest discover -s tests -p test_phase3_nightly_pacific_gate.py -v
      - name: Select nominal 8 PM Pacific source refresh
        id: pacific-time
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 scripts/phase3_nightly_pacific_gate.py \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
  research-ledger:
    needs: pacific-nightly-gate
    if: needs.pacific-nightly-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scripts and tests
        run: |
          python3 -m py_compile scripts/check_phase3_full_original_sources.py scripts/phase3_qualification_ledger.py scripts/phase3_evidence_intake.py scripts/phase3_rights_casebook.py scripts/build_phase3_rights_evidence_gaps.py scripts/phase3_sec_rights_documents_pilot.py scripts/phase3_sec_exact_term_leads.py scripts/phase3_rights_review_worklist.py scripts/phase3_rights_review_submissions.py scripts/phase3_qualification_scorecard.py scripts/phase3_nightly_artifact_integrity.py scripts/phase3_trial_program_identity.py scripts/phase3_sec_trial_rights_join.py scripts/check_phase3_original_registry_pilot.py
          python3 -m unittest discover -s tests -p test_phase3_original_registry_pilot.py -v
          python3 -m unittest discover -s tests -p test_phase3_trial_program_identity.py -v
          python3 -m unittest discover -s tests -p test_phase3_sec_trial_rights_join.py -v
          python3 -m unittest discover -s tests -p test_phase3_qualification_ledger.py -v
          python3 -m unittest discover -s tests -p 'test_phase3_evidence_intake*.py' -v
          python3 -m unittest discover -s tests -p test_phase3_gate_coverage.py -v
          python3 -m unittest discover -s tests -p test_phase3_sponsor_rights_triage.py -v
          python3 -m unittest discover -s tests -p test_phase3_rights_casebook.py -v
          python3 -m unittest discover -s tests -p test_phase3_sec_rights_discovery.py -v
          python3 -m unittest discover -s tests -p 'test_phase3_sec_rights_documents_pilot*.py' -v
          python3 -m unittest discover -s tests -p test_phase3_sec_exact_term_leads.py -v
          python3 -m unittest discover -s tests -p test_phase3_rights_review_worklist.py -v
          python3 -m unittest discover -s tests -p test_phase3_rights_review_submissions.py -v
          python3 -m unittest discover -s tests -p test_phase3_qualification_scorecard.py -v
          python3 -m unittest discover -s tests -p test_phase3_nightly_artifact_integrity.py -v
          python3 -m unittest discover -s tests -p test_phase3_evidence_boundaries.py -v
      - name: Retrieve original 741-study evidence
        run: python3 scripts/check_phase3_full_original_sources.py "$RUNNER_TEMP/main_phase3_registry.json"
      - name: Produce fail-closed per-NCT qualification ledger
        run: python3 scripts/phase3_qualification_ledger.py "$RUNNER_TEMP/main_phase3_registry.json" "$RUNNER_TEMP/main_phase3_qualification_ledger.json"
      - name: Build sponsor and rights review queue
        run: python3 scripts/phase3_sponsor_rights_triage.py "$RUNNER_TEMP/main_phase3_qualification_ledger.json" "$RUNNER_TEMP/main_phase3_registry.json" "$RUNNER_TEMP/main_phase3_sponsor_rights_queue.json"
      - name: Build saved rights and SEC issuer research pointers
        run: python3 scripts/build_phase3_rights_evidence_gaps.py "$RUNNER_TEMP/main_phase3_rights_gaps.json"
      - name: Reconcile original sponsor sources and 130 SEC issuer pointers
        run: python3 scripts/phase3_rights_casebook.py "$RUNNER_TEMP/main_phase3_qualification_ledger.json" "$RUNNER_TEMP/main_phase3_registry.json" "$RUNNER_TEMP/main_phase3_sponsor_rights_queue.json" "$RUNNER_TEMP/main_phase3_rights_gaps.json" "$RUNNER_TEMP/main_phase3_rights_casebook.json"
      - name: Preserve original Phase 3 drug and indication terms for all 741 NCT records
        run: python3 scripts/phase3_trial_program_identity.py "$RUNNER_TEMP/main_phase3_registry.json" "$RUNNER_TEMP/main_phase3_rights_casebook.json" "$RUNNER_TEMP/main_phase3_program_identity.json"
      - name: Discover primary SEC filing metadata for 130 research issuers
        run: python3 scripts/phase3_sec_rights_discovery.py "$RUNNER_TEMP/main_phase3_rights_casebook.json" "$RUNNER_TEMP/main_phase3_sec_rights_leads.json"
      - name: Fetch SEC primary documents from source-linked filing leads (pilot)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 scripts/phase3_sec_rights_documents_pilot.py "$RUNNER_TEMP/main_phase3_rights_casebook.json" "$RUNNER_TEMP/main_phase3_sec_rights_leads.json"  "$RUNNER_TEMP/main_phase3_sec_primary_documents_pilot.json" --max-issuers 10 --program "$RUNNER_TEMP/main_phase3_program_identity.json"
      - name: Join exact NCT programs to issuer SEC filing and document review
        run: python3 scripts/phase3_sec_trial_rights_join.py "$RUNNER_TEMP/main_phase3_program_identity.json" "$RUNNER_TEMP/main_phase3_rights_casebook.json" "$RUNNER_TEMP/main_phase3_sec_rights_leads.json" "$RUNNER_TEMP/main_phase3_sec_primary_documents_pilot.json" "$RUNNER_TEMP/main_phase3_sec_trial_rights_join.json"
      - name: Build original-source linked commercial-rights trial review worklist
        run: python3 scripts/phase3_rights_review_worklist.py "$RUNNER_TEMP/main_phase3_registry.json" "$RUNNER_TEMP/main_phase3_qualification_ledger.json" "$RUNNER_TEMP/main_phase3_rights_casebook.json" "$RUNNER_TEMP/main_phase3_sec_rights_leads.json" "$RUNNER_TEMP/main_phase3_sec_trial_rights_join.json" "$RUNNER_TEMP/main_phase3_rights_review_worklist.json" --csv "$RUNNER_TEMP/main_phase3_rights_review_worklist.csv"
      - name: Validate reviewer-source submissions against all six rights checks per trial
        run: python3 scripts/phase3_rights_review_submissions.py "$RUNNER_TEMP/main_phase3_rights_review_worklist.json" data/phase3_rights_review_submissions.json "$RUNNER_TEMP/main_phase3_rights_review_submissions_coverage.json"
      - name: Generate nine-gate progress scorecard with exact denominators
        run: |
          python3 scripts/phase3_qualification_scorecard.py "$RUNNER_TEMP/main_phase3_qualification_ledger.json" "$RUNNER_TEMP/main_phase3_program_identity.json" "$RUNNER_TEMP/main_phase3_sec_rights_leads.json" "$RUNNER_TEMP/main_phase3_sec_primary_documents_pilot.json" "$RUNNER_TEMP/main_phase3_rights_review_worklist.json" "$RUNNER_TEMP/main_phase3_rights_review_submissions_coverage.json" "$RUNNER_TEMP/main_phase3_qualification_scorecard.json" "$RUNNER_TEMP/main_phase3_qualification_summary.md"
          cat "$RUNNER_TEMP/main_phase3_qualification_summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile 14 complete source reports and create SHA256 artifact manifest
        env:
          PACIFIC_RESEARCH_DATE: ${{ needs.pacific-nightly-gate.outputs.pacific_date }}
        run: |
          python3 scripts/phase3_nightly_artifact_integrity.py "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/main_phase3_run_integrity_manifest.json" \
            --event-name "$GITHUB_EVENT_NAME" \
            --pacific-date "$PACIFIC_RESEARCH_DATE" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-sha "$GITHUB_SHA"
          echo "Source artifact integrity manifest created and verified for this exact run." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve research-only evidence and ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-phase3-evidence-qualification-research-only
          path: |
            ${{ runner.temp }}/main_phase3_registry.json
            ${{ runner.temp }}/main_phase3_qualification_ledger.json
            ${{ runner.temp }}/main_phase3_sponsor_rights_queue.json
            ${{ runner.temp }}/main_phase3_rights_gaps.json
            ${{ runner.temp }}/main_phase3_rights_casebook.json
            ${{ runner.temp }}/main_phase3_program_identity.json
            ${{ runner.temp }}/main_phase3_sec_rights_leads.json
            ${{ runner.temp }}/main_phase3_sec_primary_documents_pilot.json
            ${{ runner.temp }}/main_phase3_sec_trial_rights_join.json
            ${{ runner.temp }}/main_phase3_rights_review_worklist.json
            ${{ runner.temp }}/main_phase3_rights_review_worklist.csv
            ${{ runner.temp }}/main_phase3_rights_review_submissions_coverage.json
            ${{ runner.temp }}/main_phase3_qualification_scorecard.json
            ${{ runner.temp }}/main_phase3_qualification_summary.md
            ${{ runner.temp }}/main_phase3_run_integrity_manifest.json
          if-no-files-found: warn
          retention-days: 30
