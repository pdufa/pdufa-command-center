name: PDUFA Installation Production Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/app/api/installation-audit/**'
      - 'new-platform/frontend/app/installation-audit/**'
      - 'new-platform/frontend/app/pool/**'
      - 'new-platform/frontend/app/pipeline/**'
      - 'new-platform/frontend/app/patient-population/**'
      - 'new-platform/frontend/app/goal/**'
      - 'new-platform/frontend/app/scans/**'
      - 'new-platform/frontend/app/results/**'
      - 'new-platform/frontend/app/restrictions/**'
      - 'new-platform/frontend/app/predictions/**'
      - 'new-platform/frontend/app/api/scope-funnel/**'
      - 'new-platform/frontend/public/installation-audit/**'
      - '.github/workflows/pdufa-installation-smoke.yml'
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production deployment and installation API
        env:
          SITE: https://pdufa-new-dashboard.vercel.app
        run: |
          python3 - <<'PY'

          import html,json,os,urllib.request,urllib.error,urllib.parse
          base=os.environ["SITE"].rstrip("/")
          host=urllib.parse.urlsplit(base).hostname
          routes={
              "/":"PDUFA Command Center",
              "/pool":"Master Trial Universe",
              "/pipeline":"Post",
              "/patient-population":"Patient Population",
              "/goal":"GOAL",
              "/scans":"SCANS",
              "/results":"RESULTS",
              "/restrictions":"RESTRICTIONS",
              "/predictions":"Trial prediction",
          }
          def fetch(path, maxbytes=1600000):
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"pdufa-pool-pipeline-smoke/2","Accept":"text/html,application/json"})
              with urllib.request.urlopen(req,timeout=25) as response:
                  dst=urllib.parse.urlsplit(response.geturl())
                  expected_path="/prediction-pilot" if path=="/predictions" else urllib.parse.urlsplit(url).path
                  if dst.scheme!="https" or dst.hostname!=host or dst.path!=expected_path:
                      raise AssertionError("Unexpected redirect for "+path)
                  if response.status!=200: raise AssertionError(path+" returned "+str(response.status))
                  body=response.read(maxbytes+1)
                  if len(body)>maxbytes: raise AssertionError(path+" response too large")
                  return response.headers.get("content-type","").lower(),body
          for path,marker in routes.items():
              content_type,body=fetch(path)
              if "text/html" not in content_type: raise AssertionError("Wrong content type for "+path)
              document=html.unescape(body.decode("utf-8",errors="replace"))
              if marker.lower() not in document.lower(): raise AssertionError("Required page heading missing: "+path)
              print("PASS: public page",path,"HTTP 200, expected heading")
          content_type,body=fetch("/api/auth",128000)
          if "application/json" not in content_type: raise AssertionError("Auth status is not JSON")
          auth=json.loads(body)
          if auth!={"authenticated":False}: raise AssertionError("Anonymous auth status unavailable or inconsistent")
          print("PASS: authentication configured, unauthenticated session reported")
          for path in ("/api/scope-funnel?view=pool&limit=1","/api/site-health","/api/assessments","/api/hop/readiness"):
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"pdufa-pool-pipeline-smoke/2","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      raise AssertionError("Private API exposed anonymously: "+path+" HTTP "+str(response.status))
              except urllib.error.HTTPError as err:
                  if err.code!=401: raise AssertionError(path+" refused with unexpected HTTP "+str(err.code))
                  payload=json.loads(err.read(128000))
                  if payload!={"error":"Authentication required"}: raise AssertionError(path+" leaked or changed anonymous response")
              print("PASS: private API denies anonymous access",path,"HTTP 401")
          content_type,body=fetch("/api/installation-audit/live-task-evidence",5000000)
          if "application/json" not in content_type: raise AssertionError("Audit API is not JSON")
          payload=json.loads(body)
          assert payload.get("taskCount")==546, "Task inventory mismatch"
          assert len(payload.get("tasks",{}))==546, "Missing task evidence"
          assert sum(payload.get("counts",{}).values())==546, "Status count mismatch"
          assert payload.get("verifiedCount")==payload["counts"].get("Verified",0), "Verified count mismatch"
          assert payload.get("automatedAcceptanceCoverage")==0, "Connectivity must not falsely certify acceptance"
          required={"dashboard","scanHealth","backendDatabase","predictionSafety","scienceReadiness","statisticalConsistency"}
          checks=payload.get("checks",{})
          assert isinstance(checks,dict) and required.issubset(checks), "Required live probes missing"
          for name in sorted(required):
              check=checks[name]
              print("Observed health probe:",name,check.get("status"),check.get("httpStatus"))
          print("PASS: active POOL/Pipeline public routes, privacy controls, and non-certifying legacy evidence API schema")
          print("NOTE: Anonymous smoke does NOT verify authenticated data rows, scan launches, backend storage restore or independently hosted Streamlit Cloud.")
          PY

      - name: Verify Render backend and PostgreSQL storage readiness
        env:
          HEALTH_URL: https://pdufa-new-api-staging.onrender.com/health
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url=os.environ["HEALTH_URL"]
          for attempt in range(1,5):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"pdufa-backend-readiness-smoke/1","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=28) as response:
                      if response.status!=200: raise RuntimeError("Health HTTP "+str(response.status))
                      payload=json.load(response)
                  expected=payload.get("service")=="pdufa-new-backend" and payload.get("status")=="ok" and payload.get("storage_ready") is True
                  if not expected: raise RuntimeError("Service did not affirm healthy persistent storage")
                  print("PASS: independently verified Render backend and persistent PostgreSQL readiness on attempt",attempt)
                  break
              except Exception as err:
                  if attempt==4: raise SystemExit("FAIL: backend/storage readiness not verified after retries: "+str(err))
                  print("Backend waking or unavailable, retrying attempt",attempt+1,type(err).__name__)
                  time.sleep(15)
          PY

      - name: Verify signed-in POOL Pipeline reconciliation
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SITE: https://pdufa-new-dashboard.vercel.app
        run: |
          python3 - <<'PY'
          import http.cookiejar,json,os,time,urllib.error,urllib.request
          base=os.environ["SITE"].rstrip("/")
          password=os.environ.get("DASHBOARD_PASSWORD")
          if not password:
              raise SystemExit("BLOCKED: authorized dashboard password Actions secret missing; do not mark auth acceptance.")
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def request(path,method="GET",payload=None,timeout=65):
              headers={"Accept":"application/json","User-Agent":"pdufa-private-scope-smoke/1"}
              body=None
              if payload is not None:
                  headers["Origin"]=base
                  headers["Content-Type"]="application/json"
                  body=json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=body,headers=headers,method=method)
              try:
                  with opener.open(req,timeout=timeout) as response:
                      status=response.status
                      content_type=response.headers.get("Content-Type","")
                      raw=response.read(3_000_001)
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  content_type=exc.headers.get("Content-Type","")
                  raw=b""
              if len(raw)>3_000_000:
                  raise AssertionError("Scope response size exceeded")
              if status!=200 or "application/json" not in content_type:
                  raise AssertionError(path.split("?")[0]+" returned status="+str(status)+" expected=200")
              return json.loads(raw)
          session=request("/api/auth","POST",{"password":password},30)
          assert session=={"authenticated":True},"Password login did not create an authenticated session"
          assert request("/api/auth")=={"authenticated":True},"Auth cookie not retained"
          print("PASS: normal production login and authenticated session")
          pages={}
          for view in ("pool","pipeline","readout-review"):
              uri="/api/scope-funnel?view="+view+"&offset=0&limit=10"
              for attempt in range(1,4):
                  try:
                      data=request(uri)
                      break
                  except AssertionError:
                      if attempt==3: raise
                      print("Retrying signed-in",view,"after transient status; no source rows logged",attempt)
                      time.sleep(6)
              assert data.get("view")==view and isinstance(data.get("total"),int) and data["total"]>=0
              assert isinstance(data.get("rows"),list) and len(data["rows"])<=10
              assert data.get("qualifiedProgramCount") is None and data.get("overview",{}).get("qualifiedPrograms") is None
              pages[view]=data
              print("PASS:",view,"authenticated rows available; candidate qualification remains unverified")
          assert pages["pool"]["total"]>0,"Master POOL returned no records"
          assert (pages["pipeline"]["total"]+pages["readout-review"]["total"]
                  ==pages["pool"]["overview"]["historicalPhase3Records"]),"Phase 3 research queue totals differ"
          assert all(x.get("qualification")=="NEEDS_REVIEW" and x.get("poolStatus")=="EXACT_MATCH"
                     and x.get("censusStatus")=="COMPLETED" for x in pages["pipeline"]["rows"])
          print("PASS: signed-in POOL and Phase 3 research queue integrity; no invented qualified count")
          print("NOTE: This is a read-only data API check, not browser controls, current cap verification, scan execution, Streamlit Cloud deletion, or validated FDA predictions.")
          PY
