name: PDUFA Next.js Frontend Checks

on:
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/**'
      - '.github/workflows/pdufa-nextjs-main-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'new-platform/frontend/**'
      - '.github/workflows/pdufa-nextjs-main-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: UI and count parity regression tests
        run: npm test
      - name: Next.js production build
        run: npm run build
