name: Assess all 730 Phase 3 trials
on:
  push:
    paths:
      - 'scripts/assess_730_phase3.py'
      - '.github/workflows/assess-730-phase3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/assess_730_phase3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase3_730_full_assessment.csv data/phase3_730_full_assessment_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish all 730 Phase 3 assessments"
          git pull --rebase origin main
          git push origin HEAD:main
