name: DECISION research checks
on:
  pull_request:
    paths:
      - 'new-platform/frontend/lib/decision-*.ts'
      - 'new-platform/frontend/tests/decision-*.test.cjs'
      - 'new-platform/frontend/app/DecisionWorkstream.tsx'
      - 'new-platform/frontend/app/CandidateAssessments.tsx'
      - 'new-platform/frontend/app/api/decision-fda-research/route.ts'
      - 'new-platform/frontend/app/api/decision-evidence/**'
      - 'new-platform/frontend/lib/research-readiness.ts'
      - 'new-platform/frontend/lib/science-outcome-gates.ts'
      - 'new-platform/frontend/lib/hop-readiness.ts'
      - 'new-platform/frontend/package*.json'
      - '.github/workflows/decision-research-checks.yml'
  workflow_dispatch:
jobs:
  decision-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - run: npm ci
      - name: Frontend regression tests including DECISION and restriction associations
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
