name: PDUFA Reverify 45 Primary Evidence Gaps 2026-10-14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-reverify-45-primary-20261014.yml']
permissions:
  contents: write
jobs:
  reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
      PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
      PDUFA_ALERT_EMAIL: ${{ secrets.PDUFA_ALERT_EMAIL }}
      SEC_USER_AGENT: PDUFACommandCenter/1.0 ${{ secrets.PDUFA_GMAIL_USER }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pypdf
      - name: Confirm 45 previously unresolved exact-event claims and source scope
        id: source
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,csv
          from pathlib import Path
          d=json.loads(Path('data/pdufa_source_report.json').read_text())
          with open('data/pdufa_source_review_queue.csv',newline='',encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          assert d['required_findings_unresolved']==len(rows)==45
          print('source_id='+d['latest_run_id'])
          PY
      - name: Send START, independently recheck only 45 unresolved claims, send END
        shell: bash
        run: |
          set +e
          python scripts/run_scan_with_email.py \
            --scan REVIEW45 --mode RECONCILE \
            --status-file reports/targeted_recheck_status.json \
            --audit-dir reports/scan_notifications \
            --timeout-seconds 900 -- \
            python -m scripts.targeted_verification_repair \
              --source-run-id "${{ steps.source.outputs.source_id }}" \
              --scan-report reports/targeted_recheck_status.json
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=json.loads(Path('data/pdufa_targeted_recheck_report.json').read_text())
          with open('data/pdufa_targeted_recheck_results.csv',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==45==d['findings_due']
          assert d['trade_entry_authorized'] is False and d['source_baseline_unchanged'] is True
          print("New claim-level evidence verified:",d['findings_verified'])
          print("Remaining holds:",d['required_findings_unresolved'])
          PY
      - name: Publish new primary-source evidence comparison without changing trade eligibility
        run: |
          set -euo pipefail
          cp data/pdufa_targeted_recheck_report.json "$RUNNER_TEMP/recheck.json"
          cp data/pdufa_targeted_recheck_results.csv "$RUNNER_TEMP/recheck.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B primary-review-publish origin/main
            python - "${{ steps.source.outputs.source_id }}" <<'PY'
          import json,sys
          from pathlib import Path
          if json.loads(Path('data/pdufa_source_report.json').read_text())['latest_run_id']!=sys.argv[1]:
              raise SystemExit("New canonical source published; refuse out-of-order review")
          PY
            cp "$RUNNER_TEMP/recheck.json" data/pdufa_targeted_recheck_report.json
            cp "$RUNNER_TEMP/recheck.csv" data/pdufa_targeted_recheck_results.csv
            git add data/pdufa_targeted_recheck_report.json data/pdufa_targeted_recheck_results.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish all 45 source-backed exact-event rechecks after primary discovery"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-reverify-45-${{ github.run_id }}
          path: |
            reports/targeted_recheck_status.json
            reports/scan_notifications/
            data/pdufa_targeted_recheck_report.json
            data/pdufa_targeted_recheck_results.csv
          retention-days: 30
