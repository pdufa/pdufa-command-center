name: Phase 3 primary endpoint p-values

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-pvalues.yml'
      - 'scripts/phase3_pvalues_intake.py'
  schedule:
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'backfill or daily'
        required: false
        default: 'backfill'

permissions:
  contents: write

concurrency:
  group: phase3-pvalues
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract primary endpoint p-values
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ -f data/phase3_pvalues_status.json ]; then
              MODE=daily
            else
              MODE=backfill
            fi
          fi
          python scripts/phase3_pvalues_intake.py --mode "$MODE"
      - name: Save accumulated p-value evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase3_primary_pvalues.csv data/phase3_pvalues_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Phase 3 primary endpoint p-value evidence"
            git pull --rebase origin main
            git push
          fi
