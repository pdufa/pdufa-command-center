name: Scientific Assessment Verification
on:
  push:
    branches: [feature/scientific-assessment-v1]
    paths:
      - 'scientific_assessment.py'
      - 'scientific_assessment_ui.py'
      - 'tests/test_scientific_assessment.py'
      - 'new-platform/backend/app/scientific_investigation_contract.py'
      - 'new-platform/backend/app/scientific_stage_crosswalk.py'
      - 'new-platform/backend/app/scientific_adjudication_preflight.py'
      - 'new-platform/backend/tests/test_scientific_adjudication_preflight.py'
      - 'new-platform/backend/tests/test_scientific_single_operator.py'
      - 'new-platform/backend/app/scientific_operator_page.py'
      - 'new-platform/backend/tests/test_scientific_operator_page.py'
      - 'new-platform/backend/app/scientific_review_packet.py'
      - 'new-platform/backend/tests/test_scientific_review_packet.py'
      - 'new-platform/backend/app/main.py'
      - 'new-platform/backend/app/scientific_reviewer_ui.py'
      - 'new-platform/backend/app/scientific_reviewer_accounts.py'
      - 'new-platform/backend/tests/test_scientific_reviewer_portal.py'
      - 'new-platform/backend/app/scientific_operator_ui.py'
      - 'new-platform/backend/app/scientific_pilot_source_comparison.py'
      - 'new-platform/backend/tests/test_scientific_pilot_source_comparison.py'
      - 'new-platform/backend/app/scientific_source_documents.py'
      - 'new-platform/backend/app/scientific_official_pdf_fetch.py'
      - 'new-platform/backend/tests/test_scientific_operator_pdf_capture.py'
      - 'new-platform/backend/tests/test_scientific_official_pdf_fetch.py'
      - 'new-platform/backend/tests/test_scientific_pilot_source_comparison.py'
      - 'new-platform/backend/tests/test_scientific_investigation_contract.py'
      - '.github/workflows/scientific-assessment-verification.yml'
  pull_request:
    branches: [main, integration/scientific-assessment-validation-20261025]
    paths:
      - 'scientific_assessment.py'
      - 'scientific_assessment_ui.py'
      - 'tests/test_scientific_assessment.py'
      - 'new-platform/backend/app/scientific_investigation_contract.py'
      - 'new-platform/backend/app/scientific_stage_crosswalk.py'
      - 'new-platform/backend/app/scientific_adjudication_preflight.py'
      - 'new-platform/backend/tests/test_scientific_adjudication_preflight.py'
      - 'new-platform/backend/app/scientific_review_packet.py'
      - 'new-platform/backend/tests/test_scientific_review_packet.py'
      - 'new-platform/backend/app/main.py'
      - 'new-platform/backend/app/scientific_reviewer_ui.py'
      - 'new-platform/backend/app/scientific_reviewer_accounts.py'
      - 'new-platform/backend/tests/test_scientific_reviewer_portal.py'
      - 'new-platform/backend/app/scientific_operator_ui.py'
      - 'new-platform/backend/app/scientific_pilot_source_comparison.py'
      - 'new-platform/backend/tests/test_scientific_pilot_source_comparison.py'
      - 'new-platform/backend/app/scientific_source_documents.py'
      - 'new-platform/backend/app/scientific_official_pdf_fetch.py'
      - 'new-platform/backend/tests/test_scientific_operator_pdf_capture.py'
      - 'new-platform/backend/tests/test_scientific_official_pdf_fetch.py'
      - 'new-platform/backend/tests/test_scientific_investigation_contract.py'
      - '.github/workflows/scientific-assessment-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-assessment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile assessment modules
        run: python -m py_compile scientific_assessment.py scientific_assessment_ui.py
      - name: Run evidence safety regressions
        run: python -m unittest discover -s tests -p 'test_scientific_assessment.py' -v

  scientific-depth-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test requirements
        run: python -m pip install -r new-platform/backend/requirements.txt pytest
      - name: Check eight layers, forty assessments, and deployed API payload contract
        working-directory: new-platform/backend
        run: python -m pytest -q tests/test_scientific_investigation_contract.py tests/test_scientific_review_packet.py tests/test_scientific_adjudication_preflight.py tests/test_scientific_google_identity.py tests/test_scientific_dual_review.py tests/test_scientific_reviewer_accounts.py tests/test_scientific_reviewer_endpoint.py tests/test_scientific_reviewer_portal.py tests/test_scientific_review_submission.py tests/test_scientific_review_audit.py tests/test_scientific_review_pairing.py tests/test_scientific_auth_status.py tests/test_scientific_single_operator.py tests/test_scientific_operator_page.py tests/test_scientific_operator_pdf_capture.py tests/test_scientific_source_documents.py tests/test_scientific_official_pdf_fetch.py

