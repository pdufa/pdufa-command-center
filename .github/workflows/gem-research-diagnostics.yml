name: GEM Optional Research Diagnostics — BPW Coverage

# Explicit opt-in only. This is a capability/coverage research diagnostic,
# NOT one of GEM's seven primary daily survey categories or entry benchmarks.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gem-optional-research-diagnostics
  cancel-in-progress: false

jobs:
  compare:
    name: On-demand BPW-style feature coverage (not performance/PoA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current Pipeline and GEM research evidence
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing report dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate diagnostic calculations
        run: python -m unittest discover -s tests -p 'test_gem_bpw_comparable.py' -v
      - name: Build optional source-coverage diagnostic
        run: python scripts/run_gem_bpw_comparable.py --data-dir data --output-dir reports/gem_diagnostics
      - name: Publish research-only diagnostic, not scan qualifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("data/gem_bpw_comparable.json").read_text())
          assert doc["same_input_score_comparison_performed"] is False
          assert doc["similarity_percentage_supported"] is False
          assert doc["strategy_returns_validated"] is False
          print("BPW feature coverage only; no proprietary predictions or trade authorization")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/gem_bpw_comparable.json
          if git diff --cached --quiet; then
            echo "Diagnostic already current; no source or GEM qualification changes"
            exit 0
          fi
          git commit -m "data: refresh optional GEM BPW research diagnostics"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "::error::Could not publish diagnostic without repository conflict"
          exit 1
      - name: Archive research diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-optional-bpw-diagnostics-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            reports/gem_diagnostics/
            data/gem_bpw_comparable.json
