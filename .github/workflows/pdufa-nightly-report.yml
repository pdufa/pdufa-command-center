name: PDUFA Nightly Scan Report Publisher

on:
  workflow_run:
    workflows: ["PDUFA Nightly Clinical Scans"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed PDUFA Nightly Clinical Scans run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: pdufa-nightly-scan-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Verify archive integrity and publish report
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - name: Checkout current dashboard
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source-validated nightly report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          python scripts/pdufa_scan_audit.py --run-id "$SOURCE_RUN_ID" --out data/nightly_scan_report.json
      - name: Commit Streamlit-visible report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nightly_scan_report.json
          if git diff --cached --quiet; then
            echo "No report change."
            exit 0
          fi
          git commit -m "Update audited nightly PDUFA scan report"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Unable to publish nightly report after three attempts"
          exit 1
