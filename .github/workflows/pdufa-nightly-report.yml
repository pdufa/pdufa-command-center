name: PDUFA Nightly Scan Report Publisher

on:
  workflow_run:
    workflows: ["PDUFA Nightly Clinical Scans"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed PDUFA Nightly Clinical Scans run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: pdufa-nightly-scan-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Verify archive integrity and publish report
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Checkout current dashboard
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve completed source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          DISPATCH_SOURCE_ID: ${{ inputs.source_run_id }}
          COMPLETED_SOURCE_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$WORKFLOW_EVENT" = "workflow_dispatch" ]; then
            SOURCE_RUN_ID="$DISPATCH_SOURCE_ID"
          elif [ "$WORKFLOW_EVENT" = "workflow_run" ]; then
            SOURCE_RUN_ID="$COMPLETED_SOURCE_ID"
          else
            SOURCE_RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pdufa-nightly-clinical.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status=="completed")][0].id')"
          fi
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::No completed clinical source run available."
            exit 1
          fi
          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Source clinical run: $SOURCE_RUN_ID"
      - name: Download archived clinical scan evidence from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: nightly-clinical-*
          path: reports/downloaded_nightly_scans
          merge-multiple: false
      - name: Build source-validated nightly report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python scripts/pdufa_scan_audit.py --run-id "$SOURCE_RUN_ID" --out data/nightly_scan_report.json --artifacts-dir reports/downloaded_nightly_scans
      - name: Commit Streamlit-visible report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nightly_scan_report.json
          if git diff --cached --quiet; then
            echo "No report change."
            exit 0
          fi
          git commit -m "Update audited nightly PDUFA scan report"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Unable to publish nightly report after three attempts"
          exit 1
