name: Scientific 800-point frontend export safety
on:
  pull_request:
    paths:
      - 'new-platform/frontend/app/ScientificAssessment.tsx'
      - 'new-platform/frontend/lib/scientific-800-review-csv.ts'
      - 'new-platform/frontend/tests/scientific-800-review-csv.test.cjs'
      - '.github/workflows/scientific-800-frontend-safety.yml'
  push:
    branches:
      - integration/scientific-assessment-validation-20261025
    paths:
      - 'new-platform/frontend/app/ScientificAssessment.tsx'
      - 'new-platform/frontend/lib/scientific-800-review-csv.ts'
      - 'new-platform/frontend/tests/scientific-800-review-csv.test.cjs'
      - '.github/workflows/scientific-800-frontend-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-800:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Verify exact 800-point pending plan and legacy 320 exports
        working-directory: new-platform/frontend
        run: node --test tests/scientific-800-review-csv.test.cjs tests/scientific-depth-review-csv.test.cjs
      - name: Typecheck science trial screen
        working-directory: new-platform/frontend
        run: npm run typecheck
