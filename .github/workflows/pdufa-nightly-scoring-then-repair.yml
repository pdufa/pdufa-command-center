name: PDUFA Nightly Scoring Then Error Check And Safe Repair
# Runs only after the full source chain completes: clinical, publisher, five source families, reconciliation.
on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      source_conclusion:
        type: string
        required: true
  workflow_run:
    workflows:
      - PDUFA Nightly FDA SEC Financial Market Issuer Sources
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/pdufa-nightly-scoring-then-repair.yml
      - site_scorecard.py
      - score_input_audit.py
      - scripts/nightly_scoring_audit.py
      - scripts/post_scan_repair.py
      - scripts/scan_recovery_triage.py
      - tests/test_nightly_scoring_audit.py
      - tests/test_post_scan_repair.py
      - tests/test_scan_recovery_triage.py
      - tests/test_score_input_audit.py
      - tests/test_scoring_tab_navigation.py

permissions:
  actions: write
  contents: write

concurrency:
  group: pdufa-postscan-scoring-alert-repair-${{ github.event_name == 'workflow_run' && 'nightly' || github.sha }}
  cancel-in-progress: false

jobs:
  workflow-tests:
    if: github.event_name == 'push' && inputs.source_run_id == ''
    name: Verify orchestrator without scans or repairs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test nightly audit and safe repair contracts
        run: python -m pytest -q tests/test_nightly_scoring_audit.py tests/test_post_scan_repair.py tests/test_scan_recovery_triage.py tests/test_score_input_audit.py tests/test_scoring_tab_navigation.py

  scoring:
    name: 1 — Surveys and ratings cancelled · source-run handoff only
    if: github.event_name == 'workflow_run' || inputs.source_run_id != ''
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.handoff.outputs.source_run_id }}
    steps:
      - name: Preserve source run identity without scoring or historical record changes
        id: handoff
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        shell: bash
        run: |
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Survey, rating, scoring, and historical score writes permanently retired."

  error-check:
    name: 2 — Check Gmail and GitHub after scoring
    needs: scoring
    if: >-
      always() && (github.event_name == 'workflow_run' || inputs.source_run_id != '') &&
      (needs.scoring.outputs.source_run_id != '' || inputs.source_run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Gmail and GitHub error audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PDUFA_SOURCE_RUN_ID: ${{ needs.scoring.outputs.source_run_id || inputs.source_run_id }}
          PDUFA_SERIAL_STAGE_CONCLUSION: ${{ inputs.source_conclusion }}
          PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
          PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
        run: python scripts/adhoc_alert_check.py
      - name: Archive error check even on incomplete credentials or API errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-nightly-error-check-${{ github.run_id }}
          path: reports/adhoc_alert_check.json
          if-no-files-found: warn
          retention-days: 30

  safe-repair:
    name: 3 — Guarded GitHub repair after scoring and error checks
    needs: [scoring, error-check]
    if: >-
      always() && (github.event_name == 'workflow_run' || inputs.source_run_id != '') &&
      (needs.scoring.outputs.source_run_id != '' || inputs.source_run_id != '') &&
      needs.error-check.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve completed Gmail/GitHub error report
        uses: actions/download-artifact@v4
        with:
          name: pdufa-nightly-error-check-${{ github.run_id }}
          path: reports/
      - name: Request one retry on independently verified transient failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.post_scan_repair
      - name: Prepare source-conflict and code-error recovery queue
        if: always()
        env:
          PDUFA_SOURCE_RUN_ID: ${{ needs.scoring.outputs.source_run_id || inputs.source_run_id }}
        shell: bash
        run: |
          python scripts/scan_recovery_triage.py --source-run-id "$PDUFA_SOURCE_RUN_ID"
          echo "Published verified source statuses remain unchanged."
      - name: Archive repair decision, including skipped unsafe fixes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-nightly-safe-repair-${{ github.run_id }}
          path: |
            reports/post_scan_repair.json
            reports/nightly_recovery_triage.json
          if-no-files-found: warn
          retention-days: 30
