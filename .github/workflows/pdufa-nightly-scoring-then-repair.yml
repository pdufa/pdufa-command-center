name: PDUFA Nightly Scoring Then Error Check And Safe Repair
# Runs only after the full source chain completes: clinical, publisher, five source families, reconciliation.
on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
      source_conclusion:
        type: string
        required: true
  workflow_run:
    workflows:
      - PDUFA Nightly FDA SEC Financial Market Issuer Sources
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/pdufa-nightly-scoring-then-repair.yml
      - scripts/nightly_scoring_audit.py
      - scripts/post_scan_repair.py
      - scripts/scan_recovery_triage.py
      - tests/test_nightly_scoring_audit.py
      - tests/test_post_scan_repair.py
      - tests/test_scan_recovery_triage.py
      - tests/test_score_input_audit.py
      - tests/test_scoring_tab_navigation.py

permissions:
  actions: write
  contents: write

concurrency:
  group: pdufa-postscan-scoring-alert-repair-${{ github.event_name == 'workflow_run' && 'nightly' || github.sha }}
  cancel-in-progress: false

jobs:
  workflow-tests:
    if: github.event_name == 'push' && inputs.source_run_id == ''
    name: Verify orchestrator without scans or repairs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test nightly audit and safe repair contracts
        run: python -m pytest -q tests/test_nightly_scoring_audit.py tests/test_post_scan_repair.py tests/test_scan_recovery_triage.py tests/test_score_input_audit.py tests/test_scoring_tab_navigation.py

  scoring:
    name: 1 — Audit scoring inputs after completed nightly scan
    if: >-
      inputs.source_run_id != '' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      source_workflow: ${{ steps.source.outputs.source_workflow }}
      source_conclusion: ${{ steps.source.outputs.source_conclusion }}
    steps:
      - name: Checkout trusted main and saved score snapshots
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed nightly source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          SERIAL_CONCLUSION: ${{ inputs.source_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_ID" > "$RUNNER_TEMP/nightly-source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_ID/jobs?per_page=100" > "$RUNNER_TEMP/nightly-jobs.json"
          python - "$RUNNER_TEMP/nightly-source.json" "$GITHUB_OUTPUT" "$RUNNER_TEMP/nightly-jobs.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              run = json.load(f)
          from scripts.nightly_sequence import completed_source_stage, WORKFLOW_NAME
          serial = os.environ.get("SERIAL_CONCLUSION", "")
          if serial:
              with open(sys.argv[3], encoding="utf-8") as f:
                  jobs = json.load(f).get("jobs", [])
              context = completed_source_stage(
                  run, jobs, current_run_id=os.environ["GITHUB_RUN_ID"],
                  conclusion=serial, repository=os.environ["GITHUB_REPOSITORY"])
              source_name, source_conclusion = WORKFLOW_NAME, context["conclusion"]
          else:
              approved = {"PDUFA Nightly Scan Report Publisher",
                          "PDUFA Nightly FDA SEC Financial Market Issuer Sources"}
              if (run.get("name") not in approved or
                  run.get("head_branch") != "main" or
                  (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"] or
                  run.get("status") != "completed" or
                  run.get("conclusion") not in ("success", "failure", "timed_out", "cancelled", "skipped")):
                  raise SystemExit("Unverified or unexpected completed nightly source")
              source_name, source_conclusion = run["name"], run["conclusion"]
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              print("source_run_id=" + str(run["id"]), file=out)
              print("source_workflow=" + source_name, file=out)
              print("source_conclusion=" + source_conclusion, file=out)
          print("Verified completed source stage #" + str(run["id"]) + ": " + source_name)
          PY
      - name: Install scoring test runner
        run: python -m pip install pytest
      - name: Test score lineage, overlap and missing-input rules
        id: scoring_tests
        continue-on-error: true
        run: python -m pytest -q tests/test_score_input_audit.py tests/test_scoring_tab_navigation.py tests/test_nightly_scoring_audit.py
      - name: Generate dated nightly scoring report
        env:
          SOURCE_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_NAME: ${{ steps.source.outputs.source_workflow }}
          SOURCE_CONCLUSION: ${{ steps.source.outputs.source_conclusion }}
        run: |
          python -m scripts.nightly_scoring_audit \
            --source-run-id "$SOURCE_ID" \
            --source-workflow "$SOURCE_NAME" \
            --source-conclusion "$SOURCE_CONCLUSION" \
            --out data/nightly_scoring_audit.json
      - name: Publish latest scoring-input findings on dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nightly_scoring_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish nightly scoring input audit"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            echo "::error::Unable to publish nightly scoring audit"
            exit 1
          fi
      - name: Archive scoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-nightly-scoring-${{ github.run_id }}
          path: data/nightly_scoring_audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Signal unverified scoring tests
        if: steps.scoring_tests.outcome == 'failure'
        run: |
          echo "::error::Scoring regression failure; do not infer score quality."
          exit 1

  error-check:
    name: 2 — Check Gmail and GitHub after scoring
    needs: scoring
    if: >-
      always() && (github.event_name == 'workflow_run' || inputs.source_run_id != '') &&
      (needs.scoring.outputs.source_run_id != '' || inputs.source_run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Gmail and GitHub error audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PDUFA_SOURCE_RUN_ID: ${{ needs.scoring.outputs.source_run_id || inputs.source_run_id }}
          PDUFA_SERIAL_STAGE_CONCLUSION: ${{ inputs.source_conclusion }}
          PDUFA_GMAIL_USER: ${{ secrets.PDUFA_GMAIL_USER }}
          PDUFA_GMAIL_APP_PASSWORD: ${{ secrets.PDUFA_GMAIL_APP_PASSWORD }}
        run: python scripts/adhoc_alert_check.py
      - name: Archive error check even on incomplete credentials or API errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-nightly-error-check-${{ github.run_id }}
          path: reports/adhoc_alert_check.json
          if-no-files-found: warn
          retention-days: 30

  safe-repair:
    name: 3 — Guarded GitHub repair after scoring and error checks
    needs: [scoring, error-check]
    if: >-
      always() && (github.event_name == 'workflow_run' || inputs.source_run_id != '') &&
      (needs.scoring.outputs.source_run_id != '' || inputs.source_run_id != '') &&
      needs.error-check.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve completed Gmail/GitHub error report
        uses: actions/download-artifact@v4
        with:
          name: pdufa-nightly-error-check-${{ github.run_id }}
          path: reports/
      - name: Request one retry on independently verified transient failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.post_scan_repair
      - name: Prepare source-conflict and code-error recovery queue
        if: always()
        env:
          PDUFA_SOURCE_RUN_ID: ${{ needs.scoring.outputs.source_run_id || inputs.source_run_id }}
        shell: bash
        run: |
          python scripts/scan_recovery_triage.py --source-run-id "$PDUFA_SOURCE_RUN_ID"
          echo "Published verified source statuses remain unchanged."
      - name: Archive repair decision, including skipped unsafe fixes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-nightly-safe-repair-${{ github.run_id }}
          path: |
            reports/post_scan_repair.json
            reports/nightly_recovery_triage.json
          if-no-files-found: warn
          retention-days: 30
