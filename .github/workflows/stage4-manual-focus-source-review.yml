name: Stage 4 Manual FOCUS Primary Source Review
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-and-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve 29 ClinicalTrials.gov records
        run: |
          mkdir -p stage4-review-output
          python scripts/stage4_clinicaltrials_source.py > stage4-review-output/registry-metadata.json
      - name: Phase-first triage
        run: |
          python scripts/stage4_phase_first_triage.py < stage4-review-output/registry-metadata.json > stage4-review-output/phase-triage.json
      - name: Verify output remains non-adjudicated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("stage4-review-output")
          registry = json.loads((root / "registry-metadata.json").read_text())
          triage = json.loads((root / "phase-triage.json").read_text())
          assert len(registry["trials"]) == len(triage["trials"]) == 29
          assert registry["scientific_adjudications"] == 0
          assert triage["verified_scientific_adjudications"] == 0
          assert all(x.get("prediction") is None for x in registry["trials"])
          assert all(x.get("prediction") is None and x["verified"] is False for x in triage["trials"])
          PY
      - name: Audit coverage against canonical FOCUS roster
        run: |
          python scripts/stage4_retrieval_coverage_audit.py \
            stage4-review-output/registry-metadata.json \
            stage4-review-output/phase-triage.json \
            new-platform/frontend/data/p3PostDataActive.json \
            > stage4-review-output/coverage-audit.json
      - name: Publish retrieval coverage summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("stage4-review-output/coverage-audit.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## FOCUS primary-source retrieval coverage\n\n")
              summary.write(f"- Total trials: {report['total']}\n")
              summary.write(f"- Retrieved: {report['retrieved']}\n")
              summary.write(f"- Failed retrieval: {report['failed']}\n")
              summary.write("- Scientific verification: not completed\n")
              summary.write("\\n### Primary endpoint evidence readiness\\n")
              for key, count in report["endpoint_evidence_counts"].items():
                  summary.write(f"- {key}: {count}\\n")
              summary.write("\\n### Phase readiness\\n")
              for key, count in report["readiness_counts"].items():
                  summary.write(f"- {key}: {count}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage4-focus-primary-source-triage
          path: stage4-review-output/*.json
          retention-days: 7
