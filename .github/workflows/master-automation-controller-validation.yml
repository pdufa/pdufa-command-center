name: Master Automation Controller Safety Tests
on:
  pull_request:
    paths:
      - 'new-platform/backend/app/master_automation.py'
      - 'new-platform/backend/app/master_automation_api.py'
      - 'new-platform/backend/app/main.py'
      - 'new-platform/backend/tests/test_master_automation.py'
      - 'scripts/master_automation_runner.py'
      - '.github/workflows/master-automation-controller-validation.yml'
      - '.github/workflows/master-automation-manual.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/backend/app/master_automation.py'
      - 'new-platform/backend/app/master_automation_api.py'
      - 'new-platform/backend/tests/test_master_automation.py'
      - 'scripts/master_automation_runner.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal database/API test dependencies
        run: python -m pip install "sqlalchemy>=2.0,<3" "fastapi>=0.115,<1" "pytest>=8,<10" "httpx>=0.27,<1" "requests>=2.31,<3"
      - name: Validate checkpoint transitions, resume and concurrency
        run: python -m pytest -q new-platform/backend/tests/test_master_automation.py
      - name: Exercise no-write plan and fail-closed default
        shell: bash
        run: |
          set -euo pipefail
          python scripts/master_automation_runner.py --mode plan | tee /tmp/master-controller-plan.txt
          grep -F 'PLAN_ONLY; no workflow dispatch' /tmp/master-controller-plan.txt
          if PDUFA_MASTER_ALLOW_EXECUTION=0 python scripts/master_automation_runner.py --mode run --run-key safety-test > /tmp/master-controller-gate.txt; then
            echo "::error::Controller started without explicit opt-in"
            exit 1
          fi
          grep -F 'EXECUTION_OPT_IN_DISABLED' /tmp/master-controller-gate.txt
      - name: Ensure no market orders or deployments in controller
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path("new-platform/backend/app/master_automation.py").read_text()
          b=Path("new-platform/backend/app/master_automation_api.py").read_text()
          for token in ("/orders", "alpaca.trading", "deployments", "/git/refs", "place_order"):
              assert token not in a+b, token
          assert "PDUFA_MASTER_WRITES_ENABLED" in b
          assert "NOT_WIRED" in a
          PY
