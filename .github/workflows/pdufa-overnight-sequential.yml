name: PDUFA Overnight Sequential Scans
run-name: ${{ (github.event_name != 'workflow_dispatch' || inputs.validate_only) && 'VALIDATE — PDUFA overnight' || 'POOL + PIPELINE — PDUFA overnight' }}

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate wiring without collecting sources or sending scan notifications'
        type: boolean
        default: false
      scan_mode:
        description: 'Incremental weekday verification or Sunday complete reconciliation'
        type: choice
        options: [DELTA, FULL]
        default: DELTA
      night_date_pacific:
        description: 'Pacific date of 8 PM scan night supplied by guarded scheduler; empty for manual dispatch'
        type: string
        required: false
        default: ''
  # Source changes validate the workflow; only an explicit dispatch runs scans.
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-overnight-sequential.yml']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pdufa-*.yml'
      - 'scripts/nightly_start.py'
      - 'scripts/nightly_sequence.py'
      - 'scripts/validate_clinical_snapshot.py'
      - 'tests/test_nightly_pacific_sequence.py'

permissions:
  actions: write
  contents: write

# Held through sources, scoring, error checks AND repair. Component locks alone
# cannot prevent the following night's clinical scans overlapping older sources.
concurrency:
  group: pdufa-complete-overnight-sequence-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate clock, source lineage, and dated RESULTS publication
        run: python -m unittest discover -s tests -p 'test_nightly_pacific_sequence.py' -v

  clinical:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && !inputs.validate_only
    uses: ./.github/workflows/pdufa-nightly-clinical.yml
    with:
      scan: ALL
      scan_mode: ${{ inputs.scan_mode || 'DELTA' }}
    secrets: inherit

  report:
    needs: clinical
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.validate_only && needs.clinical.result != 'skipped'
    uses: ./.github/workflows/pdufa-nightly-report.yml
    with:
      source_run_id: ${{ github.run_id }}

  sources:
    needs: report
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.validate_only && needs.report.result != 'skipped'
    uses: ./.github/workflows/pdufa-nightly-missing-sources.yml
    with:
      scan_mode: ${{ inputs.scan_mode || 'DELTA' }}
    secrets: inherit

  shared-data:
    needs: sources
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.validate_only && needs.sources.result != 'skipped'
    uses: ./.github/workflows/pdufa-shared-enrichment.yml
    secrets: inherit

  scoring-and-repair:
    needs: [sources, shared-data]
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.validate_only && needs.sources.result != 'skipped'
    uses: ./.github/workflows/pdufa-nightly-scoring-then-repair.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_conclusion: ${{ needs.sources.result }}
    secrets: inherit

  result:
    needs: [validate, clinical, report, sources, shared-data, scoring-and-repair]
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.validate_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Preserve every failed or skipped stage in the final result
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          lines = ['## Overnight sequential execution', '',
                   'GitHub execution status only; source evidence may still be PARTIAL.', '']
          for name, result in results.items():
              lines.append(f"- {name}: **{result['result']}**")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(lines) + '\n')
          if any(item['result'] != 'success' for item in results.values()):
              raise SystemExit('One or more overnight stages failed or were skipped; inspect their reports.')
          PY

  # Archive this run directly; a separate workflow_run hook may not fire for a token-dispatched workflow.
  # Execute after the complete sequence (or its failure); never start another scan.
  archive:
    needs: result
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.validate_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Python for Pacific-date archive
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record finished scan under its actual Pacific start date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RESULT: ${{ needs.result.result }}
          GUARDED_NIGHT: ${{ inputs.night_date_pacific }}
        run: |
          set -euo pipefail
          STARTED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')"
          test -n "$STARTED_AT" && test "$STARTED_AT" != "null"
          if [[ "$SCAN_RESULT" == "success" ]]; then
            CONCLUSION=success
          else
            CONCLUSION=failure
          fi
          python scripts/pdufa_daily_results.py \
            --run-id "$GITHUB_RUN_ID" \
            --started-at "$STARTED_AT" \
            --conclusion "$CONCLUSION" \
            --night-date-pacific "$GUARDED_NIGHT"
      - name: Publish date-indexed results for website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_scan_results.json
          if git diff --cached --quiet; then
            echo "Date already registered; no duplicate publication."
            exit 0
          fi
          git commit -m "Publish Pacific RESULTS for run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pacific dated RESULTS published to the dashboard source."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Dated RESULTS publication failed; scan evidence remains archived."
          exit 1
