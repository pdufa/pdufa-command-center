name: Deep Medical Intelligence Preview QA
on:
  push:
    branches:
      - feature/deep-medical-intelligence-preview-20261107
  pull_request:
    paths:
      - 'new-platform/frontend/lib/medical-intelligence-*.ts'
      - 'new-platform/frontend/app/medical-intelligence-preview/**'
      - 'new-platform/frontend/tests/medical-intelligence-*.test.cjs'
      - 'new-platform/frontend/tests/medical-analyze-now.test.cjs'
      - 'new-platform/frontend/data/p3PostDataActive.json'
      - 'new-platform/frontend/lib/main-install-progress.ts'
      - 'new-platform/frontend/app/main/**'
      - 'new-platform/frontend/app/api/main/**'
      - 'new-platform/frontend/app/GlobalNavigation.tsx'
      - 'new-platform/frontend/tests/main-install-progress.test.cjs'
      - 'new-platform/backend/app/installation_monitor.py'
      - 'new-platform/backend/tests/test_installation_monitor.py'
      - 'new-platform/backend/app/medical_continuous.py'
      - 'new-platform/backend/app/medical_advanced_runtime.py'
      - 'new-platform/backend/app/medical_on_demand.py'
      - 'new-platform/backend/app/data/focus_legacy_score_snapshot.json'
      - 'new-platform/backend/tests/test_medical_on_demand.py'
      - 'new-platform/frontend/app/focus/**'
      - 'new-platform/frontend/app/p3-post-data/page.tsx'
      - 'new-platform/frontend/app/api/analyze-now/**'
      - 'new-platform/backend/app/data/focus_snapshot.json'
      - 'new-platform/backend/app/data/focus_application_snapshot.json'
      - 'new-platform/backend/scripts/sync_focus_application_snapshot.py'
      - 'new-platform/backend/tests/test_medical_continuous.py'
      - 'new-platform/backend/tests/test_medical_advanced_runtime.py'
      - '.github/workflows/deep-medical-intelligence-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts
        working-directory: new-platform/frontend
      - name: Verify TypeScript
        run: npm run typecheck
        working-directory: new-platform/frontend
      - name: Run isolated medical intelligence regression suite
        run: node --test tests/medical-intelligence-*.test.cjs tests/medical-analyze-now.test.cjs tests/main-install-progress.test.cjs
        working-directory: new-platform/frontend

  backend:
    name: Persistent medical history and source-change QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r new-platform/backend/requirements.txt
      - name: Check application snapshot parity with canonical FOCUS data
        run: python new-platform/backend/scripts/sync_focus_application_snapshot.py --check
      - name: Test 12-stage history and source-change logic
        run: PYTHONPATH=new-platform/backend python -m pytest -q new-platform/backend/tests/test_medical_continuous.py new-platform/backend/tests/test_medical_advanced_runtime.py new-platform/backend/tests/test_medical_on_demand.py new-platform/backend/tests/test_installation_monitor.py
