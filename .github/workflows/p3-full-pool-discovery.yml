name: P3 Full Master POOL Nightly Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/p3_pool_full_discovery.py'
      - 'tests/test_p3_pool_full_discovery.py'
      - '.github/workflows/p3-full-pool-discovery.yml'
  workflow_run:
    workflows: ['PDUFA Overnight Sequential Scans']
    types: [completed]
  schedule:
    - cron: '05 13 * * *'

permissions:
  contents: write

concurrency:
  group: p3-full-master-pool-discovery
  cancel-in-progress: false

jobs:
  full-pool-discovery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Sheets and official-source clients
        run: python -m pip install google-auth requests
      - name: Verify POOL coverage, cap gates, registry and evidence safety
        run: python -m unittest discover -s tests -p 'test_p3_pool_full_discovery.py' -v
      - name: Screen canonical POOL against exact-NCT ClinicalTrials.gov results
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/p3_pool_full_discovery.py
      - name: Preserve detailed review evidence and coverage totals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-full-pool-discovery-${{ github.run_id }}
          path: |
            reports/p3_pool_full_discovery_latest.json
            reports/p3_pool_full_discovery_review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish audited coverage, never unverified candidates
        run: |
          git add reports/p3_pool_full_discovery_latest.json
          if git diff --cached --quiet; then
            echo "No coverage changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish P3 full master POOL discovery coverage"
            git push origin main
          fi
