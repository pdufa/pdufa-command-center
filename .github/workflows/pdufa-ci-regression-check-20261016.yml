name: PDUFA October 16 Regression Repair Validation

on:
  push:
    branches: [fix/oct16-ci-regressions]
    paths:
      - 'tests/test_scan_configuration_audit.py'
      - 'tests/test_phase3_issuer_readouts.py'
      - 'tests/test_pre_phase3_trading.py'
      - '.github/workflows/pdufa-ci-regression-check-20261016.yml'

permissions:
  contents: read

jobs:
  verify-regressions:
    name: Prove clinical and Gmail regressions are corrected
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Run four previously failing regression tests
        run: |
          python -m unittest -v \
            tests.test_phase3_issuer_readouts.IssuerReadoutTests.test_persisted_real_readouts_remain_visible_but_not_pre_scored \
            tests.test_pre_phase3_trading.TradingResearchQueueTests.test_saved_universe_still_has_visible_trials_after_protocol_freshness_expires \
            tests.test_scan_configuration_audit.FiledAlertAuditTests.test_archived_alerts_are_read_once_across_parent_and_subfolders \
            tests.test_scan_configuration_audit.FiledAlertAuditTests.test_more_than_150_headers_are_checked_in_100_message_batches
