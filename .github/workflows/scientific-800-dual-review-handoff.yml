name: Scientific 800 reviewer A/B handoff safety
on:
  pull_request:
    paths:
      - 'new-platform/frontend/app/Scientific800Handoff.tsx'
      - 'new-platform/frontend/app/trial/[nctId]/page.tsx'
      - 'new-platform/frontend/lib/scientific-800-reviewer-handoff.ts'
      - 'new-platform/frontend/tests/scientific-800-reviewer-handoff.test.cjs'
      - '.github/workflows/scientific-800-dual-review-handoff.yml'
  push:
    branches:
      - integration/scientific-assessment-validation-20261025
    paths:
      - 'new-platform/frontend/app/Scientific800Handoff.tsx'
      - 'new-platform/frontend/app/trial/[nctId]/page.tsx'
      - 'new-platform/frontend/lib/scientific-800-reviewer-handoff.ts'
      - 'new-platform/frontend/tests/scientific-800-reviewer-handoff.test.cjs'
      - '.github/workflows/scientific-800-dual-review-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-handoff-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install frontend packages
        working-directory: new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Validate source linked A/B 800 handoffs and preserved 320 workflow
        working-directory: new-platform/frontend
        run: node --test tests/scientific-800-reviewer-handoff.test.cjs tests/scientific-800-evidence-map.test.cjs tests/scientific-800-review-csv.test.cjs tests/scientific-depth-review-csv.test.cjs
      - name: Typecheck isolated trial reviewer components
        working-directory: new-platform/frontend
        run: npm run typecheck
