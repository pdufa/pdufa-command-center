name: Phase-first Level 1-6 readiness checks

on:
  pull_request:
    paths:
      - "scripts/medical/level16_scientific_coverage.py"
      - "scripts/medical/level16_orca2_statistical_timeline.py"
      - "scripts/medical/level16_review_handoff.py"
      - "tests/test_level16_review_handoff.py"
      - "tests/test_level16_orca2_statistical_timeline.py"
      - "tests/test_level16_scientific_coverage.py"
      - "scripts/medical/level16_research_preparation.py"
      - "scripts/medical/level16_backup_inventory.py"
      - "tests/test_level16_research_preparation.py"
      - "tests/test_level16_staging_preparation.py"
      - "tests/test_level16_preparation_recovery_postgres.py"
      - "infra/level16-staging/**"
      - "reports/scientific-levels1-6/**"
      - "new-platform/backend/app/level16_staging*.py"
      - "new-platform/backend/migrations/20261113_level16_staging_evidence.sql"
      - "new-platform/backend/requirements-level16-staging.txt"
      - "tests/test_level16_staging*.py"
      - "new-platform/backend/app/level16_review_policy.py"
      - "new-platform/backend/app/level16_review_events.py"
      - "new-platform/backend/migrations/20261113_level16_review_events.sql"
      - "tests/test_level16_review_events.py"
      - "tests/test_level16_review_postgres.py"
      - "scripts/medical/phase_first_levels_1_6.py"
      - "scripts/medical/level16_source_submissions.py"
      - "scripts/medical/level16_review_cases.py"
      - "tests/test_level16_review_cases.py"
      - "scripts/medical/level16_local_byte_receipts.py"
      - "tests/test_level16_local_byte_receipts.py"
      - "scripts/medical/render_level16_focus_preview.py"
      - "tests/test_render_level16_focus_preview.py"
      - "scripts/medical/level4_registry_extraction.py"
      - "tests/test_phase_first_levels_1_6.py"
      - "tests/test_level4_registry_extraction.py"
      - ".github/workflows/phase-first-levels1-6-tests.yml"
  push:
    branches:
      - "codex/assessment-levels1-6-phase-first-20261113"
    paths:
      - "scripts/medical/level16_scientific_coverage.py"
      - "scripts/medical/level16_orca2_statistical_timeline.py"
      - "scripts/medical/level16_review_handoff.py"
      - "tests/test_level16_review_handoff.py"
      - "tests/test_level16_orca2_statistical_timeline.py"
      - "tests/test_level16_scientific_coverage.py"
      - "scripts/medical/level16_research_preparation.py"
      - "scripts/medical/level16_backup_inventory.py"
      - "tests/test_level16_research_preparation.py"
      - "tests/test_level16_staging_preparation.py"
      - "tests/test_level16_preparation_recovery_postgres.py"
      - "infra/level16-staging/**"
      - "reports/scientific-levels1-6/**"
      - "new-platform/backend/app/level16_staging*.py"
      - "new-platform/backend/migrations/20261113_level16_staging_evidence.sql"
      - "new-platform/backend/requirements-level16-staging.txt"
      - "tests/test_level16_staging*.py"
      - "new-platform/backend/app/level16_review_policy.py"
      - "new-platform/backend/app/level16_review_events.py"
      - "new-platform/backend/migrations/20261113_level16_review_events.sql"
      - "tests/test_level16_review_events.py"
      - "tests/test_level16_review_postgres.py"
      - "scripts/medical/phase_first_levels_1_6.py"
      - "scripts/medical/level16_source_submissions.py"
      - "scripts/medical/level16_review_cases.py"
      - "tests/test_level16_review_cases.py"
      - "scripts/medical/level16_local_byte_receipts.py"
      - "tests/test_level16_local_byte_receipts.py"
      - "scripts/medical/render_level16_focus_preview.py"
      - "tests/test_render_level16_focus_preview.py"
      - "scripts/medical/level4_registry_extraction.py"
      - "tests/test_phase_first_levels_1_6.py"
      - "tests/test_level4_registry_extraction.py"
      - ".github/workflows/phase-first-levels1-6-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  evidence-readiness:
    name: Phase-first and retirement guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Preserve byte-for-byte historical files on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated review-interface test dependencies
        run: python -m pip install "sqlalchemy>=2.0,<3" "fastapi>=0.115,<1" "httpx>=0.27,<1" "PyJWT[crypto]>=2.10.1,<3" "PyYAML>=6,<7"
      - name: Exact FOCUS 32-trial scientific review handoff and false-signoff guard
        run: python -m unittest discover -s tests -p "test_level16_review_handoff.py" -v
      - name: ORCA-2 public-source statistical chronology and non-certification
        run: python -m unittest discover -s tests -p "test_level16_orca2_statistical_timeline.py" -v
      - name: Scientific collection coverage and preliminary research integrity
        run: python -m unittest discover -s tests -p "test_level16_scientific_coverage.py" -v
      - name: Phase-specific public-source acquisition and preliminary worksheets
        run: python -m unittest discover -s tests -p "test_level16_research_preparation.py" -v
      - name: Approval templates and blocked staging health/interface
        run: python -m unittest discover -s tests -p "test_level16_staging_preparation.py" -v
      - name: Signed synthetic identity and disabled staging interface tests
        run: python -m unittest discover -s tests -p "test_level16_staging_identity.py" -v
      - name: Authorized review policy and fail-closed HTTP tests
        run: python -m unittest discover -s tests -p "test_level16_review_events.py" -v
      - name: Phase-first six-level unit tests
        run: python -m unittest discover -s tests -p "test_phase_first_levels_1_6.py" -v
      - name: Source-verification dossier and independent-review intake gates
        run: python -m unittest discover -s tests -p "test_level16_review_cases.py" -v
      - name: Offline local original-byte digest consistency tests
        run: python -m unittest discover -s tests -p "test_level16_local_byte_receipts.py" -v
      - name: Offline FOCUS evidence-review preview tests
        run: python -m unittest discover -s tests -p "test_render_level16_focus_preview.py" -v
      - name: Registry extractor regression tests
        run: python -m unittest discover -s tests -p "test_level4_registry_extraction.py" -v
      - name: Permanent retirement regression guard
        run: python scripts/audit_raas_retirement.py --check

  review-postgres:
    name: Disposable PostgreSQL review permissions and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-test-only
          POSTGRES_DB: level16_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEVEL16_TEST_ALLOW_DISPOSABLE: '1'
      LEVEL16_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-test-only@127.0.0.1:5432/level16_test
    steps:
      - name: Preserve historical bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install review storage test dependencies
        run: python -m pip install "sqlalchemy>=2.0,<3" "psycopg[binary]>=3.2,<4" "fastapi>=0.115,<1" "httpx>=0.27,<1" "PyJWT[crypto]>=2.10.1,<3" "PyYAML>=6,<7"
      - name: Actual disposable backup, restore, inventory and mutation guard drill
        env:
          LEVEL16_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: python -m unittest discover -s tests -p "test_level16_preparation_recovery_postgres.py" -v
      - name: Protected staging identity, original evidence and review integration
        run: python -m unittest discover -s tests -p "test_level16_staging_postgres.py" -v
      - name: Migration, permissions, replay, append-only and concurrent updates
        run: python -m unittest discover -s tests -p "test_level16_review_postgres.py" -v
      - name: Permanent retirement regression guard
        run: python scripts/audit_raas_retirement.py --check
