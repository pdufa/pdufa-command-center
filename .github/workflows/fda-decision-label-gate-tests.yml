name: FDA decision label gate tests
on:
  pull_request:
    paths:
      - "research/fda_decision_label_gate.py"
      - "research/fda_candidate_audit.py"
      - "research/fda_candidate_audit_cli.py"
      - "research/fda_existing_history_audit.py"
      - "research/fda_archive_chronology_gate.py"
      - "research/fda_prediction_provenance_worklist.py"
      - "research/fda_legacy_accuracy_reconciliation.py"
      - "research/fda_verification_queue.py"
      - "research/fda_predecision_reconstruction.py"
      - "research/fda_science_dossier.py"
      - "research/fda_holdout_dashboard_snapshot.py"
      - "new-platform/backend/app/science_40_question_catalog.json"
      - "new-platform/frontend/lib/fda-holdout-reconstruction*"
      - "new-platform/frontend/app/installation-audit/HistoricalHoldoutReconstruction.tsx"
      - "new-platform/frontend/app/installation-audit/page.tsx"
      - "new-platform/frontend/tests/fda-holdout-reconstruction.test.cjs"
      - "research/evidence/2025_holdout_fda_action_evidence.json"
      - "research/evidence/2025_holdout_predecision_reconstruction.json"
      - "research/evidence/2025_holdout_archive_provenance_audit.json"
      - "tests/test_fda_decision_label_gate.py"
      - "tests/test_fda_candidate_audit.py"
      - "tests/test_fda_candidate_audit_cli.py"
      - "tests/test_fda_existing_history_audit.py"
      - "tests/test_fda_archive_chronology_gate.py"
      - "tests/test_fda_prediction_provenance_worklist.py"
      - "tests/test_fda_legacy_accuracy_reconciliation.py"
      - "tests/test_fda_predecision_reconstruction.py"
      - "tests/test_fda_holdout_reconstruction_integration.py"
      - "tests/test_fda_science_dossier.py"
      - "tests/test_fda_holdout_dashboard_snapshot.py"
      - ".github/workflows/fda-decision-label-gate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression test dependency
        run: python -m pip install pytest
      - name: Verify FDA historical decision label gate
        run: |
          python -m unittest discover -s tests -p "test_fda_decision_label_gate.py" -v
          python -m unittest discover -s tests -p "test_fda_candidate_audit.py" -v
          python -m unittest discover -s tests -p "test_fda_candidate_audit_cli.py" -v
          python -m unittest discover -s tests -p "test_fda_existing_history_audit.py" -v
          python -m unittest discover -s tests -p "test_fda_archive_chronology_gate.py" -v
          python -m unittest discover -s tests -p "test_fda_prediction_provenance_worklist.py" -v
          python -m unittest discover -s tests -p "test_fda_legacy_accuracy_reconciliation.py" -v
          python -m research.fda_archive_chronology_gate research/evidence/2025_holdout_archive_provenance_audit.json research/evidence/2025_holdout_predecision_reconstruction.json > "$RUNNER_TEMP/fda_archive_chronology.json"
          python -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"fda_archive_chronology.json"))); assert len(r["cases"]) == 6 and r["eligible_cases"] == 0 and all(x["model_freeze_after_fda_action"] and x["prediction_archive_lock_after_fda_action"] for x in r["cases"]); print("Historical archive chronology: 6 post-action cases, 0 validated")'
          python -m pytest -q tests/test_fda_predecision_reconstruction.py tests/test_fda_holdout_reconstruction_integration.py tests/test_fda_science_dossier.py tests/test_fda_holdout_dashboard_snapshot.py
          python -m research.fda_verification_queue data/prediction_engine_history.csv research/evidence/2025_holdout_fda_action_evidence.json research/evidence/2025_holdout_predecision_reconstruction.json --as-of 2026-10-28 > "$RUNNER_TEMP/fda_six_case_reconstruction_audit.json"
          python -m research.fda_holdout_dashboard_snapshot --as-of 2026-10-28 --output new-platform/frontend/lib/fda-holdout-reconstruction-snapshot.json --check
          python -m research.fda_existing_history_audit data/prediction_engine_history.csv > "$RUNNER_TEMP/fda_legacy_history_audit.json"
          python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"fda_legacy_history_audit.json"); r=json.load(open(p)); assert r["eligible_for_further_review"] == 0 and r["approval_rate"] is None; print("Legacy audit rows:",r["total_candidates"],"eligible:",r["eligible_for_further_review"]); print("Validation periods:",r["legacy_validation_period_counts"])'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
