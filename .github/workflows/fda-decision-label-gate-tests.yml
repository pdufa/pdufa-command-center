name: FDA decision label gate tests
on:
  pull_request:
    paths:
      - "research/fda_decision_label_gate.py"
      - "research/fda_candidate_audit.py"
      - "research/fda_candidate_audit_cli.py"
      - "research/fda_existing_history_audit.py"
      - "tests/test_fda_decision_label_gate.py"
      - "tests/test_fda_candidate_audit.py"
      - "tests/test_fda_candidate_audit_cli.py"
      - "tests/test_fda_existing_history_audit.py"
      - ".github/workflows/fda-decision-label-gate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify FDA historical decision label gate
        run: |
          python -m unittest discover -s tests -p "test_fda_decision_label_gate.py" -v
          python -m unittest discover -s tests -p "test_fda_candidate_audit.py" -v
          python -m unittest discover -s tests -p "test_fda_candidate_audit_cli.py" -v
          python -m unittest discover -s tests -p "test_fda_existing_history_audit.py" -v
          python -m research.fda_existing_history_audit data/prediction_engine_history.csv > "$RUNNER_TEMP/fda_legacy_history_audit.json"
          python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"fda_legacy_history_audit.json"); r=json.load(open(p)); assert r["eligible_for_further_review"] == 0 and r["approval_rate"] is None; print("Legacy audit rows:",r["total_candidates"],"eligible:",r["eligible_for_further_review"]); print("Validation periods:",r["legacy_validation_period_counts"])'
