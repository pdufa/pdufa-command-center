name: Live Streamlit Cloud Browser Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-streamlit-audit.yml"
      - "scripts/live_streamlit_audit.cjs"
      - "app.py"
      - "nightly_scan_dashboard.py"
      - "scan_activity_dashboard.py"
      - "pre_readout.py"
      - "pre_readout_score.py"
      - "pre_phase3_priority.py"
      - "post_phase3_unified.py"
      - "post_phase3_unified_ui.py"
      - "post_phase3_priority.py"
      - "post_phase3_workspace.py"
      - "data/step7_financing_review.csv"
      - "data/step7_live_status.json"
      - "data/pdufa_candidates.csv"
      - "step7_live.py"
      - "data/pre_readout_intake_status.json"
      # Changes to the GEM and source-cache validation paths need a real
      # deployed-app check; Python-only tests cannot validate Cloud rendering.
      - "gem_scans.py"
      - "gem_scans_ui.py"
      - "filings_base_amendments_ui.py"
      - "filings_live_data.py"
      - "filings_scan_controls.py"
      - "pipeline_filings_alignment.py"
      - "pipeline_source_scope.py"
      - "pipeline_universe.py"
      - "pipeline_display.py"
      - "gem_master_list.py"
      - "gem_jr_ui.py"
      - "gem_stage_dossier.py"
      - "gem_visual_page.py"
      - "gem_trade_navigation.py"
      - "gem_trial_hierarchy_ui.py"
      - "gem_nested_master_ui.py"
      - "ticker_toggle_panel.py"
      - "config/issuer_sources.json"
      - "scripts/source_verification.py"
      - "gem_readiness_audit.py"
      - "gem_phase3_discovery.py"
      - "step7_cached_snapshot.py"
      - "scripts/publish_step7_feed.py"
      - "data/step7_pre_phase3_feed.csv"
      - "data/phase3_announcements.csv"
      - "data/phase3_intake_status.json"
      - "data/pdufa_source_report.json"

permissions:
  contents: read

concurrency:
  group: live-streamlit-cloud-audit
  cancel-in-progress: true

jobs:
  check-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser instrumentation
        run: npm install --no-save playwright-core
      - name: Verify runner browser exists
        shell: bash
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/google-chrome-stable ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome-stable" >> "$GITHUB_ENV"
          else
            echo "::error::Google Chrome not available on runner"
            exit 1
          fi
      - name: Open live Streamlit app and inspect rendered navigation
        run: node scripts/live_streamlit_audit.cjs
      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-streamlit-cloud-audit
          path: live-audit-artifacts/
          if-no-files-found: warn
          retention-days: 7
