name: Step 7 PRE PHASE 3 Live Feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step7-live-feed.yml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step7-prephase3-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and self-validate saved PRE PHASE 3 display feed
        run: python scripts/publish_step7_feed.py
      - name: Publish validated feed without changing raw source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/step7_pre_phase3_feed.csv data/step7_financing_review.csv data/step7_live_status.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dated PRE PHASE 3 display feed"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not publish validated display feed"
          exit 1
