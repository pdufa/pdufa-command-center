name: RAAS ClinicalTrials.gov Evidence Backfill
on:
  workflow_dispatch:
  schedule:
    - cron: '26 11 * * *'
  pull_request:
    paths:
      - scripts/raas_registry_evidence_harvest.py
      - scripts/raas_registry_evidence_summary.py
      - scripts/raas_registry_evidence_index.py
      - scripts/raas_review_worklist.py
      - new-platform/frontend/data/raas-reviewed-metric-assessments.json
      - scripts/raas_trial_score_ledger.py
      - scripts/raas_clinical_component_evidence.py
      - scripts/raas_ten_trial_clinical_pilot.py
      - scripts/raas_all_trial_partial_metric_ratings.py
      - scripts/raas_active_phase3_source_screen.py
      - data/phase_pipeline_market_caps.csv
      - data/phase3_all_years_300m_10b_trials.csv
      - scripts/raas_current_pipeline_top_metric_audit.py
      - new-platform/frontend/data/raas-current-pipeline-pre-candidate-snapshots.json
      - new-platform/frontend/lib/raas-metric-specs.ts
      - scripts/raas_historical_fda_application_outcomes.py
      - new-platform/frontend/data/raas-historical-fda-application-outcomes.json
      - tests/test_raas_registry_evidence_summary.py
      - tests/test_raas_review_worklist.py
      - tests/test_raas_trial_score_ledger.py
      - tests/test_raas_clinical_component_evidence.py
      - tests/test_raas_ten_trial_clinical_pilot.py
      - tests/test_raas_all_trial_partial_metric_ratings.py
      - tests/test_raas_active_phase3_source_screen.py
      - tests/test_raas_current_pipeline_top_metric_audit.py
      - tests/test_raas_historical_fda_application_outcomes.py
      - tests/test_raas_registry_evidence_index.py
      - tests/test_raas_registry_evidence_harvest.py
      - data/raas_registry_missing_backfill.json
      - .github/workflows/raas-clinical-evidence-backfill.yml
  push:
    branches: [main]
    paths:
      - scripts/raas_registry_evidence_harvest.py
      - scripts/raas_registry_evidence_summary.py
      - scripts/raas_registry_evidence_index.py
      - scripts/raas_review_worklist.py
      - new-platform/frontend/data/raas-reviewed-metric-assessments.json
      - scripts/raas_trial_score_ledger.py
      - scripts/raas_clinical_component_evidence.py
      - scripts/raas_ten_trial_clinical_pilot.py
      - scripts/raas_all_trial_partial_metric_ratings.py
      - scripts/raas_active_phase3_source_screen.py
      - data/phase_pipeline_market_caps.csv
      - data/phase3_all_years_300m_10b_trials.csv
      - scripts/raas_current_pipeline_top_metric_audit.py
      - new-platform/frontend/data/raas-current-pipeline-pre-candidate-snapshots.json
      - new-platform/frontend/lib/raas-metric-specs.ts
      - scripts/raas_historical_fda_application_outcomes.py
      - new-platform/frontend/data/raas-historical-fda-application-outcomes.json
      - tests/test_raas_registry_evidence_summary.py
      - tests/test_raas_review_worklist.py
      - tests/test_raas_trial_score_ledger.py
      - tests/test_raas_clinical_component_evidence.py
      - tests/test_raas_ten_trial_clinical_pilot.py
      - tests/test_raas_all_trial_partial_metric_ratings.py
      - tests/test_raas_active_phase3_source_screen.py
      - tests/test_raas_current_pipeline_top_metric_audit.py
      - tests/test_raas_historical_fda_application_outcomes.py
      - data/raas_registry_missing_backfill.json
      - .github/workflows/raas-clinical-evidence-backfill.yml
permissions:
  contents: write
concurrency:
  group: raas-ctgov-evidence-publisher
  cancel-in-progress: false
jobs:
  collect:
    name: Verify and collect trial-specific registry source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NCT identity, evidence flags and fail-closed records
        run: |
          python -m unittest discover -s tests -p test_raas_registry_evidence_harvest.py -v
          python -m py_compile scripts/raas_registry_evidence_harvest.py scripts/raas_registry_evidence_summary.py scripts/raas_registry_evidence_index.py scripts/raas_review_worklist.py scripts/raas_trial_score_ledger.py scripts/raas_clinical_component_evidence.py scripts/raas_ten_trial_clinical_pilot.py scripts/raas_all_trial_partial_metric_ratings.py scripts/raas_active_phase3_source_screen.py scripts/raas_historical_fda_application_outcomes.py scripts/raas_current_pipeline_top_metric_audit.py
          python -m unittest discover -s tests -p test_raas_registry_evidence_index.py -v
          python -m unittest discover -s tests -p test_raas_review_worklist.py -v
          python -m unittest discover -s tests -p test_raas_trial_score_ledger.py -v
          python -m unittest discover -s tests -p test_raas_clinical_component_evidence.py -v
          python -m unittest discover -s tests -p test_raas_ten_trial_clinical_pilot.py -v
          python -m unittest discover -s tests -p test_raas_all_trial_partial_metric_ratings.py -v
          python -m unittest discover -s tests -p test_raas_active_phase3_source_screen.py -v
          python -m unittest discover -s tests -p test_raas_current_pipeline_top_metric_audit.py -v
          python -m unittest discover -s tests -p test_raas_historical_fda_application_outcomes.py -v
      - name: Verify real committed source receipts generate complete RAAS index
        if: github.event_name == 'pull_request'
        run: |
          python scripts/raas_registry_evidence_index.py
          python scripts/raas_review_worklist.py
          python scripts/raas_trial_score_ledger.py
          python scripts/raas_clinical_component_evidence.py
          python scripts/raas_ten_trial_clinical_pilot.py
          python scripts/raas_all_trial_partial_metric_ratings.py
          python scripts/raas_active_phase3_source_screen.py
          python scripts/raas_current_pipeline_top_metric_audit.py
          python scripts/raas_historical_fda_application_outcomes.py
          python -m unittest discover -s tests -p test_raas_registry_evidence_summary.py -v
      - name: Fetch all current research NCTs, including 35 gaps
        if: github.event_name != 'pull_request'
        run: python scripts/raas_registry_evidence_harvest.py --scope all
      - name: Publish retrieved evidence with unchanged missingness
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          file=data/raas_registry_live_evidence.json
          if [ ! -s "$file" ]; then
            echo "::error::No registry evidence receipt was created"
            exit 1
          fi
          python scripts/raas_registry_evidence_summary.py
          python scripts/raas_registry_evidence_index.py
          python scripts/raas_review_worklist.py
          python scripts/raas_trial_score_ledger.py
          python scripts/raas_clinical_component_evidence.py
          python scripts/raas_ten_trial_clinical_pilot.py
          python scripts/raas_all_trial_partial_metric_ratings.py
          python scripts/raas_active_phase3_source_screen.py
          python scripts/raas_current_pipeline_top_metric_audit.py
          python scripts/raas_historical_fda_application_outcomes.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/raas_registry_live_evidence.json").read_text())
          s=x["summary"]
          assert x["scope"]=="RAAS_CT_GOV_LIVE_EVIDENCE"
          assert s["researchTrials"]==762
          assert s["registrySourceRecordsStored"]>0
          assert s["completeRaasScores"]==0
          assert all(r["overallRaasScore"] is None for r in x["records"])
          print("Audited exact NCT evidence:",s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raas_registry_live_evidence.json new-platform/frontend/data/raas-registry-evidence-status.json new-platform/frontend/public/raas-registry-evidence-index.json new-platform/frontend/public/raas-source-review-worklist.csv new-platform/frontend/data/raas-source-review-worklist-status.json new-platform/frontend/public/raas-trial-score-ledger.csv new-platform/frontend/data/raas-trial-score-ledger-status.json new-platform/frontend/public/raas-clinical-evidence-components.csv new-platform/frontend/public/raas-primary-comparisons.csv new-platform/frontend/public/raas-serious-event-rates.csv new-platform/frontend/data/raas-clinical-evidence-components-status.json new-platform/frontend/public/raas-ten-trial-metric-pilot.csv new-platform/frontend/data/raas-ten-trial-metric-pilot-status.json new-platform/frontend/public/raas-all-trials-partial-metric-ratings.csv new-platform/frontend/data/raas-all-trials-partial-metric-ratings-status.json new-platform/frontend/public/raas-active-phase3-source-screen.csv new-platform/frontend/data/raas-active-phase3-source-screen-status.json new-platform/frontend/public/raas-current-pipeline-pre-metric-audit.csv new-platform/frontend/data/raas-current-pipeline-pre-metric-audit-status.json new-platform/frontend/public/raas-historical-fda-application-outcomes.csv new-platform/frontend/data/raas-historical-fda-application-outcomes-status.json
          if git diff --cached --quiet; then
            echo "No new ClinicalTrials.gov evidence captured."
            exit 0
          fi
          git commit -m "Record refreshed exact-NCT ClinicalTrials.gov evidence receipts"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Published source-backed registry outcome and safety evidence."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Evidence publication could not be confirmed"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: raas-clinical-evidence-${{ github.run_id }}
          path: |
            data/raas_registry_live_evidence.json
            new-platform/frontend/data/raas-registry-evidence-status.json
            new-platform/frontend/public/raas-registry-evidence-index.json
            new-platform/frontend/public/raas-source-review-worklist.csv
            new-platform/frontend/data/raas-source-review-worklist-status.json
            new-platform/frontend/public/raas-trial-score-ledger.csv
            new-platform/frontend/data/raas-trial-score-ledger-status.json
            new-platform/frontend/public/raas-clinical-evidence-components.csv
            new-platform/frontend/public/raas-primary-comparisons.csv
            new-platform/frontend/public/raas-serious-event-rates.csv
            new-platform/frontend/data/raas-clinical-evidence-components-status.json
            new-platform/frontend/public/raas-ten-trial-metric-pilot.csv
            new-platform/frontend/data/raas-ten-trial-metric-pilot-status.json
            new-platform/frontend/public/raas-all-trials-partial-metric-ratings.csv
            new-platform/frontend/data/raas-all-trials-partial-metric-ratings-status.json
            new-platform/frontend/public/raas-active-phase3-source-screen.csv
            new-platform/frontend/data/raas-active-phase3-source-screen-status.json
            new-platform/frontend/public/raas-current-pipeline-pre-metric-audit.csv
            new-platform/frontend/data/raas-current-pipeline-pre-metric-audit-status.json
            new-platform/frontend/public/raas-historical-fda-application-outcomes.csv
            new-platform/frontend/data/raas-historical-fda-application-outcomes-status.json
          if-no-files-found: warn
          retention-days: 30
