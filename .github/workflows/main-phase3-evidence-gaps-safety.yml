name: MAIN 741-trial Pipeline evidence gap safety
on:
  pull_request:
    paths:
      - 'new-platform/frontend/lib/phase3-census-evidence-gaps.ts'
      - 'new-platform/frontend/lib/phase3-census-sources.ts'
      - 'new-platform/frontend/public/phase3-census-sources-2026-10-26.json'
      - 'new-platform/frontend/tests/phase3-census-sources.test.cjs'
      - 'scripts/build_phase3_census_sources.py'
      - 'data/phase3_all_years_300m_10b_trials.csv'
      - 'data/company_registry.csv'
      - 'data/phase_pipeline_market_caps.csv'
      - 'config/issuer_sources.json'
      - 'new-platform/frontend/app/installation-audit/phase3-census/**'
      - 'new-platform/frontend/tests/phase3-census-evidence-gaps.test.cjs'
      - '.github/workflows/main-phase3-evidence-gaps-safety.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/lib/phase3-census-evidence-gaps.ts'
      - 'new-platform/frontend/lib/phase3-census-sources.ts'
      - 'new-platform/frontend/public/phase3-census-sources-2026-10-26.json'
      - 'new-platform/frontend/tests/phase3-census-sources.test.cjs'
      - 'scripts/build_phase3_census_sources.py'
      - 'data/phase3_all_years_300m_10b_trials.csv'
      - 'data/company_registry.csv'
      - 'data/phase_pipeline_market_caps.csv'
      - 'config/issuer_sources.json'
      - 'new-platform/frontend/app/installation-audit/phase3-census/**'
      - 'new-platform/frontend/tests/phase3-census-evidence-gaps.test.cjs'
      - '.github/workflows/main-phase3-evidence-gaps-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incomplete-evidence-does-not-qualify-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install existing frontend dependencies
        working-directory: new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Require 741 exact NCT source-backed and fail-closed evidence-gaps plus MAIN tests
        working-directory: new-platform/frontend
        run: node --test tests/phase3-census-sources.test.cjs tests/phase3-census-evidence-gaps.test.cjs tests/phase3-census-rows.test.cjs tests/phase3-census-snapshot.test.cjs tests/installation-audit.test.cjs tests/hop-source-diagnostic.test.cjs
      - name: Typecheck safe MAIN trial explorer
        working-directory: new-platform/frontend
        run: npm run typecheck
