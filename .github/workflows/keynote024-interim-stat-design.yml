name: KEYNOTE-024 Published Interim Plan Safety Checks
on:
  push:
    branches: [feature/keynote024-interim-stat-design-20261024]
  pull_request:
    branches: [feature/scientific-assessment-v1]
permissions:
  contents: read
jobs:
  interim-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r new-platform/backend/requirements.txt
      - name: Test original published design, signed-SAP blocker and archived API
        env:
          PYTHONPATH: new-platform/backend
        run: |
          python -m unittest discover -s new-platform/backend/tests -p 'test_scientific_pilot_interim_design.py' -v
          python -m unittest discover -s new-platform/backend/tests -p 'test_scientific_pilot_keynote024_http.py' -v
          python -m unittest discover -s new-platform/backend/tests -p 'test_scientific_protocol_readiness.py' -v
  interim-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test clinical methodology display and existing safety/source guards
        run: |
          node --test tests/trial-science-interim-design.test.cjs
          node --test tests/trial-science-readiness.test.cjs
          node --test tests/trial-science-safety-chronology.test.cjs
          node --test tests/trial-science-evidence-audit.test.cjs
