name: MAIN R42 29 FOCUS original registry primary outcome extraction
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-focus-registry-primary-evidence-r42.yml
      - new-platform/backend/scripts/build_focus_registry_results_r42.py
      - new-platform/backend/tests/test_focus_registry_results_r42.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-r42-focus-registry-evidence
  cancel-in-progress: false

jobs:
  original-registry-research:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: new-platform/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source roster and isolated 29-trial extraction tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python -m pip install pytest
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_focus_registry_results_r42.py \
            tests/test_focus_source_recovery_r40.py \
            tests/test_hop_blinded_phase3_backtest.py
      - name: Read original public trial registry and extract posted numerical fields
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r42-registry/original"
          python new-platform/backend/scripts/build_focus_registry_results_r42.py \
            --output "$RUNNER_TEMP/r42-registry/reviewer_evidence_r42.json" \
            --raw-dir "$RUNNER_TEMP/r42-registry/original"
      - name: Verify exact-NCT archive and prohibit clinical/forecast promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"r42-registry"
          raw=(d/"reviewer_evidence_r42.json").read_bytes()
          r=json.loads(raw)
          assert r["schema"]=="MAIN_R42_29_TRIAL_REGISTRY_PRIMARY_EVIDENCE"
          assert r["nctCount"]==29 and r["applicationGroupCount"]==23
          assert len(r["records"])==29 and len({x["nct"] for x in r["records"]})==29
          assert r["independentClinicalGrades"]==0
          assert r["validatedApplicationPredictions"]==0
          assert r["realHistoricalBacktests"]==0
          assert r["calibratedAccuracy"] is None
          assert r["futureFdaApprovalCrlForecast"]=="ABSTAIN"
          assert r["futureReviewDelayForecast"]=="ABSTAIN"
          assert r["trainedFdaModelAuthorized"] is False
          for x in r["records"]:
              if x.get("sourceResponseSha256"):
                  p=d/"original"/(x["nct"]+".json")
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==x["sourceResponseSha256"]
          s=[
            "## R42 original FOCUS primary-result research extraction",
            "Original registry byte retrieval is not independent clinical or FDA prediction validation",
            f'Exact trial registry records fetched: {r["registryFetched"]}/29',
            f'Current results sections present: {r["registryWithResultsSection"]}/29',
            f'Trials with primary result tables: {r["registryWithPrimaryTables"]}/29',
            f'Primary result tables captured: {r["postedPrimaryOutcomeTableCount"]}',
            "Independently signed scientific grades: 0",
            "Validated FDA predictions and independent backtests: 0",
            f'Receipt sha256: {hashlib.sha256(raw).hexdigest()}',
          ]
          print("\n".join(s))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("\n\n".join(s)+"\n")
          PY
      - name: Preserve exact original source bytes and structured numerical review findings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-r42-source-and-primary-result-research-${{ github.run_id }}
          path: ${{ runner.temp }}/r42-registry/
          retention-days: 90
          if-no-files-found: error
