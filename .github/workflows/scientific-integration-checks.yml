name: Scientific Integration Checks
on:
  push:
    branches: [feature/scientific-assessment-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_scientific_assessment.py' -v
      - run: python -m unittest discover -s tests -p 'test_scientific_assessment_adapter.py' -v
        working-directory: new-platform/backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
  live-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unauthenticated scientific assessment requests
        shell: bash
        run: |
          set -euo pipefail
          url="https://pdufa-scientific-assessment-review.onrender.com/api/scientific-assessment?exact_id=TRIAL%7CNCT00000001"
          code="$(curl --silent --show-error --location --retry 3 --retry-delay 5 --max-time 90 --output /dev/null --write-out '%{http_code}' "$url")"
          echo "Unauthenticated HTTP status: $code"
          test "$code" = "401" || { echo "::error::Expected 401; got $code"; exit 1; }
