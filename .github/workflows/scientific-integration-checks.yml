name: Scientific Integration Checks
on:
  push:
    branches: [feature/scientific-assessment-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r new-platform/backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_scientific_assessment.py' -v
      - run: python -m unittest discover -s tests -p 'test_scientific_assessment_adapter.py' -v
        working-directory: new-platform/backend
      - run: python -m unittest discover -s tests -p 'test_scientific_assessment_auth.py' -v
        working-directory: new-platform/backend
      - name: Verify read-only authenticated API acceptance
        run: python -m pytest -q tests/test_scientific_api_read_probe.py
        working-directory: new-platform/backend
      - name: Verify private exporters including deployed container copy
        run: python -m unittest discover -s tests -p 'test_render_postgres_export.py' -v
      - run: python -m unittest discover -s tests -p 'test_scientific_registry_evidence.py' -v
        working-directory: new-platform/backend
      - run: python -m unittest discover -s tests -p 'test_scientific_stored_record.py' -v
        working-directory: new-platform/backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
  live-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe scientific API without credentials
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          import sys
          url = "https://pdufa-scientific-assessment-review.onrender.com/api/scientific-assessment?exact_id=TRIAL%7CNCT00000001"
          try:
              with urllib.request.urlopen(url, timeout=90) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              status = exc.code
          except Exception as exc:
              print(f"NETWORK ERROR: {type(exc).__name__}: {exc}", flush=True)
              sys.exit(2)
          print(f"Unauthenticated HTTP status: {status}", flush=True)
          if status != 401:
              print(f"SECURITY/CONFIGURATION CHECK FAILED: expected 401, received {status}", flush=True)
              sys.exit(1)
          print("PASS: authentication enforced")
          PY

      - name: Probe isolated single-operator browser page and deny anonymous research
        shell: bash
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request
          root = "https://pdufa-scientific-assessment-review.onrender.com"
          with urllib.request.urlopen(root + "/scientific/operator", timeout=90) as response:
              html = response.read(40000).decode("utf-8")
              assert response.status == 200, response.status
              assert "Sign in with your Google account" in html
              assert "accounts.google.com/gsi/client" in html
              assert response.headers.get("X-Frame-Options") == "DENY"
              assert "no-store" in response.headers.get("Cache-Control", "")
              assert "nonce-" in response.headers.get("Content-Security-Policy", "")
          for path in ("/api/scientific-assessment/operator/me",
                       "/api/scientific-assessment/operator/research?exact_id=TRIAL%7CNCT02142738",
                       "/api/scientific-assessment/operator/worksheet/NCT02142738",
                       "/api/scientific-assessment/operator/source-comparison/NCT02142738"):
              try:
                  with urllib.request.urlopen(root + path, timeout=90) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
              assert status == 401, (path, status)
          print("PASS: Google sign-in page served; anonymous operator/science calls denied")
          PY
