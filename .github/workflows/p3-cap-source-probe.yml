name: P3 Secondary Source Readonly Probe
on:
  pull_request:
    paths: ['scripts/probe_stockanalysis_p3_caps.py', '.github/workflows/p3-cap-source-probe.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/probe_stockanalysis_p3_caps.py
