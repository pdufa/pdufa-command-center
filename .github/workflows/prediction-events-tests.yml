name: Prediction event regression tests
on:
  push:
    branches: [new-platform-bootstrap]
    paths:
      - 'new-platform/backend/app/prediction_events.py'
      - 'new-platform/backend/tests/test_prediction_events.py'
      - '.github/workflows/prediction-events-tests.yml'
      - 'new-platform/backend/scripts/smoke_prediction_sse.py'
      - '.github/workflows/prediction-staging-smoke.yml'
  workflow_dispatch:
jobs:
  prediction-events:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Check syntax
        run: python -m py_compile app/prediction_events.py tests/test_prediction_events.py scripts/smoke_prediction_sse.py
      - name: Run prediction event tests
        run: python -m pytest -q tests/test_prediction_events.py
