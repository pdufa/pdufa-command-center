name: Official source recovery safety
on:
  pull_request:
    paths:
      - 'research/official_*.py'
      - 'tests/test_official_*.py'
      - '.github/workflows/official-source-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pandas -r research/requirements-security.txt
      - run: python -m pytest -q tests/test_official_*.py tests/test_scientific_*.py tests/test_historical_decision_registry.py tests/test_prediction_v1_1_*.py tests/test_fda_*.py
      - run: python research/prediction_v1_1_catalog_validator.py
      - run: python -m research.scientific_field_catalog
      - run: python -m research.scientific_historical_verification --output research/evidence/historical_verification_worklist_20261029.json --check
