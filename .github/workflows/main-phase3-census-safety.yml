name: MAIN conservative Phase 3 census safety
on:
  pull_request:
    paths:
      - 'new-platform/frontend/app/installation-audit/page.tsx'
      - 'new-platform/frontend/lib/phase3-census-snapshot.ts'
      - 'new-platform/frontend/tests/phase3-census-snapshot.test.cjs'
      - 'data/phase3_all_years_300m_10b_status.json'
      - '.github/workflows/main-phase3-census-safety.yml'
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/app/installation-audit/page.tsx'
      - 'new-platform/frontend/lib/phase3-census-snapshot.ts'
      - 'new-platform/frontend/tests/phase3-census-snapshot.test.cjs'
      - 'data/phase3_all_years_300m_10b_status.json'
      - '.github/workflows/main-phase3-census-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conservative-census-not-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-platform/frontend/package-lock.json
      - name: Install existing frontend dependencies
        working-directory: new-platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Validate 741-trial conservative census and legacy installation gates
        working-directory: new-platform/frontend
        run: node --test tests/phase3-census-snapshot.test.cjs tests/installation-audit.test.cjs tests/installation-audit-summary.test.cjs
      - name: Typecheck installation tracker
        working-directory: new-platform/frontend
        run: npm run typecheck
