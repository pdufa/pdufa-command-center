name: MAIN Phase 3 sponsor attribution evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/phase3_sponsor_evidence.py
      - tests/test_phase3_sponsor_evidence.py
      - .github/workflows/main-phase3-sponsor-evidence.yml
      - data/phase3_all_years_300m_10b_trials.csv
jobs:
  sponsor-research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test sponsor research safeguards
        run: |
          python3 -m py_compile scripts/phase3_sponsor_evidence.py tests/test_phase3_sponsor_evidence.py
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p test_phase3_sponsor_evidence.py -v
      - name: Fetch original registry sources with bounded retries
        run: |
          for attempt in 1 2 3 4; do
            if python3 scripts/check_phase3_full_original_sources.py "$RUNNER_TEMP/registry.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Registry verification incomplete after 4 attempts; fail closed."
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Produce research-only sponsor evidence
        run: python3 scripts/phase3_sponsor_evidence.py "$RUNNER_TEMP/registry.json" "$RUNNER_TEMP/sponsor.json"
      - uses: actions/upload-artifact@v4
        with:
          name: main-phase3-sponsor-attribution-research-only
          path: |
            ${{ runner.temp }}/sponsor.json
          retention-days: 7
