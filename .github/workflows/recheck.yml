name: Legacy PDUFA Recheck (Manual Only)

on:
  workflow_dispatch:
    inputs:
      event_key:
        description: Exact event_key to recheck; leave blank for all
        required: false
        default: ""
      categories:
        description: Comma-separated categories
        required: false
        default: "pdufa_date,phase3,financing,cash_runway,market_data,ownership_insiders"

permissions:
  contents: write

jobs:
  manual-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Recheck exact event
        if: inputs.event_key != ''
        run: python scripts/recheck_events.py --event-key "${{ inputs.event_key }}" --categories "${{ inputs.categories }}"
      - name: Recheck all current events
        if: inputs.event_key == ''
        run: python scripts/recheck_events.py --all --categories "${{ inputs.categories }}"
      - name: Refresh FDA layers
        run: |
          python scripts/fda_decision_engine.py --freeze
          python scripts/fda_regulatory_signal_monitor.py
          python scripts/fda_directional_100pct.py
          python scripts/fda_pdufa_extension_tracker.py
          python scripts/fda_100_on_100_gate.py
      - name: Run repository checks
        run: python smoke_test.py
      - name: Commit manual recheck results
        run: |
          git config user.name "pdufa-recheck-bot"
          git config user.email "pdufa-recheck-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No persisted recheck changes."
          else
            git commit -m "Manual PDUFA recheck update"
            git pull --rebase origin main
            git push
          fi
