name: Precision Monitoring Production HTTP Smoke
on:
  push:
    branches: [main]
    paths:
      - 'new-platform/frontend/app/precision-monitoring/**'
      - 'new-platform/frontend/app/main/**'
      - 'new-platform/frontend/lib/main-install-progress.ts'
      - 'new-platform/frontend/app/api/main/installation-progress/route.ts'
      - '.github/workflows/precision-monitoring-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-shell-and-auth-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify actual production page over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          url="https://pdufa-new-dashboard.vercel.app/precision-monitoring"
          # Vercel's Git deployment is asynchronous; accept only the published new page.
          for attempt in $(seq 1 20); do
            if curl -fLsS --max-time 12 -o /tmp/precision-monitor.html "$url" &&
               grep -q 'PDUFA Precision Monitoring Dashboard' /tmp/precision-monitor.html; then
              echo "VERIFIED_HTTP_PAGE=$url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production precision monitoring page was not accessible after deployment"
          exit 1
      - name: Verify anonymous telemetry remains private
        shell: bash
        run: |
          set -euo pipefail
          url="https://pdufa-new-dashboard.vercel.app/api/main/installation-progress"
          # Newly deployed functions can take a moment longer than the page
          # alias to propagate. Require the exact deny response before success.
          status="not checked"
          for attempt in $(seq 1 12); do
            status="$(curl -sSL --max-time 12 -o /tmp/precision-monitor-anon.json -w '%{http_code}' "$url")"
            if [ "$status" = "401" ] && grep -q 'Sign in required' /tmp/precision-monitor-anon.json; then
              echo "VERIFIED_ANONYMOUS_API=401"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Telemetry boundary never returned authenticated-denial contract; final HTTP $status"
          exit 1
