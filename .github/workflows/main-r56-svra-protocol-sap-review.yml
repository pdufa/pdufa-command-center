name: MAIN R56 Savara original protocol SAP reconciliation research
on:
  push:
    branches: [feature/medical-stage4-verified-method-matrix-20261108]
    paths:
      - .github/workflows/main-r56-svra-protocol-sap-review.yml
      - new-platform/backend/scripts/reconcile_svra_original_protocol_sap_r56.py
      - new-platform/backend/tests/test_svra_protocol_sap_reconciliation_r56.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: main-r56-savara-public-original-source-review
  cancel-in-progress: false
jobs:
  svra-exact-pdf-statistical-reconciliation:
    if: github.repository == 'pdufa/pdufa-command-center' && github.ref == 'refs/heads/feature/medical-stage4-verified-method-matrix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-only statistical review evidence guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object new-platform/backend/app/data/focus_snapshot.json)" = "842d025951def749d4672625e13fe487a87f5e52"
          test "$(git hash-object new-platform/backend/app/data/focus_application_snapshot.json)" = "2f8d93a01a49402b1eb0c8ac1464a08b67316262"
          python -m pip install pytest pymupdf
          cd new-platform/backend
          PYTHONPATH=. python -m pytest -q tests/test_svra_protocol_sap_reconciliation_r56.py
          PYTHONPATH=. python ../../scripts/audit_raas_retirement.py --check
      - name: Retrieve immutable previously verified original R53 R54 R55 source archive
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42696796318
          name: main-r53-original-public-protocol-sap-pdf-42696796318
          path: ${{ runner.temp }}/main-r56/verified-inputs
      - name: Verify exact original clinical source bytes and generate page-anchored Savara review exceptions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/main-r56/verified-inputs"
          test -f "$root/FOCUS_23_APPLICATION_METHOD_SOURCE_CROSSWALK_R54.json"
          test -f "$root/FOCUS_23_APPLICATION_EFFICACY_SAFETY_SOURCE_REVIEW_PACKETS_R55.json"
          test -f "$root/source_protocol_sap_research.json"
          test -f "$root/public-pdfs/NCT04544293-Prot_000.pdf"
          test -f "$root/public-pdfs/NCT04544293-SAP_001.pdf"
          mkdir -p "$RUNNER_TEMP/main-r56/review"
          PYTHONPATH=new-platform/backend python new-platform/backend/scripts/reconcile_svra_original_protocol_sap_r56.py \
            --r53 "$root/source_protocol_sap_research.json" \
            --r54 "$root/FOCUS_23_APPLICATION_METHOD_SOURCE_CROSSWALK_R54.json" \
            --r55 "$root/FOCUS_23_APPLICATION_EFFICACY_SAFETY_SOURCE_REVIEW_PACKETS_R55.json" \
            --pdf-dir "$root/public-pdfs" \
            --output "$RUNNER_TEMP/main-r56/review/SVRA_ORIGINAL_PROTOCOL_SAP_RECONCILIATION_R56.json"
      - name: Verify source review taxonomy and forbid predicting or altering clinical grades
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"main-r56/review"
          p=base/"SVRA_ORIGINAL_PROTOCOL_SAP_RECONCILIATION_R56.json"
          source=p.read_bytes()
          r=json.loads(source)
          assert r["schema"]=="MAIN_R56_SAVARA_SOURCE_PAGE_VERSUS_SAP_RECONCILIATION_QUEUE"
          assert r["nct"]=="NCT04544293"
          assert r["applicationCycleId"]=="svra-molgramostim"
          assert r["original29NctRosterPreserved"] is True
          assert r["original23ApplicationGroupsPreserved"] is True
          assert len(r["verifiedCurrentPublicDocuments"])==2
          assert r["totalReviewItems"]==10
          assert r["explicitDiscrepancyReconciliationItems"]==6
          assert r["preReadoutOriginalSignedSapVersionsVerified"]==0
          assert r["independentSignedStatisticalReviewCount"]==0
          assert r["currentRegistryResultPValuesIndependentlyRecalculated"]==0
          assert r["independentlyValidatedApplicationFDAForecasts"]==0
          assert r["historicalIndependentPredictionBacktests"]==0
          assert r["measuredApprovalPredictionAccuracy"] is None
          assert r["officialFDAOutcomePrediction"]=="ABSTAIN"
          assert r["approvalProbability"] is None
          assert r["noModelTrainingClinicalOrProductionWrites"] is True
          assert len({i["id"] for i in r["pageAnchoredSourceReviewItems"]})==10
          for case in r["pageAnchoredSourceReviewItems"]:
            assert case["clinicalMaterialityAdjudicated"] is False
            assert case["originalAmendmentChainVerified"] is False
            assert case["statisticalProtocolConsistencyReviewedAndSigned"] is False
            assert case["FDAOutcomeInferenceAuthorized"] is False
            assert all(e["pdfPageOneBased"]>=1 and e["pageTextExcerpt"]
                       for e in case["sourceLeads"])
          msg=("R56 Savara IMPALA-2: 2 exact original SHA-pinned PDFs checked, "+
            str(r["totalReviewItems"])+" cited research items, "+
            str(r["explicitDiscrepancyReconciliationItems"])+" specifically acknowledged or apparent "+
            "method reconciliation leads, pre-readout SAP chronology unresolved, "+
            "0 signed scientific grades and 0 FDA forecasts. "+
            "Review receipt SHA-256: "+hashlib.sha256(source).hexdigest())
          print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## R56 Savara source-grounded protocol/SAP review queue\n\n"+msg+"\n")
          PY
      - name: Preserve source SHA and page citation review notes; never modify source PDFs or clinical ledger
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: main-r56-savara-original-protocol-sap-review-${{ github.run_id }}
          path: ${{ runner.temp }}/main-r56/review/
          retention-days: 90
          if-no-files-found: error
