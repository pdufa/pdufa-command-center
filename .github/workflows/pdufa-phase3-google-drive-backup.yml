name: PDUFA Phase 3 Google Drive Backup

# Follow successful official registry collection, and provide a daily fallback
# because pushes made by GITHUB_TOKEN do not always start another workflow.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Refresh TOOLS Phase 3 results-posting spreadsheets"
      - "All-years Phase 3 market-cap census"
      - "PDUFA Overnight Sequential Scans"
    types: [completed]
  schedule:
    - cron: '20 13 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_phase3_registry_tabs_to_google_drive.py'
      - 'tests/test_sync_phase3_registry_tabs_to_google_drive.py'
      - '.github/workflows/pdufa-phase3-google-drive-backup.yml'
      - 'new-platform/frontend/public/phase3-registry-postings-current.json'

permissions:
  contents: read

concurrency:
  group: pdufa-phase3-google-drive-backup
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read latest completed registry snapshot from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate saved source classification
        run: python -m unittest discover -s tests -p test_sync_phase3_registry_tabs_to_google_drive.py -v
      - name: Install Google Sheets service account API
        run: python -m pip install google-auth requests
      - name: Back up both tabs and verify all ticker/NCT rows read back
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_phase3_registry_tabs_to_google_drive.py
      - name: Explain result
        if: always()
        run: |
          {
            echo "## Phase 3 Google Drive backup"
            echo "Two independently named tabs: **Phase 3 Before**, **Phase 3 Past**."
            echo "Classification is ClinicalTrials.gov results-posting, not company-announced Phase 3 topline."
            echo "A successful backup is proven by exact NCT/ticker readback in both tabs."
            echo "Source: new-platform/frontend/public/phase3-registry-postings-current.json"
            echo "Google Drive workbook: https://docs.google.com/spreadsheets/d/1erY_z62b4mHhx5s_3HgJxXoJEslbLngMuQNfhcuSviU/edit"
          } >> "$GITHUB_STEP_SUMMARY"
