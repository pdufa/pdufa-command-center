name: PDUFA Telegram send test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pdufa-telegram-send-test.yml'

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send test alert to configured Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_scan_alert.py --event test --details 'Test notification; no scan started and no predictions changed.' --url "$RUN_URL"
