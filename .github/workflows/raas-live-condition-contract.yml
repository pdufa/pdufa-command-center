name: RAAS Live CTgov Condition Contract
on:
  pull_request:
    paths:
      - scripts/raas_registry_evidence_harvest.py
      - .github/workflows/raas-live-condition-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual ClinicalTrials.gov condition module and extracted receipt
        run: |
          python - <<'PY'
          from scripts.raas_registry_evidence_harvest import request_batch, extract
          for nct,ticker in (("NCT05535946","ABVX"),("NCT07363577","LBRX")):
              trial=request_batch([nct])[nct]
              protocol=trial.get("protocolSection") or {}
              conditions=protocol.get("conditionsModule")
              assert isinstance(conditions,dict), f"{nct}: source conditionsModule is absent; section keys: {list(protocol)}"
              terms=conditions.get("conditions")
              assert isinstance(terms,list) and any(isinstance(x,str) and x.strip() for x in terms), f"{nct}: no source condition names"
              receipt=extract(nct,ticker,trial,"2026-11-04T23:00:00Z")
              assert receipt["registeredConditions"], f"{nct}: extraction discarded source condition names"
              print(nct,"registry named conditions:",receipt["registeredConditions"][:5],
                  "interventions:",receipt["registeredInterventions"][:5])
          PY
