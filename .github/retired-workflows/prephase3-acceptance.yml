name: PIPELINE Early Clinical Live Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prephase3-acceptance.yml"
      - "scripts/prephase3_live_acceptance.cjs"
      - "app.py"
      - "pre_readout_score.py"
      - "pre_phase3_pilot_scores.py"
      - "pre_phase3_priority.py"
      - "pre_phase3_scoring_review.py"
      - "step7_live.py"
      - "step7_cached_snapshot.py"
      - "scripts/publish_step7_feed.py"
      - "requirements.txt"
      - "pre_phase3_readiness.py"
      - "data/phase3_pre_readout_evidence.csv"
      - "data/pre_phase3_pilot_clinical_reviews.json"
      - "data/step7_pre_phase3_feed.csv"
      - "data/step7_live_status.json"
      - "data/step7_financing_review.csv"

permissions:
  contents: read

concurrency:
  group: prephase3-live-acceptance
  cancel-in-progress: true

jobs:
  verify-clinical-tab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser instrumentation
        run: npm install --no-save playwright-core
      - name: Verify Chrome on runner
        shell: bash
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/google-chrome-stable ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome-stable" >> "$GITHUB_ENV"
          else
            echo "::error::Google Chrome not available on runner"
            exit 1
          fi
      - name: Allow Streamlit Cloud to sync published cache
        run: sleep 75
      - name: Verify PIPELINE early-clinical checklist and pilot scores
        run: node scripts/prephase3_live_acceptance.cjs
      - name: Upload screenshot and acceptance checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prephase3-live-acceptance
          path: prephase3-acceptance-artifacts/
          if-no-files-found: warn
          retention-days: 14
