name: PDUFA Complete Verification Repair Handoff 2026-10-14
# Resume after exact 45-claim source recheck succeeded but an unrelated
# dashboard navigation test failed. Preserve that failure in logs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pdufa-complete-verification-repair-20261014.yml']
permissions:
  actions: write
  contents: write
concurrency:
  group: pdufa-targeted-scoring-gem-20261014
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '38575279522'
      VERIFY_RUN_ID: '38593252859'
    steps:
      - name: Checkout latest trusted main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 1. Verify finished targeted scan and recover exact evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFY_RUN_ID" > "$RUNNER_TEMP/verify-run.json"
          python - "$RUNNER_TEMP/verify-run.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          if obj.get("name") != "PDUFA Sequential Verification Repair 2026-10-14":
              raise SystemExit("Wrong source recheck workflow")
          if obj.get("status") != "completed":
              raise SystemExit("Source recheck workflow still running")
          # Previous workflow failed only because a distinct navigation regression
          # test failed, AFTER targeted source verification had passed. We verify
          # its output artifact independently instead of inferring full success.
          PY
          gh run download "$VERIFY_RUN_ID" \
            -n "pdufa-targeted-verification-repair-$VERIFY_RUN_ID" \
            -D "$RUNNER_TEMP/verified"
          python - "$RUNNER_TEMP/verified" "$SOURCE_RUN_ID" <<'PY'
          import csv,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          report=json.loads((root/"data/pdufa_targeted_recheck_report.json").read_text())
          csvfile=root/"data/pdufa_targeted_recheck_results.csv"
          with csvfile.open(newline="",encoding="utf-8-sig") as fh:
              rows=list(csv.DictReader(fh))
          if (report.get("source_report_run_id") != sys.argv[2]
              or report.get("findings_due") != 45 or len(rows) != 45
              or report.get("source_baseline_unchanged") is not True
              or report.get("trade_entry_authorized") is not False
              or report.get("recheck_ledger_sha256") != hashlib.sha256(csvfile.read_bytes()).hexdigest()):
              raise SystemExit("Missing or tampered exact-event source recheck artifact")
          if report.get("required_findings_unresolved")+report.get("findings_verified") != 45:
              raise SystemExit("Recheck has unreconciled counts")
          print("Verified exact 45-claim comparison; unresolved:",report["required_findings_unresolved"])
          PY
          cp "$RUNNER_TEMP/verified/data/pdufa_targeted_recheck_report.json" data/
          cp "$RUNNER_TEMP/verified/data/pdufa_targeted_recheck_results.csv" data/
      - name: 2. Run scoring-input regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_score_input_audit.py tests/test_nightly_scoring_audit.py
      - name: 3. Report separate dashboard navigation test failure (not a scoring assertion)
        continue-on-error: true
        run: |
          python -m pytest -q tests/test_scoring_tab_navigation.py
      - name: 4. Generate source-bound scoring audit
        run: |
          python -m scripts.nightly_scoring_audit \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-workflow "PDUFA Nightly FDA SEC Financial Market Issuer Sources" \
            --source-conclusion success \
            --out data/nightly_scoring_audit.json
      - name: 5. Publish evidence-preserving recheck comparison and scoring audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdufa-focus"
          cp data/pdufa_targeted_recheck_report.json data/pdufa_targeted_recheck_results.csv data/nightly_scoring_audit.json "$RUNNER_TEMP/pdufa-focus/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B completed-focused-review origin/main
            python - "$SOURCE_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path("data/pdufa_source_report.json").read_text())
          if report.get("latest_run_id") != sys.argv[1]:
              raise SystemExit("Fresh source run replaced baseline; publication safely blocked")
          PY
            cp "$RUNNER_TEMP/pdufa-focus/"* data/
            git add data/pdufa_targeted_recheck_report.json data/pdufa_targeted_recheck_results.csv data/nightly_scoring_audit.json
            if git diff --cached --quiet; then
              echo "Scoring and recheck outputs already match latest main."
              exit 0
            fi
            git commit -m "Publish all 45 targeted source rechecks and current scoring audit"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::Could not publish completed source review"
          exit 1
      - name: 6. Dispatch GEMS research re-verification after published scoring
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/gem-research-quality.yml/dispatches" \
            -f ref=main -f 'inputs[action]=REVERIFY_PARTIAL'
          echo "GEMS recheck dispatched only after evidence and scoring audit published."
      - name: Archive evidence and score audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdufa-finished-focus-${{ github.run_id }}
          path: |
            data/pdufa_targeted_recheck_report.json
            data/pdufa_targeted_recheck_results.csv
            data/nightly_scoring_audit.json
          retention-days: 30
          if-no-files-found: warn
